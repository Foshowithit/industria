/* ── ENTRANCE ───────────────────────────────────────────────────────────── */
let entered = false;
function enter() {
  if (entered) return; entered = true;
  $('gate').style.display = 'none';
  renderer.domElement.requestPointerLock?.();
  audioGo();                       // browsers only allow audio from a gesture
  startShift(G.DEFAULT_JOB_ID, { announce: false, carry: false });
  if (REC) REC.sessionStart({ game: GAME, clocks });
}
/** ── START A SHIFT. THE ONE RESET PATH. ──────────────────────────────────
   Every way into a job comes through here: the gate at the start of the game,
   the card on the job board, and the `job()` hook the acceptance gate drives.
   One path, so a player and a test cannot disagree about what a fresh job
   looks like — which is the same rule the kernel follows about the bore.

   `carry` moves the day's money forward. `newGame(job, thermal, money)` has
   taken a carried balance since it was written and nothing ever passed one.

   THE PER-PART STATE DIES WITH THE PART. Everything in the block below is a
   fact about the casting that was in the machine — the dial you had set, the
   reading you took, whether a part was still live for a second cut. None of it
   belongs to the next job, and leaving any of it set is how a new job would
   silently start with the old job's dial still on it. */
function startShift(jobId, { announce = true, carry = true } = {}) {
  const spec = G.jobById(jobId || G.DEFAULT_JOB_ID);
  const carried = (carry && GAME) ? GAME.money : 0;

  GAME = G.newGame(spec, undefined, carried);

  clocks.world_min = START_SHIFT_MIN;
  clocks.job_min = START_SHIFT_MIN;   // your clock starts at 05:55 too
  clocks.job_taken = true;            // the shift is yours; the deadline is what can hurt you
  opMin = 0;
  clockFloorMin = 0;
  GAME.clock_min = clocks.job_min;
  earlIdleSince = START_SHIFT_MIN;

  biteCmd_um = 0; predicted_um = null; lastRead = null; revealed = null;
  partStillLive = false; secondPartSeen = false;
  achebeDue = null; shipWindow = null; GONE_SENT = false;
  roughBite_mm = 0.3; roughFeed_mm_rev = 0.12;

  buildPartMesh(spec.start_hole_dia_mm, spec.bore_depth_mm);
  syncFloor();
  syncBoard();

  /* A NEW MORNING, AND THE LOG STARTS WITH IT. The van took yesterday's parts
     and yesterday's lines belong to yesterday; leaving them above today's would
     print "Clocked on, 05:55" twice in the same panel, which is how a reader
     stops trusting the panel. The recorder keeps the full session either way. */
  $('log').innerHTML = '';
  logLine(`<b>${W.hhmm(START_SHIFT_MIN)}.</b> Clocked on. ` +
    `<b>${spec.client}</b> on the bench — Ø${spec.nominal_mm} ${spec.grade}.`);
  if (announce) {
    toast(`<b>${spec.title}</b><br>${spec.client} · £${spec.rate} · ` +
      `band ${spec.band_low_mm.toFixed(3)}–${spec.band_high_mm.toFixed(3)} mm · ` +
      `van ${W.hhmm(G.departsMin(spec))}`, 7000);
  }
  if (REC) REC.action('start_shift', { job_id: spec.id, carried_money: carried,
    nominal_mm: spec.nominal_mm, start_hole_dia_mm: spec.start_hole_dia_mm });
  return GAME;
}

/** Take the next job off the board. Refused while the current one is still in
 *  the machine — not as a progression gate, but because it is not tomorrow
 *  until this one is on the rack or in the bin, and Earl would say so. */
function takeJob(id) {
  if (!GAME.finished) {
    say('Earl', "\u201cFinish what's in the machine first. It isn't tomorrow until " +
      "that one's either on the rack or in the bin.\u201d");
    if (REC) REC.refusal('take_job', 'JOB_NOT_SETTLED', { clock_min: GAME.clock_min });
    return false;
  }
  startShift(id);
  return true;
}
$('gate').onclick = enter;
/* clicking back into the canvas re-captures the mouse without restarting */
renderer.domElement.addEventListener('click', () => {
  if (entered) { renderer.domElement.requestPointerLock?.(); audioGo(); }
});

/* ── MAIN LOOP ──────────────────────────────────────────────────────────── */
const SPD_WALK = 2.5, SPD_RUN = 5.0;
let prev = performance.now(), fpsN = 0, fpsT = prev, FPS = 0;
let recSampleAccum = 0;

function frame(now) {
  requestAnimationFrame(frame);
  const dtReal = Math.min((now - prev) / 1000, 0.25); prev = now;
  fpsN++; if (now - fpsT > 500) { FPS = fpsN / ((now - fpsT) / 1000); fpsN = 0; fpsT = now; }

  if (entered && GAME) {
    /* ── THE TWO CLOCKS, and why there are two ─────────────────────────────
       `world_min` is the WORLD's pace and is purely for life: light, machines
       cycling, the shift moving. `job_min` is YOUR clock and it is the one the
       deadline is measured in — it only starts once the work is yours, and it
       runs at half the ambient rate so that 8 h of shift is ~80 real minutes.

       The invariant, from world.mjs and kept here: you can lose this job for a
       DECISION, never for taking a long time to UNDERSTAND something. Nothing
       below may punish the player for being new. */
    W.advanceClocks(clocks, dtReal);
    if (clocks.job_min + opMin < clockFloorMin) opMin = clockFloorMin - clocks.job_min;
    GAME.clock_min = clocks.job_min + opMin;
    if (clocks.world_min < GAME.clock_min) clocks.world_min = GAME.clock_min;

    /* ── ROUND 9 — the two things on this floor that happen on THEIR clock ──
       Neither of these is a message. The van arrives because it is booked to
       arrive, and it leaves with whatever is standing on the rack when it
       does. Mr. Achebe walks over twenty minutes after a part is scrapped,
       because that is how long it takes him to try a bearing and give up. */
    courierBeat(GAME.clock_min, dtReal);
    achebeBeat();

    /* §104 beats — keyed to YOUR clock, not the world's */
    for (const b of BEATS) if (!b.done && GAME.clock_min >= b.at) { b.done = true; b.run(); }

    /* he stops looking up — keyed to lateness, not to a nag timer */
    if (GAME.clock_min - lastEarlAt > 3 && GAME.clock_min - earlIdleSince > 7) {
      const late = GAME.clock_min > GAME.job.deadline_min - 20;
      say('Earl', P.EARL_LINES[late ? 'impatient_3' : 'impatient_2'][0]);
      earlIdleSince = GAME.clock_min; lastEarlAt = GAME.clock_min;
    }

    /* movement */
    const fwd = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
    const rgt = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
    const mv = new THREE.Vector3();
    if (keys.KeyW) mv.add(fwd); if (keys.KeyS) mv.sub(fwd);
    if (keys.KeyD) mv.add(rgt); if (keys.KeyA) mv.sub(rgt);
    if (mv.lengthSq()) {
      mv.normalize().multiplyScalar((keys.ShiftLeft || keys.ShiftRight ? SPD_RUN : SPD_WALK) * dtReal);
      eye.add(mv);
      eye.x = cl(eye.x, -ROOM.w / 2 + 1, ROOM.w / 2 - 1);
      eye.z = cl(eye.z, -ROOM.d / 2 + 1, ROOM.d / 2 - 1);
      earlIdleSince = clocks.world_min;   // walking around is not idling
    }
    /* head bob — small, and it stops when you stop */
    const bob = mv.lengthSq() ? Math.sin(now / 145) * 0.012 : 0;
    if (shake > 0) shake = Math.max(0, shake - dtReal * 0.09);
    const sh = shake * (Math.random() - 0.5) * 2;

    camera.position.set(eye.x + sh, eye.y + bob + sh * 0.6, eye.z);
    camera.rotation.set(pitch, yaw, 0, 'YXZ');

    /* machine motion, from the kernel's own commanded rpm */
    const mo = W.machineMotion(GAME);
    spindleGroup.rotation.y = mo.spindleRev * Math.PI * 2;
    screw.rotation.x = mo.feed_mm_min * 0.02 * (now / 1000);
    const cutting = !!(GAME.part.cutting || GAME.history.slice(-1)[0]?.cut_min);
    coolantJet.visible = GAME.machine.spindle_on;
    puddle.visible = GAME.history.length > 2;
    /* light follows the clock — §49, and it is the clock you can SEE */
    const dl = W.daylight(clocks.world_min);
    sun.intensity = 0.25 + 0.55 * (1 - dl.dawn) * (1 - dl.dusk);
    for (const l of LAMPS) l.material.emissiveIntensity = dl.shop_lights ? 2.4 : 0.06;
    for (const pl of scene.children.filter((c) => c.isPointLight)) pl.intensity = dl.shop_lights ? 2.1 : 0.10;
    for (const b of PRACTICALS) b.intensity = dl.shop_lights ? 1.5 : 0.0;

    /* bore geometry re-derived every frame, so the mesh cannot drift off the number */
    if (PART.mesh) {
      const d = GAME.part.holeDia_cold_mm;
      if (Math.abs((PART.mesh.userData.d ?? 0) - d) > 1e-5) {
        PART.mesh.userData.d = d; buildPartMesh(d, GAME.job.bore_depth_mm);
      }
    }
    stepChips(dtReal);
    updateLook();
    machinePanel();

    /* AUDIO — the machine's sound is its state, not a loop (§13) */
    if (audioReady) {
      const last = GAME.history[GAME.history.length - 1];
      const a = GAME.machine.spindle_on
        ? acousticsFrom(last, GAME)
        : W.idleAcoustics(GAME.mach, { rpmFrac: 0, spindle_on: false });
      driveMachineVoice('mine', new THREE.Vector3(0, 1.6, -7), a,
        { chatter_Hz: GAME.mach.fn_Hz, coolant: GAME.machine.spindle_on });
      /* the two machines that are not yours, on their own jobs, always running */
      driveMachineVoice('vmc2', OTHER1.g.position,
        acousticsFrom({ n_rpm: GAME.mach.n_max * 0.55, power_kW: 5.2, bite_effective_um: 1200,
          force_N: 320, verdict: 'CUTS CLEAN' }, GAME),
        { chatter_Hz: 1180 });
      const other3Chatter = Math.sin(now / 2600) > 0.2;
      driveMachineVoice('vmc3', OTHER2.g.position,
        acousticsFrom({ n_rpm: GAME.mach.n_max * 0.31, power_kW: 3.1,
          bite_effective_um: other3Chatter ? 180 : 1900,
          force_N: other3Chatter ? 120 : 260,
          verdict: other3Chatter ? 'CHATTER' : 'CUTS CLEAN' }, GAME),
        { chatter_Hz: 760 });
    }
    /* footsteps — you are a body, and a body makes noise (§50, §51) */
    if (mv.lengthSq()) {
      stepAccum += dtReal * (keys.ShiftLeft || keys.ShiftRight ? 3.1 : 1.9);
      if (stepAccum >= 1) { stepAccum = 0; if (audioReady) AUD.footstep({ gain: 0.5 }); }
    }

    /* HUD */
    $('hJob').textContent = GAME.job.title;
    $('hCli').textContent = `${GAME.job.client} · ${GAME.mat.label}`;
    $('hClock').textContent = G.hhmm(clocks.world_min);
    const late = clocks.world_min > GAME.job.deadline_min;
    $('hDue').textContent = `due ${G.hhmm(GAME.job.deadline_min)}` + (late ? ' — LATE' : '');
    $('hDue').className = 'deadline' + (late ? ' late' : '');
    /* ── R1: TRUTH IS NOT OBSERVATION ──────────────────────────────────────
       `part.holeDia_cold_mm` is the truth. It is NEVER rendered. The only
       diameter the player may see is the last GAUGE reading, with its own
       resolution — so the HUD can be wrong about the part, exactly as a real
       one is. Until you measure, it says so. */
    $('hGauge').textContent = lastRead
      ? `Ø${lastRead.mm.toFixed(4)} ±${lastRead.sigma_um.toFixed(2)} µm`
      : 'not measured';
    $('hBand').textContent = `${GAME.job.band_low_mm.toFixed(3)}–${GAME.job.band_high_mm.toFixed(3)}`;
    /* MONEY NOW CROSSES DAYS. `money` is the balance the shop is carrying;
       `finished` is what THIS job settled at. Before L2 the two were the same
       number because there was only ever one job, and the line said "on the
       day". Both are shown now, because a total that only goes up is not the
       same fact as what the last part was worth. */
    const todayNet = GAME.finished ? GAME.finished.net : 0;
    $('hMoney').innerHTML = `ON THE DAY <b>${money(todayNet)}</b>` +
      (GAME.money !== todayNet ? ` · BANKED <b>${money(GAME.money)}</b>` : '') +
      (FPS ? ` <span style="opacity:.45">${FPS.toFixed(0)}fps</span>` : '');
    /* ── THE FLOOR, as counts of objects. See the note beside #hFloor. ──── */
    {
      const rack = G.rackParts(GAME), bin = G.binParts(GAME), gone = G.goneParts(GAME);
      const until = G.departsMin(GAME.job) - GAME.clock_min;
      const van = GAME.courier.left
        ? `<span class="vandone">van gone${gone.length ? ', 1 collected' : ', nothing on it'}</span>`
        : (until <= 0
            ? '<span class="vanout">van leaving</span>'
            : `<span class="${until < 10 ? 'vanout' : ''}">van ${G.hhmm(G.departsMin(GAME.job))}` +
              ` — ${until.toFixed(0)} min</span>`);
      $('hFloor').innerHTML =
        `<div><s>crate</s> <b>${GAME.stock_on_hand}</b> · <s>table</s> ` +
        `<b>${GAME.part.mounted ? (G.currentPart(GAME) || {}).id || 'part' : 'empty'}</b></div>` +
        `<div><s>rack</s> <b>${rack.length}</b>/${GAME.rack_slots} · <s>bin</s> <b>${bin.length}</b></div>` +
        `<div>${van}</div>`;
    }

    /* ── THE RECORDER'S ONE TIMER ──────────────────────────────────────────
       2 Hz. Cheap enough to be invisible, dense enough that a hesitation is
       visible as a gap. It samples whether a prompt is CURRENTLY on screen,
       which is what lets the analysis separate "did not understand" from
       "was never asked" — the two failures that look identical in a log that
       only records keypresses. */
    if (REC) {
      recSampleAccum += dtReal;
      if (recSampleAccum >= 0.5) {
        recSampleAccum = 0;
        const kk = Object.keys(keys).filter((k) => keys[k]);
        /* Post-ship window: the manual asks "do they look around? touch
           something? re-check the machine?" Moving and looking ARE that
           behaviour, so they are tapped here rather than inferred later. */
        if (shipWindow && !shipWindow.closed) {
          if (kk.some((k) => /^(KeyW|KeyA|KeyS|KeyD|Arrow)/.test(k))) tapShipWindow('move', kk.join('+'));
          else if (lookingAt) tapShipWindow('look', lookingAt.name);
        }
        const sayEl = $('talk');
        REC.sample({
          clock_min: GAME.clock_min, phase, looking_at: lookingAt ? lookingAt.name : null,
          prompt_visible: !!lookingAt, prompt_text: lookingAt ? lookingAt.verb : null,
          say_visible: !!(sayEl && sayEl.innerHTML.length > 4),
          keys_held: kk, money: GAME.money, history_len: GAME.history.length,
          measurements: GAME.shots, tool: GAME.tool ? GAME.tool.label : null,
        });
      }
    }
  }
  renderer.render(scene, camera);
}
requestAnimationFrame(frame);

/* ── debug handle (not part of play) ────────────────────────────────────── */
window.INDUSTRIA = {
  scene, camera, renderer, THREE, cell, eye,
  get game() { return GAME; }, clocks, W, G, P,
  get fps() { return FPS; },
  camp: () => ({ eye, yaw, pitch, fps: FPS }),
  /* Press the real buttons without walking. Used by the build gate so the
     acceptance test exercises the same code the player does, not a copy. */
  /* `act` is meant to be indistinguishable from a player pressing E on the same
     object, so it taps the post-ship window exactly as the E key handler does.
     Without this the window silently under-reports: a scripted run that kept
     interacting looked identical to a player who stopped dead, which is the one
     distinction the window exists to make. */
  act: (name) => { const L = LOOK.find((e) => e.name.toLowerCase().includes(name.toLowerCase()));
    if (!L) return { ok: false, why: 'no such thing', have: LOOK.map((e) => e.name) };
    tapShipWindow('interact', L.name);
    L.act(); return { ok: true, did: L.name }; },
  items: () => LOOK.map((e) => e.name),
  audio: () => ({ ready: audioReady, api: !!(globalThis.AudioContext || globalThis.webkitAudioContext),
                  ctx_state: AUD && AUD.context ? AUD.context.state : null }),
  carry: CARRIED, seen: SEEN,
  setBite: (um) => { biteCmd_um = um; if (REC) REC.action('set_dial', { dial_um: um, via: 'panel', clock_min: GAME ? GAME.clock_min : null }); },
  /* The prediction, for automated runs. `predicted_um` is a player MODEL, so
     this is the one action that has no meaning when scripted — a bot writing
     its own prediction proves nothing about a human's. Scripted runs therefore
     state 0 µm, which is an honest naive model and exercises the same code path
     the player does, and the recorded sessions keep predict/result pairs that
     can be told apart from a person's by their uniformity. */
  predict: setPrediction,
  getPredicted: () => predicted_um,
  cut: doCut, measure: doMeasure, inspect: doInspect, rough: doRough,
  /* ── ROUND 2 VERBS ───────────────────────────────────────────────────────
   * Exposed so the acceptance gate drives the same functions the keys drive,
   * not a copy of them. `envelope` is the load meter's own source, so a test
   * asserting "this move is refused for power" and a player reading the meter
   * before pressing R are looking at the same computation. */
  envelope: (bite_mm, feed_mm_rev) => G.envelope(GAME,
    { bite_mm: bite_mm === undefined || bite_mm === null ? roughBite_mm : bite_mm,
      feed_mm_rev: feed_mm_rev === undefined || feed_mm_rev === null ? roughFeed_mm_rev : feed_mm_rev,
      vc: 120 }),
  setRough: (bite_mm, feed_mm_rev) => {
    if (bite_mm !== undefined && bite_mm !== null) roughBite_mm = bite_mm;
    if (feed_mm_rev !== undefined && feed_mm_rev !== null) roughFeed_mm_rev = feed_mm_rev;
    refreshLoadMeter();
    return { bite_mm: roughBite_mm, feed_mm_rev: roughFeed_mm_rev };
  },
  getRough: () => ({ bite_mm: roughBite_mm, feed_mm_rev: roughFeed_mm_rev }),
  jobs: () => G.JOBS.map((j) => ({ id: j.id, title: j.title, client: j.client })),
  /* Switching jobs is what lets the gate (and a player who wants the big part)
     move between J1's lesson and J2's. It rebuilds from a fresh job spec, so
     nothing of the old part — thermal history, dial offset, passes — leaks
     across, which is the same discipline `newGame` already carries. */
  job: (id) => {
    if (!id) return GAME ? GAME.job.id : null;
    /* THE SAME DOOR THE BOARD USES. This hook used to rebuild GAME by hand and
       skip everything around it — the clocks, the scene, the part mesh and the
       per-part state — so a gate that switched jobs and a player who switched
       jobs were looking at two different games. */
    startShift(id, { carry: true });
    return G.jobById(id).id;
  },
  warm: doWarmUp, touch: doTouchOff, vibe: (n) => vibrate(n),
  /* `loadTool` was the one verb with no exposed entry point, which meant the
     acceptance gate could not set the machine up at all. Same function the
     player's LOOK item calls. */
  tool: (id) => loadBar(id),
  /* ── ROUND 9 — THE FLOOR, FOR THE FOUR-HISTORY TEST ─────────────────────
     `floor` is the whole point of the round's verification: it reports what
     an observer sees WITH THE MACHINE HIDDEN. It calls the game layer's own
     `floorObservables()`, so the acceptance harness and the game cannot
     disagree about what happened — there is one derivation and both read it.
     `syncFloor` is called first so the meshes are brought level with the
     register before anything is read. */
  floor: () => { syncFloor(); return G.floorObservables(GAME); },
  /* The meshes, as opposed to the state. Asserted separately and on purpose:
     a part that is on the rack in the register but invisible in the scene is
     exactly the class of lie this round exists to remove, and only a check
     that reads BOTH can catch it. */
  floorMeshes: () => {
    syncFloor();
    return {
      crate_drawn: crateParts.filter((o) => o.visible).length,
      rack_drawn: rackObjects.filter((o) => o.visible).length,
      bin_drawn: scrapObjects.filter((o) => o.visible).length,
      fixture_clamps: !!(clampL.visible && clampR.visible),
      parallel_bars: !!fixtureParallels.visible,
      part_mesh_in_cell: !!(PART.mesh && PART.mesh.parent === cell),
      part_mesh_visible: !!(PART.mesh && PART.mesh.visible),
      van_visible: !!VAN.visible, van_z: +VAN.position.z.toFixed(2),
    };
  },
  /* The lifecycle verbs, exposed so the gate drives the shipped functions. */
  fetchBlank: doFetchBlank,
  ship: doInspect,
  /* Push the clock forward WITHOUT playing. This is a test rig, not a cheat:
     the four-history fork needs a history that is accepted AND late, and the
     only other way to produce one is to sit through twenty real minutes of
     job clock. It moves `clocks.job_min` and the floor together, exactly as
     elapsed time would, and it is called out in the receipt. */
  advanceTo: (min) => {
    if (!GAME) return null;
    const want = Math.max(GAME.clock_min, min);
    clocks.job_min = want - opMin;
    clockFloorMin = Math.max(clockFloorMin, want);
    GAME.clock_min = want;
    if (clocks.world_min < want) clocks.world_min = want;
    return GAME.clock_min;
  },
  courier: () => ({ ...GAME.courier, rack: G.rackParts(GAME).map((p) => p.id),
    bin: G.binParts(GAME).map((p) => p.id),
    until_min: +(G.untilCourier_min(GAME)).toFixed(2) }),
  /* Force the courier resolution. Same function the frame loop calls, so the
     forced path and the played path cannot diverge. */
  courierNow: () => { const d = G.courierDepart(GAME); if (d.ok) { GONE_SENT = !!d.loaded; syncFloor(); } return d; },
  register: () => GAME.part_register.map((p) => ({ ...p })),
  blankStock: () => GAME.stock_on_hand,
  /* The recorder, reachable from the runner so a session can be closed out
     cleanly with a real verdict instead of a truncated file. Null on the
     public build, because `?rec` was not in the URL. */
  rec: REC, recStats: () => (REC ? REC.stats() : null),
  /* ── GET THE SESSION OUT OF THE BROWSER ──────────────────────────────────
   * The offline capture in recorder.mjs means a session played on the PUBLIC
   * url is fully recorded with no server anywhere. These three are how it
   * leaves: `recLocal()` says how much is held and what was dropped, and
   * `recExport()` downloads the .jsonl. Exposed as functions, not as a button,
   * because the field kit's observer decides when the session is over — and a
   * tester who has to be told a key combination will not find it. */
  recLocal: () => (RECmod.localStats ? RECmod.localStats() : null),
  /* Force the buffer into localStorage and report. Exposed so the acceptance
     test can assert the fast-ship path, which is the one that used to lose the
     offer entirely. */
  recFlushLocal: () => (RECmod.flushLocal ? RECmod.flushLocal() : null),
  recExport: () => (RECmod.downloadLocal ? RECmod.downloadLocal() : { ok: false, why: 'no exporter' }),
  recDump: () => (RECmod.localDump ? RECmod.localDump() : null),
  /* ── THE OBSERVER'S CHANNEL (field manual §4) ────────────────────────────
   * The observer writes on paper, but the codes have to land in the SAME JSONL
   * as the machine events or they cannot be correlated — and the correlation
   * is the whole design: the observer writes six words, the recorder holds the
   * physics. This handle is what the facilitator's page-console helper (or the
   * selftest) calls. It is deliberately tiny and validated: an unknown code
   * throws rather than being silently dropped, because a dropped code is
   * indistinguishable from "the observer never saw it". */
  obs: (code, words, extra) => {
    if (!REC) return { ok: false, why: 'not recording' };
    try { REC.observerEvent(code, words, extra || {}); return { ok: true, code }; }
    catch (e) { return { ok: false, why: String(e && e.message) }; }
  },
  obsCodes: () => Object.keys(REC ? REC.OBSERVER_CODES : {}),
  obsQuote: (category, text, when) => {
    if (!REC) return { ok: false, why: 'not recording' };
    REC.quote(category, text, when); return { ok: true };
  },
  obsHelp: (rung, opts) => {
    if (!REC) return { ok: false, why: 'not recording' };
    REC.helpAsked(rung, opts || {}); return { ok: true };
  },
  obsSilence: (kind, seconds, opts) => {
    if (!REC) return { ok: false, why: 'not recording' };
    REC.silence({ kind, seconds, ...(opts || {}) }); return { ok: true };
  },
  recEnd: (reason) => {
    if (!REC) return null;
    /* Close an OPEN post-ship window before the final row. A session that ends
       one second after shipping still produced a behaviour worth recording —
       "shipped it and immediately stopped" is a real, and telling, result. */
    closeShipWindow('session_end');
    REC.sessionEnd({ reason: reason || 'runner_close', clock_min: GAME ? GAME.clock_min : null,
      money: GAME ? GAME.money : null, history_len: GAME ? GAME.history.length : null,
      measurements: GAME ? GAME.shots : null, finished: GAME ? GAME.finished : null });
    return REC.stats();
  },
};
</script>
</body>
</html>
