 *
 * A chip is a 10-triangle tetrahedron: the right answer is a bright diffuse
 * surface, not a polished one. The old material was metalness 0.9, and a metal
 * has almost no diffuse response — it shows you only what it reflects, so a
 * chip sitting in a dark cavity renders as a black speck and the HUD ends up
 * describing a chip the player cannot see. This is that fix.
 *
 * Shared (and therefore never disposed) because a per-chip material would be
 * disposed on eviction while other chips still referenced it. */
const CHIP_MAT = new THREE.MeshStandardMaterial({ color: 0xc8ccd0, roughness: 0.35, metalness: 0.12 });
const CHIP_GEO = new THREE.TetrahedronGeometry(1.0);
function chipsFromPass(rec, material) {
  const info = W.chipFromPass(rec, material);
  /* THE TRAY AGREES WITH THE SPRAY. Both take their colour from the same
     `chipFromPass` return, so there is no way for the chips on the floor and
     the chips you can read to describe two different cuts. */
  if (info && info.colour_hex) {
    try { CHIP_MAT.color.set(info.colour_hex); } catch (e) {}
    try { M.chip.color.set(info.colour_hex); } catch (e) {}
  }
  LAST_CHIP = info;
  /* Emitted at the TOOL NOSE, in the cell's own space.
   *
   * The old emitter did `scene.add` at a hand-picked WORLD position of
   * (x, 1.28, z 0.35). `cell` is the group that actually holds the machine
   * (cell.position.z = -7), so those world coordinates are ~7 units outside
   * the enclosure: every chip in the shop sprayed onto the floor 9 units wide,
   * none of them at the cut, and none of them inside the cell where the one
   * worklight is. Parented to `spindleGroup`, the chips land in cell space like
   * the part, the vise and the tool do — measured at the bar nose, local
   * y = -0.64, which is the bottom of `barMesh`. */
  for (let i = 0; i < 16; i++) {
    const c = new THREE.Mesh(CHIP_GEO, CHIP_MAT);
    /* THE PROOF WAS NUMERIC AND THE PROBLEM WAS STILL REAL. The census this
       geometry replaced put 10/10 chips at exactly the tabletop plane — none
       buried, none behind the part — and at a player's stance the pile still
       read as a few dark specks. Two causes, both this emitter's: at 8–18 mm
       these were the smallest chips in the building (the decorative floor
       scatter and the chip tray both carry 12–26 mm ones), and a 6 cm circle
       put every one of them inside the part's own contact shadow, where a
       mid-tone straw chip on a darkened table has nothing to contrast with.
       Now 16 chips of 12–24 mm thrown across ~20 cm, so a pass leaves a
       scatter a player can see from where a player stands. */
    const s = 0.012 + Math.random() * 0.012;
    c.scale.setScalar(s);
    c.position.set(barMesh.position.x + (Math.random() - 0.5) * 0.10,
                   -0.63 - Math.random() * 0.04,
                   (Math.random() - 0.5) * 0.10);
    /* Thrown DOWN and out, under the tool — the old velocity launched them
       upward at 0.7+, which is why the spray spread across the shop instead of
       falling past the vise.
     *
     * These are SCALED units: the bore is 18 mm across and appears here as
     * 0.036 units, so a "metre" is ~2 units. Velocities are scaled to match,
     * and `stepChips` applies gravity in the same units -- mixing a raw metric
     * constant into a scaled world is what made a correctly-placed chip
     * invisible. */
    /* Thrown harder sideways too: a chip leaving a roughing cut carries real
       tangential speed, and a wider fan is also what lets some of them clear
       the fixture's shadow and land on table the worklight actually hits. */
    c.userData.v = new THREE.Vector3((Math.random() - .5) * 0.84,
                                     -(0.06 + Math.random() * 0.10),
                                     (Math.random() - .5) * 0.84);
    c.userData.spin = 2.0 + Math.random() * 3.0;
    spindleGroup.add(c); NEW_CHIPS.push(c);
  }
  return info;
}
function stepChips(dt) {
  for (let i = NEW_CHIPS.length - 1; i >= 0; i--) {
    const c = NEW_CHIPS[i];
    /* Gravity, in the units this world is actually authored in: the bore is
       18 mm across and draws as 0.036 units, so a metre is ~2 units and one
       metric 9.8 m/s^2 is 3.9 units/s^2. The old code applied a raw 9.8 here,
       which is 24.5 m/s^2 -- two and a half times real gravity. Measured: ten
       correctly-placed chips crossed from the tool nose to the enclosure floor
       inside a single frame, so a correct emitter still showed the player
       nothing. 3.9 gives the fall ~0.64 s, which is when a chip is actually
       visible leaving the cut. */
    c.userData.v.y -= 3.9 * dt;
    c.position.addScaledVector(c.userData.v, dt);
    c.rotation.x += dt * (c.userData.spin || 5);
    c.rotation.z += dt * (c.userData.spin || 4) * 0.8;
    /* THE FLOOR TEST HAS TO BE IN ONE FRAME OF REFERENCE.
     *
     * `c.position` is SPINDLE-LOCAL: the emitter puts the nose at local y
     * -0.64, and the spindle group sits at cell-local y 2.52, so the nose is
     * cell-local 1.88. Comparing a spindle-local y against the cell-local floor
     * (1.06) says "-0.67 < 1.06" — TRUE — so every chip was slammed onto the
     * floor on the frame it spawned. Measured: 720 clamp hits, all at y around
     * -0.67, while the HUD described a chip that never drew a single visible
     * frame. Convert once, then compare. */
    /* ══ WHAT A CHIP LANDS ON ═══════════════════════════════════════════════
       A FIXED FLOOR HEIGHT BURIED EVERY CHIP THE PLAYER EVER MADE. The cut
       happens directly above the MACHINE TABLE, whose top is at cell-local 1.21,
       and this test stopped chips at 1.06 — the enclosure floor, 15 cm below the
       table surface and inside it. Measured after six passes: 176 chips in the
       scene and not one of them visible, because the whole pile was inside the
       table. The player's work left no trace on the machine and nothing said so.

       So the landing SURFACE depends on WHERE the chip is, which is the honest
       rule and one line: over the table it lands on the table, anywhere else it
       lands on the enclosure floor. Convert to cell-local once, choose, convert
       back — the same discipline that fixed the first version of this loop, which
       compared a spindle-local y against a cell-local floor and slammed every
       chip down on the frame it was born. */
    const cellX = c.position.x;                    // spindle sits at cell x 0
    const cellZ = 0.35 + c.position.z;             // and at cell z 0.35
    const onTable = Math.abs(cellX) < 0.625 && Math.abs(cellZ - 0.25) < 0.475;
    const landAt = onTable ? TABLE_TOP : 1.065;    // table top · enclosure floor
    const spindleY = spindleGroup.position.y;      // cell-local y of the parent
    if (spindleY + c.position.y <= landAt) {
      c.userData.v.set(0, 0, 0);
      c.position.y = landAt - spindleY;
      /* AND IT STAYS WHERE IT LANDED. A settled chip is taken off the falling
         list, so the 260-chip budget is spent on chips that can still be seen
         falling rather than on a pile nobody can look at. */
      c.userData.settled = true;
    }
  }
  if (NEW_CHIPS.length > 260) {
    const c = NEW_CHIPS.shift();
    /* `scene.remove(c)` is a NO-OP on a child of a child, and it fails SILENTLY
       — the mesh stays in the scene, so chips would accumulate at 10 per pass
       forever while NEW_CHIPS still reported its 260 cap honoured. A list lying
       about its own contents. Removing from the real parent is the only thing
       that works, and it must ship with the parenting change above or not at
       all. Disposes the geometry only: CHIP_MAT is shared and still in use. */
    c.removeFromParent();
    c.geometry.dispose();
  }
}

/* ── AUDIO — §13 as a gameplay system, fed by world.cutAcoustics ──────────
   Nothing here decides what anything sounds like. `world.cutAcoustics` derives
   the audible state from the kernel's own power_frac / F_peak_N, and audio.mjs
   turns that into gain. The page only says WHERE it is. */
let AUD = null;
try { AUD = createAudio({ busy: true }); } catch (e) { console.warn('audio unavailable', e); }
const AUD_MACHINES = { mine: 'vmc1', OTHER1: 'vmc2', OTHER2: 'vmc3', OTHER3: 'vmc4' };
let audioReady = false;
function audioGo() {
  if (!AUD || audioReady) return;
  try { AUD.start(); audioReady = true; } catch (e) { console.warn('audio start failed', e); }
}
/* ── THE BRIDGE FROM KERNEL RECORD → ACOUSTICS ────────────────────────────
   These are DIFFERENT VOCABULARIES and joining them is exactly where a page
   can lie about the physics. world.cutAcoustics reads `step.n` (CONSTANT
   rpm), `step.power_frac` (0..1 of rated) and `step.b_radial_mm`; the kernel
   history record carries `n_rpm`, `power_kW` and `bite_effective_um`. Passing
   the raw record is silent (n is the PASS NUMBER) — measured, not guessed.
   One adapter, one place, and it reads only real record fields. */
function acousticsFrom(rec, g, { rubbing = false, verdict } = {}) {
  if (!rec) return W.idleAcoustics(g.mach, { rpmFrac: 0, spindle_on: g.machine.spindle_on });
  return W.cutAcoustics({
    n: rec.n_rpm,
    power_frac: rec.power_kW / g.mach.power_max_kW,
    b_radial_mm: (rec.bite_effective_um ?? rec.bite_realised_um ?? 0) / 1000,
    F_peak_N: rec.force_N,
  }, { z: g.tool?.z ?? 1, rubbing, verdict: verdict ?? rec.verdict });
}
/** A machine that is not yours still has to be audible — §1, the shop runs
 *  without you. It gets a real voice at a real distance. */
function driveMachineVoice(id, pos, a, extra = {}) {
  if (!audioReady) return;
  const d = eye.distanceTo(pos);
  AUD.setMachine(id, a, { distance_m: d, gain: 1, pan: cl((pos.x - eye.x) / 6, -1, 1),
    walls: 0, enclosure: 0.25, ...extra });
}
let stepAccum = 0;

/* ── HUD ────────────────────────────────────────────────────────────────── */
function toast(html, ms = 4200) {
  const d = document.createElement('div'); d.innerHTML = html; $('ev').appendChild(d);
  if (REC) REC.hint({ kind: 'toast', who: null, text: html, is_question: false });
  setTimeout(() => { d.style.transition = 'opacity .5s'; d.style.opacity = '0'; setTimeout(() => d.remove(), 520); }, ms);
}
/* ── HANDING THE SESSION OVER ────────────────────────────────────────────────
 * Everything a playtest run produces is in this browser's localStorage, and the
 * only person who can get it out is the player. So this is deliberately a
 * one-click affordance that says what it is, not a hidden key binding: a tester
 * who has to be told a shortcut will not use it, and a session that is never
 * exported is a session that was never run. */
let exportOffered = false;
/* One place that saves, reports, and RECORDS that it saved. Two callers (the
   link and the S key) must not mean two log lines for one file. */
function saveSession(via) {
  if (!REC || !RECmod.downloadLocal) return { ok: false, why: 'not recording' };
  /* Record FIRST, before the file is built. The .jsonl is assembled by reading
     localStorage, so anything logged after that read is absent from the file it
     describes — and the row count the file reports would describe the state
     before its own export. Measured: `export_session` said rows: 28 while the
     file it had just written ended at seq 44. That is a session export that
     systematically under-reports itself, this project's signature failure in
     miniature, so the fix is order, not a bigger number. */
  REC.action('export_session', { via, clock_min: GAME ? GAME.clock_min : null });
  if (RECmod.flushLocal) RECmod.flushLocal();
  const r = RECmod.downloadLocal();
  const el = document.querySelector('.getrec .dl');
  if (el) el.textContent = r.ok ? `Saved ${r.filename} (${r.rows} events)` : `Could not save: ${r.why}`;
  return r;
}
function offerSessionDownload() {
  if (!REC || exportOffered) return;
  /* Flush first. The recorder's heartbeat is 4 s and this can run sooner, so
     without this a player who ships quickly reads rows:0 below and is offered
     nothing — the exit would vanish for the fastest player. */
  const st = RECmod.flushLocal ? RECmod.flushLocal() : (RECmod.localStats ? RECmod.localStats() : null);
  if (!st || !st.rows) return;
  exportOffered = true;
  const d = document.createElement('div');
  d.className = 'getrec';
  /* The link is a convenience for a released pointer; the key is the one that
     works inside the game. Both are stated, because a tester who is told only
     about the link will press it and nothing will happen. */
  d.innerHTML = `<b>Your session is in this browser.</b> ` +
    `${st.rows} events so far.` +
    (st.dropped ? ` <span style="color:#e0a030">${st.dropped} dropped (storage full).</span>` : '') +
    ` <span class="dl">Save it as a file</span> <span class="hint">or press <kbd>S</kbd></span>`;

let talkTimer = null;
function say(who, text, options) {
  const t = $('talk');
  t.innerHTML = `<div class="who">${who}</div><div class="say">${text}</div>`;
  if (options) for (const [label, fn] of options) {
    const b = document.createElement('div'); b.className = 'opt'; b.textContent = label;
    b.onclick = () => { t.innerHTML = ''; if (REC) REC.choice(label, { who }); fn(); }; t.appendChild(b);
  }
  if (REC) REC.hint({ kind: 'say', who, text, is_question: !!options,
                      options: options ? options.map((o) => o[0]) : null });
  clearTimeout(talkTimer);
  if (!options) talkTimer = setTimeout(() => { t.innerHTML = ''; }, 5400);
}
/* ONE LOOK, ONE LINE. Looking at the rack prints TWO lines — the slots and the
   van's booking — so a player who presses E twice reads the same two sentences
   twice with the clock unchanged, and a cold viewer took the repeat for the game
   saying one thing twice. The line the player just read is not news. An
   incoming line identical to one of the last few printed is dropped from the
   column; it is NOT dropped from the session record, which records what was
   done and not what was read. Four is the window because the widest single look
   prints two lines and a look plus its reaction is four. */
const recentLog = [];
function logLine(html) {
  if (REC) REC.hint({ kind: 'log', who: null, text: html, is_question: false });
  if (recentLog.includes(html)) return;
  recentLog.unshift(html);
  if (recentLog.length > 4) recentLog.pop();
  const d = document.createElement('div'); d.innerHTML = html;
  const L = $('log'); L.prepend(d); L.children[0].classList.add('new');
  while (L.children.length > 9) L.lastChild.remove();
  fitLogRows();
}
/* ── WHOLE ROWS ONLY AT THE TOP ───────────────────────────────────────────
   The column is capped and bottom-anchored, so the row that does not fit is the
   oldest one, and it is cut through its own letterforms at the container's top
   edge. A fade dims that half-row; it does not make it a row. So a row the
   column cannot show whole is not shown at all, and the topmost line in the
   column is always one you can read from its first letter. Hidden, never
   removed: the element stays a child of #log, so the count the tests read and
   the session record are exactly what they were. `children[0]` is the newest
   line — `column-reverse` puts it at the bottom — and is never hidden, even if
   one line wraps taller than the whole column. */
function fitLogRows() {
  const L = $('log');
  if (!L) return;
  for (const c of L.children) c.style.display = '';
  const top = L.getBoundingClientRect().top;
  for (let i = L.children.length - 1; i >= 1; i--) {
    const c = L.children[i];
    if (c.getBoundingClientRect().top >= top - 0.5) break;
    c.style.display = 'none';
  }
}

/* ── PHYSICAL FEEDBACK — §51: grab, clamp, tighten must feel like something.
   A machinist feels a vise bind through the handle. On a laptop the only
   honest channels left are an audio transient and a frame of camera shake. */
let shake = 0;
function vibrate(strength = 1) {
  shake = Math.min(0.02, 0.006 * strength);
  if (audioReady) AUD.clack({ gain: 0.35 * strength, pitch: 520, kind: 'steel' });
  if (navigator.vibrate) { try { navigator.vibrate(Math.round(12 * strength)); } catch (e) {} }
}

/* ── THE PLAYER ─────────────────────────────────────────────────────────── */
const keys = Object.create(null);
addEventListener('keydown', (e) => {
  keys[e.code] = true;
  /* S saves the session. It is handled HERE, above handleMachineKeys, on
     purpose: that function returns early unless you are at the machine or
     holding calipers, and the one moment a session must be recoverable is the
     moment after the part is done and you have walked away from both.
     A KEY and not a click, because the page holds pointer lock: while
     document.pointerLockElement is the canvas, a mouse click is consumed by the
     lock and never reaches the link — measured, and it is why the visible
     "Save it as a file" affordance alone was not enough. Keyboard works while
     locked, so S is the affordance that actually functions in the game. */
  if (e.code === 'KeyS' && REC && !e.metaKey && !e.ctrlKey) {
    if (!exportOffered) offerSessionDownload();
    saveSession('KeyS');
    return;
  }
  /* A first E press after shipping is the clearest "touched something" in the
     post-ship window — the manual treats re-checking the machine as a MORE cue. */
  if (e.code === 'KeyE') { tapShipWindow('interact', lookingAt ? lookingAt.name : 'nothing'); doLook(); }

});
addEventListener('keyup', (e) => { keys[e.code] = false; });
addEventListener('mousemove', (e) => {
  if (document.pointerLockElement !== renderer.domElement) return;
  /* YOUR HANDS ARE FULL. While a part is in them the mouse turns the PART, not
     the world — which is both the control scheme and the consequence of holding
     something. The tilt stops short of flipping the casting over: the fingers
     ride the rim and past about half a radian the part would have turned past
     what a grip resting on them can follow. */
  if (HELD && HELD_MESH) {
    heldSpin += e.movementX * 0.006;
    heldTilt = cl(heldTilt + e.movementY * 0.006, 0.12, 0.62);
    poseHeld();
    return;
  }
  yaw -= e.movementX * 0.0021; pitch = cl(pitch - e.movementY * 0.0021, -1.45, 1.45);
});
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  fitLogRows();          // a narrower viewport wraps a line onto two rows
});

add(CALIPERS, `Vernier calipers — ${CALIPER_MM} mm`, 'pick them up', () => {
  CARRIED.calipers = true;
  /* TAKEN IS A PLACE, NOT A FLAG. These used to be hidden with
     `CALIPERS.visible = false`, which left the bench bare and the calipers
     nowhere: a still of the bench carried `Took the calipers.` in the log with
     nothing in the frame to take, and a cold viewer called it out.

     AND IN THE FRUSTUM, OR NOWHERE. The first pose hung them 0.37 m below the
     eye — "at your hip" — and they were invisible in every frame at every
     pitch, because a camera child is posed inside the frustum, not in the
     shop: at 0.42 m the frame is only ±0.30 m tall, so anything below that is
     under the bottom edge, and pitching the camera cannot rescue it because
     the frame swings down WITH the object. They hang where a right hand
     actually is: a little right and below. AND WHOLE, OR THE FORK IS WHAT
     GETS CUT: the first of those poses ran the beam across the bottom-right
     corner, and the near pair of jaws — the ones that close on the work, the
     reason the object reads as calipers at all — went out through the edge
     of the frame in both held stills.

     AND AT READING DISTANCE, OR NOT AT ALL. Even whole and in the frustum,
     the 0.51 m pose failed the read twice the same way: the numerals were
     seven pixels tall, the 1 mm ruling was under the sampling rate, and the
     still showed "a blocky grey mass with striped-blur scale". Nobody reads
     a vernier at arm's length; a machinist brings it UP. This pose is the
     read: 0.24 m from the eye, a little right and below centre, the scale
     face tipped 28° square-ish to the eye, the beam across a third of the
     frame, the fork hanging at the left end. */
  camera.add(CALIPERS);
  const p = new THREE.Vector3(0.082, -0.041, -0.222);   // ~0.24 m — reading distance
  CALIPERS.position.copy(p);
  {
    /* THE POSE IS DERIVED FROM THE POSITION, NOT TYPED TWICE: the eye
       direction d comes off p, the beam runs square across the view, and the
       face normal is d tipped 28° toward the reader — square-ish to the eye,
       the way the tool is actually read. One position in, one pose out. */
    const d = p.clone().negate().normalize();
    const beam = new THREE.Vector3(0.921, 0.150, 0.360).normalize();
    const x = beam.sub(d.clone().multiplyScalar(beam.dot(d))).normalize();
    const down = new THREE.Vector3().crossVectors(x, d).normalize();
    const face = d.clone().multiplyScalar(Math.cos(0.49)).add(down.clone().multiplyScalar(Math.sin(0.49)));
    const y = face.clone().negate();
    const z = new THREE.Vector3().crossVectors(face, x).normalize();
    CALIPERS.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(x, y, z));
  }
  CALIPERS.add(buildCaliperGrip());
  say('You', 'Heavy for their size. There is a thumbwheel and a lock screw.');
  logLine('<b>Took the calipers.</b> Press <b>M</b> at the machine to measure the bore.');
}, () => !CARRIED.calipers);

    `<i>${d.material} · ${d.projection} · ${d.scale}</i>`);
  logLine(`Drawing <b>${d.number}</b> rev <b>${d.rev}</b>: ${d1.text} ` +
    `(${d1.tol_text}), ${d2.text} deep from Datum ${d.datums[0].letter}. ` +
    `Band is <b>${d1.band_um} µm</b>.`);
}, () => true);

add(cell, 'VMC — 40 taper, 7.5 kW', 'operate', () => { /* panel is always on near it */ },
  () => eye.distanceTo(new THREE.Vector3(0, 1.6, -7)) < 4.2);

add(OTHER1.g, 'VMC No. 2 — running Phelps', 'watch', () => {
  say('You', 'Somebody else\u2019s job. Nozzle\u2019s blocked, it\u2019s cutting dry.');
}, () => true);
add(OTHER2.g, 'VMC No. 3 — running Ashcombe', 'watch', () => {
  say('You', 'Runs a tick, then catches. That\u2019s a worn insert, not a bad program.');
}, () => true);

/* the tool board — §77: the first time is manual, the fiftieth is a shortcut.
   No menu; you look at a specific bar and take it. */
/** Put a bar in the spindle. ONE function, because the LOOK item, the game and
 *  the acceptance gate all have to go through the same door.
 *
 *  The refusal text is why this was extracted. It read "That one won't reach
 *  30 deep" — hard-coded, true of J1, false of every other job on the board.
 *  It now reads the bore off the job the machine is actually set up on, which
 *  is the same number `loadTool` refused against a line earlier. */
function loadBar(id) {
  const r = G.loadTool(GAME, id, stickout);
  if (!r.ok) {
    say('You', r.why === 'TOO SHORT'
      ? `That one won't reach ${GAME.job.bore_depth_mm} deep.`
      : r.why === 'OVERHUNG' ? 'That\u2019s hanging too far out — it will sing.'
      : `Won\u2019t go in: ${r.why}`);
    if (REC) REC.refusal('load_tool', r.why, { clock_min: GAME.clock_min, bar: id });
    return { ok: false, why: r.why };
  }
  GAME.machine.spindle_on = true;
  if (audioReady) { AUD.clack({ gain: 0.5, pitch: 1500 }); AUD.spindleStart('mine', { to_Hz: 32, seconds: 2.4 }); }
  logLine(`Loaded the <b>${r.spec.label}</b> at ${stickout} mm out. ${r.spec.note}`);
  toast(`Bar in. ${r.spec.D} mm, ${stickout} mm out. ` +
    (lastRead ? `Last gauge reading stands at Ø${lastRead.mm.toFixed(4)}.` : `<b>You have not measured it yet.</b>`), 3800);
  return { ok: true, spec: r.spec };
}
for (const [id, mesh, lbl] of [['bar12', BOARDS.bar12, 'Ø12'], ['bar16', BOARDS.bar16, 'Ø16'], ['bar20', BOARDS.bar20, 'Ø20']]) {
  add(mesh, `Boring bar ${lbl} — carbide, in a holder`, 'load it in the spindle',
      () => loadBar(id), () => true);
}

/* ── THE BOARD'S VERB — reading it, and taking the next job off it ───────
   L2. The card for the job you are set up on is flagged; the others are
   offers. Every figure on the board is read from the job spec the kernel is
   handed, so a card cannot describe a job as easier than it is. */
add(JOBBOARD, "Job board — the week's work", 'read it', () => {
  const offers = offersFor(SHOP, G.JOBS);
  const lines = offers.map((o) => {
    const j = o.job;
    const mine = j.id === GAME.job.id;
    const band = W.bandUm(j);
    const head = `${mine ? '<b>' : ''}${j.id} · ${j.client}${mine ? '</b> <i>— on your machine</i>' : ''}`;
    /* THE SAME TWO NUMBERS THE MACHINE PANEL PRINTS, IN THE SAME DRESS: every
       diameter wears Ø, every length wears its unit, the band is a width in µm.
       The card used to write `Ø40` and then `36 mm` for the other diameter of
       the same part — two diameters, one signed and one not — and `30 deep`
       with no unit at all on a card that also prints microns. */
    const spec = `Ø${j.nominal_mm} ${j.grade}, band ${band} µm · ` +
      `Ø${j.start_hole_dia_mm} mm as-cast, ${j.bore_depth_mm} mm deep · van ${W.hhmm(G.departsMin(j))}`;
    /* A card a client has NOT put up is still printed, and says why. A job that
       silently vanishes from the wall is a job the player cannot learn from. */
    if (!o.offered) {
      return `<span style="color:#8b98a6">${head}<br>${spec}<br>` +
        `<b style="color:var(--bad)">${o.reason}</b></span>`;
    }
    return `${head}<br>${spec} · <b>${money(o.rate)}</b> <i>${o.reason}</i>`;
  });

  /* ── THEIR LAST WORD ─────────────────────────────────────────────────────
     What the customer measured, set against what you told them it was. This is
     the only place in the game where the two numbers sit on the same line, and
     it is the sentence the whole build exists to produce. */
  const last = SHOP.shipper.length ? SHOP.shipper[SHOP.shipper.length - 1] : null;
  const letter = last
    ? `<i>${last.client}'s last word — ${last.report} ` +
      `Standing ${last.standing_before} → <b>${last.standing_after}</b>.</i><br><br>`
    : '';
  /* ══ AND THE SYSTEM HAS A VIEW ON THE WORK ITSELF ═════════════════════════
     VISION.md §3 says the system advises at every rung; the seat at the machine
     is only the first. This is the shop rung, and it is deliberately the same
     kind of object: a claim, its assumptions printed, and a record the shop keeps.
     See `adviseJob` in shop.mjs for why it is wrong and why that is the lesson. */
  const advice = adviseJob(SHOP, offers);
  const adviceLine = advice
    ? `<br><i>The system would take <b>${advice.job_id}</b> — ${advice.why}. ` +
      `It was asked for the best rate and nothing else; what that does to the ` +
      `relationship is not in it.</i>`
    : '';
  const worth = averageClaimError_um(SHOP);
  const books = `<br><br><i>Banked <b>${money(SHOP.cash)}</b> · day ${SHOP.day} · ` +
    `overhead ${money(260)} a morning` +
    (worth === null ? ' · nothing measured yet' : ` · your word is good to ${worth.toFixed(1)} µm`) + '.</i>';

  /* THE DAY BOOK IS OFFERED FIRST, because a shopkeeper reads the numbers before
     taking on more work — and because it is the only place the shop's own record
     is legible. */
  const opts = [['Read the day book', readBooks]];
  for (const o of offers) {
    if (!o.offered || o.job.id === GAME.job.id) continue;
    opts.push([`Take ${o.job.id} — ${o.job.client}, Ø${o.job.nominal_mm} ${o.job.grade}, ` +
      `band ${W.bandUm(o.job)} µm at ${money(o.rate)}`,
      () => takeJob(o.job.id)]);
  }
  say('Board', letter + lines.join('<br><br>') + adviceLine + books, opts.length ? opts : undefined);
  logLine(`Board: <b>${offers.filter((o) => o.offered).length}</b> of ${offers.length} on offer. ` +
    `Banked <b>${money(SHOP.cash)}</b>.` +
    (opts.length ? '' : ' <b>Nothing here is yours to take.</b>'));
}, () => true);

/* ── THE PENDANT'S VERB ──────────────────────────────────────────────────
   Aim at a key, press E. Every one of these is the same function the keyboard
   shortcut calls, so a player who drives the machine off the pendant and a
   player who knows Shift+1-6 are operating the identical machine. The keys are
   not removed — a machinist who knows them should not be slowed down — they are
   simply no longer the only way, and no longer printed on the screen. */
function stepIn(arr, cur, dir) {
  const i = arr.indexOf(cur);
  if (i < 0) return arr[0];
  return arr[Math.max(0, Math.min(arr.length - 1, i + dir))];
}
function pressKey(id) {
  switch (id) {
    case 'dial_down':
    case 'dial_up': {
      const up = id === 'dial_up';
      const v = stepIn(DIALS, biteCmd_um, up ? 1 : -1);
      if (v === biteCmd_um) { toast(`Dial is already at its ${up ? 'deepest' : 'finest'}: <b>${v} µm of radius</b>.`, 1800); return; }
      biteCmd_um = v;
      if (REC) REC.action('set_dial', { dial_um: v, key: 'pendant', clock_min: GAME ? GAME.clock_min : null });
      toast(`Dial set to <b>${v} µm</b> on the radius.`, 1800);
      return;
    }
    case 'pred_down':
    case 'pred_up': {
      const cur = predicted_um === null ? PREDICTIONS[0] : predicted_um;
      setPrediction(stepIn(PREDICTIONS, cur, id === 'pred_up' ? 1 : -1));
      return;
    }
    case 'feed_down': stepRoughFeed(-1); return;
    case 'feed_up':   stepRoughFeed(1);  return;
    case 'spd_down':
    case 'spd_up': {
      const up = id === 'spd_up';
      const v = stepIn(G.SPEEDS.steps, GAME.machine.vc_m_min, up ? 1 : -1);
      if (v === GAME.machine.vc_m_min) {
        toast(`Spindle is already at its ${up ? 'fastest' : 'slowest'}: <b>${v} m/min</b>.`, 1800);
        return;
      }
      GAME.machine.vc_m_min = v;
      refreshLoadMeter();
      if (REC) REC.action('set_speed', { vc_m_min: v, clock_min: GAME.clock_min });
      toast(`<b>${v} m/min</b> at the edge — ${G.SPEEDS.note(v)}.`, 2600);
      logLine(`Spindle set to <b>${v} m/min</b>. ${G.SPEEDS.note(v)}.`);
      return;
    }
    case 'bite_down': stepRoughBite(-1); return;
    case 'bite_up':   stepRoughBite(1);  return;
    case 'book':      readBook();  return;
    case 'maint':     callMaint(); return;
    case 'insert':    changeEdge(); return;
    case 'calib':     callCalibration(); return;
    case 'touch':     doTouchOff(); return;
    case 'warm':      doWarmUp();   return;
    case 'rough':     doRough();    return;
    case 'cut':       doCut();      return;
    case 'measure':   doMeasure();  return;
    case 'inspect':   doInspect();  return;
    default: return;
  }
}
add(pendPad, 'Machine control — pendant', 'press a key', () => {
  if (!pendHover) { say('You', 'A membrane keypad. DIAL −/+ sets the cut, PRED −/+ states your guess, both in µm of radius. Point at a key and press E.'); return; }
  if (REC) REC.action('pendant_key', { key: pendHover.id, label: pendHover.label,
    clock_min: GAME ? GAME.clock_min : null });
  pressKey(pendHover.id);
}, () => eye.distanceTo(MACHINE_NEAR) < 4.2);

/* ── THE CHIP'S VERB — the bottom rung ────────────────────────────────────
   A chip is the physical evidence of the cut and a machinist reads it before
   they read anything else: its colour says how hot the cut ran, its thickness
   says what the bar actually took, and both of those are already computed by
   `W.chipFromPass` from the real cutting energy and the real bite. Nothing
   here asserts a number the kernel did not produce.

   AND IT CARRIES THE LESSON WITHOUT STATING IT. The chip is thicker than the
   dial said — every time, because that is what the surplus IS — and the read
   puts those two numbers on one line and stops. */
add(CHIP_TRAY, 'Chip tray — what came off the last pass', 'look in it', () => {
  if (!LAST_CHIP) {
    say('You', 'Turnings from somebody else\u2019s shift. Blue and straw, mostly — ' +
      'whatever ran in here before you got to it. Nothing of yours in the tray yet.');
    return;
  }
  const c = LAST_CHIP;
  const surplus = c.surplus_um;
  /* WHAT A CHIP CAN HONESTLY TELL YOU, and every figure here is exact: its
     WIDTH is the bite the bar actually took, which is where the surplus lives;
     its THICKNESS is the feed times the chip-thickening ratio, the dimension
     that decides whether it breaks; its MASS is the annulus it came out of.
     NO TEMPERATURE AND NO DIAGNOSIS — see the note on CHIP_HEAT in world.mjs
     for why this build does not quote one. A number you cannot defend is the
     one thing a machinist will not forgive, and the brief fails the whole build
     for a single one of them. */
  say('Chip tray',
    `<b>${c.colour_name}</b> chip · <b>${c.t2_um.toFixed(0)} µm</b> thick · ` +
    `<b>${c.width_um.toFixed(0)} µm</b> wide · ${c.mass_g.toFixed(1)} g<br>` +
    `the dial said <b>${c.bite_cmd_um.toFixed(0)} µm of radius</b> and the bar took ` +
    `<b>${c.bite_realised_um.toFixed(1)} µm of radius</b>` +
    (Math.abs(surplus) >= 0.05
      ? surplus > 0
        ? ` — <b>+${surplus.toFixed(1)} µm of radius</b> wider than you asked for`
        : ` — <b>${Math.abs(surplus).toFixed(1)} µm of radius</b> short of what you asked for`
      : '') +
    `<br><br>` +
    (c.breaks
      ? `<i>It broke up rather than stringing. That is the feed being right for the material.</i>`
      : `<i>It came off in a string rather than breaking up. That is the feed, not the bar.</i>`) +
    `<br><i>${c.mass_g.toFixed(1)} g of ${GAME.mat.label} that is now swarf.</i>`);
  logLine(`Chip: <b>${c.colour_name}</b>, <b>${c.t2_um.toFixed(0)} µm</b> thick, ` +
    `<b>${c.width_um.toFixed(0)} µm</b> wide (` +
    (surplus >= 0 ? `+${surplus.toFixed(1)}` : `${Math.abs(surplus).toFixed(1)} short of`) +
    ` of radius on the dial), ${c.mass_g.toFixed(1)} g.`);
  if (REC) REC.action('read_chip', { colour: c.colour_name,
    t2_um: c.t2_um, width_um: c.width_um, mass_g: c.mass_g,
    surplus_um: surplus, breaks: c.breaks });
}, () => true);

/* ══ ASKING THE SYSTEM ════════════════════════════════════════════════════
   Walk to the console, press E, and it tells you what it makes of the bore at
   the dial you have set. Then the books close on it when metal comes off.

   WHAT IT WILL NOT DO is tell you what to think of its own answer. It reports
   both conditions on the same screen — the one it surveyed, and the one the
   machine is at — and says nothing about the gap. The player who compares those
   two lines is the player who stops scraping castings on a worn machine. */
/** THE SHOP'S OWN BOOKS. `shop.shipper` has held every part that has left the
 *  door since the economy was wired and only ever showed its last line. A shop
 *  keeps a day book and a shopkeeper reads it — what went out, what it was worth,
 *  and what it cost. |
 *  |
 *  IT IS NOT A SCOREBOARD AND IT SAYS SO. There is no rate, no percentage and no
 *  trend line: the disposition of each part, what the customer measured, the
 *  money, and the day's overhead. A player who wants a rate has to work it out,
 *  which is what a shopkeeper does with a pencil. */
function readBooks() {
  const rows = SHOP.shipper.map((e) => {
    const measured = e.true_um === null ? '—' : `${e.true_um >= 0 ? '+' : ''}${e.true_um.toFixed(1)} µm`;
    const said = e.claimed_um === null ? 'no figure given' : `said ${e.claimed_um >= 0 ? '+' : ''}${e.claimed_um.toFixed(1)}`;
    return `day ${e.day} · <b>${e.job_id}</b> · ${clientName(e.client)} · ${e.kind.replace('_', ' ')}` +
      `<br><span style="color:#8b98a6">measured ${measured} · ${said} · ${money(e.net)}</span>`;
  });
  const total = SHOP.shipper.reduce((a, e) => a + e.net, 0);
  /* `OVERHEAD_PER_DAY` LIVES IN shop.mjs, NOT game.mjs. Reading it off `G.` gave
     undefined and the book printed "overhead to date £NaN" — class 1 of the three
     defect families, found by reading the sheet on screen. It is imported by name
     now, which is also the only way a rename can break it loudly. */
  const overhead = OVERHEAD_PER_DAY * (SHOP.day - 1);
  say('Day book',
    `<b>Day ${SHOP.day}</b> · banked <b>${money(SHOP.cash)}</b><br>` +
    `<span style="color:#8b98a6">parts net ${money(total)} · overhead to date ${money(overhead)} · ` +
    `${SHOP.shipper.length} part${SHOP.shipper.length === 1 ? '' : 's'} out of the door</span>` +
    `<br><br>` + (rows.length ? rows.join('<br><br>') : '<i>Nothing has left this shop yet.</i>'));
  logLine(`Day book: <b>${SHOP.shipper.length}</b> parts out, net ${money(total)}, ` +
    `banked <b>${money(SHOP.cash)}</b>.`);
}

/** The customer's letters, and the only place in this build where the number
 *  you read off a gauge and the number their CMM produced share a line. */
/* THE SHOP KEYS ITS BOOK BY ID AND THE LETTERHEAD IS A NAME. `client_id` is an
   identity and `client` is what goes on paper; the first version printed the id,
   so a letter arrived from "halvorsen". A display name is not an identity and an
   identity is not a display name — which is why the job spec carries both. */
const clientName = (id) => (G.JOBS.find((j) => j.client_id === id) || {}).client || id;

function readPost() {
  const post = unreported(SHOP);
  const parts = post.map((p) => {
    const L = letterFor(SHOP, p);
    const rows = L.lines.map((l) =>
      `<b>${l.job}</b> · ${l.what}<br><span style="color:#8b98a6">${l.said}</span><br>` +
      `${l.verdict} <b>${money(l.money)}</b>` +
      (l.out_by === null ? '' :
        `<br><i>${l.agreed ? 'It agrees with what you said.'
          : `It is ${Math.abs(l.out_by).toFixed(1)} µm from what you said.`}</i>`)).join('<br><br>');
    const worth = L.worth === null ? '' :
      ` <span style="color:#8b98a6">· your word with them holds to ${L.worth.toFixed(1)} µm</span>`;
    return `<b>${String(clientName(L.client)).toUpperCase()}</b> — incoming inspection<br>` +
      `<span style="color:#8b98a6">standing ${L.standing}</span>${worth}<br><br>${rows}`;
  });
  say('SYSTEM — post', parts.join('<br><br>———<br><br>'),
    [['Read. Put it on the board.', () => {
      let n = 0;
      for (const p of post) n += markReported(SHOP, p.client, SHOP.day);
      logLine(`Read the post — <b>${n}</b> part${n === 1 ? '' : 's'} reported back. ` +
        post.map((p) => `${clientName(p.client)} standing <b>${SHOP.book[p.client].standing}</b>`).join(' · ') + '.');
      toast(`Post read. ${post.map((p) => `${clientName(p.client).split(' ')[0]} ${SHOP.book[p.client].standing}`).join(' · ')}`, 6000);
      paintTerminal([
        { k: 'post', v: 'read' },
        { k: 'machine', v: GAME.machine.condition.toFixed(0) },
        'ask me about the bore when you want.',
      ], 'READY');
    }]]);
  paintTerminal([
    { k: 'letters', v: String(post.length) },
    { k: 'parts', v: String(post.reduce((a, p) => a + p.entries.length, 0)) },
    'on screen.',
  ], 'POST');
}

add(TERMINAL, 'Shop system — console', 'read it', () => {
  if (!GAME) return;
  /* THE POST COMES FIRST. A shop's morning starts with what came back, not
     with what you were about to do, and burying the letters under a forecast
     would be the interface deciding the player does not need to know. */
  if (unreported(SHOP).length) { readPost(); return; }
  const rec = G.systemRecord(GAME);
  const surveyed = GAME.system.surveyed_condition;
  const now = GAME.machine.condition;
  const drift = now - surveyed;
  const lines = [];
  lines.push(`surveyed at <b>${W.hhmm(GAME.system.surveyed_at_min)}</b> — condition ` +
    `<b>${surveyed.toFixed(0)}</b>, TIR ${G.runout_um_for(surveyed).toFixed(1)} µm`);
  lines.push(`machine now — condition <b>${now.toFixed(0)}</b>, ` +
    `TIR ${G.runout_um_for(now).toFixed(1)} µm` +
    (Math.abs(drift) < 1 ? '' : ` <b>(${drift < 0 ? '' : '+'}${drift.toFixed(0)} since I looked)</b>`));

  let body = lines.join('<br>');
  const opts = [];

  if (!GAME.tool) {
    body += `<br><br>Nothing in the spindle, so there is nothing to forecast. ` +
      `Put a bar in and ask me again.`;
  } else {
    const f = G.forecastPass(GAME, { bite_mm: biteCmd_um / 1000, feed_mm_rev: roughFeed_mm_rev });
    if (!f) body += `<br><br>I cannot model that.`;
    else if (f.refused) body += `<br><br>At <b>${biteCmd_um} µm of radius</b> the machine will refuse it ` +
      `(${String(f.why).replace(/_/g, ' ').toLowerCase()}). If you take that cut you will get a ` +
      `refusal, not a part.`;
    else {
      G.claimPass(GAME, f.coldDia_mm, { dial_um: biteCmd_um });
      body += `<br><br>At <b>${biteCmd_um} µm of radius</b> on the dial, I make that ` +
        `<b>Ø${f.coldDia_mm.toFixed(4)} mm</b> cold.`;
      body += `<br><br><i>I will be told whether I was right when you cut it.</i>`;
    }
  }

  /* THE RECORD, kept by the shop and not by the system. Written as a fact about
     the calls it has made — mean and worst, absolute micrometres — and never as
     a rating, because the number a supplier's own scoreboard carries is worth
     nothing to the person who has to decide whether to believe it. */
  body += `<br><br>` + (rec.n === 0
    ? `<i>No calls settled yet.</i>`
    : `<i>Of the last <b>${rec.n}</b> calls I have made: mean <b>${rec.mean_abs_um.toFixed(1)} µm</b> ` +
      `out, worst <b>${rec.worst_um.toFixed(1)} µm</b>, and ` +
      (rec.signed_um < -0.05
        ? `<b>optimistic</b> by ${Math.abs(rec.signed_um).toFixed(1)} µm on average.`
        : rec.signed_um > 0.05
          ? `<b>pessimistic</b> by ${rec.signed_um.toFixed(1)} µm on average.`
          : `balanced.`));

  opts.push(['Survey the machine now', () => {
    const r = G.SYSTEM.survey(GAME);
    paintTerminal([
      { k: 'condition', v: r.condition.toFixed(0) },
      { k: 'TIR', v: G.runout_um_for(r.condition).toFixed(1) + ' um', warn: G.runout_um_for(r.condition) > 7 },
      { k: 'claims', v: '0 kept' },
      'surveyed. ask me again.',
    ], 'READY');
    logLine(`System surveyed the machine: condition <b>${r.condition.toFixed(0)}</b>, ` +
      `TIR <b>${G.runout_um_for(r.condition).toFixed(1)} µm</b>. Its call record is reset with it.`);
    toast(`Surveyed. Condition ${r.condition.toFixed(0)} · ` +
      `TIR ${G.runout_um_for(r.condition).toFixed(1)} µm.<br>` +
      `Its previous calls were made about a different machine.`, 6000);
  }]);

  say('SYSTEM', body, opts);
  paintTerminal([
    { k: 'surveys', v: 'yes' },
    { k: 'machine', v: now.toFixed(0), warn: Math.abs(drift) > 60 },
    { k: rec.n ? 'calls' : 'calls', v: rec.n ? rec.n + ' settled' : 'none yet' },
    rec.n ? { k: 'worst call', v: rec.worst_um.toFixed(1) + ' um' } : 'waiting for a cut',
  ], rec.n ? 'READY' : 'NO RECORD');
  if (REC) REC.action('ask_system', { surveyed, actual: now, drift,
    dial_um: biteCmd_um, calls: rec.n,
    mean_abs_um: rec.mean_abs_um, signed_um: rec.signed_um });
}, () => true);

/* ══ THE BOOK, AND THE VISIT ═════════════════════════════════════════════
   Two verbs that only work because the shop is a business with a supplier and
   a machine that wears. */

/** Read the tooling supplier's cutting data for the bar in the spindle.
 *
 *  THE ASSUMPTION IS PRINTED WITH THE NUMBER, and that is the whole design.
 *  The recommendation is computed from this game's own kernel for a machine at
 *  condition 1000 and the bar at its catalogue stickout, so it is a real
 *  number that really runs — on that machine. Yours is at
 *  `GAME.machine.condition` and falling. A recommendation without its
 *  assumptions is an instruction; the moment you can compare the assumption
 *  against the machine in front of you it becomes advice. */
function readBook() {
  if (!GAME.tool) {
    say('Book', 'The sheet is indexed by bar. There is nothing in the spindle to look up.');
    return;
  }
  const b = G.bookCut(GAME.tool, GAME.materialKey, GAME.machineKey);
  if (!b) { say('Book', 'Nothing in the catalogue covers that combination.'); return; }
  const mine = G.runout_um_for(GAME.machine.condition);
  const theirs = G.runout_um_for(b.assumes.machineCondition);
  const agree = Math.abs(mine - theirs) < 0.6;
  const body =
    `<b>${b.bar}</b> in ${GAME.mat.label}<br>` +
    `Take <b>${b.bite_mm.toFixed(2)} mm of radius</b> at <b>${b.feed_mm_rev.toFixed(2)} mm/rev</b>.<br><br>` +
    `<i>Recommended for ${b.assumes.note}: condition ` +
    `${b.assumes.machineCondition}, bar at ${(GAME.toolSpec.D * 2.5).toFixed(0)} mm out.</i><br>` +
    `<i>This machine is at condition ${GAME.machine.condition.toFixed(0)} — ` +
    `TIR ${mine.toFixed(1)} µm against the sheet's ${theirs.toFixed(1)}.</i>` +
    (agree ? '' : `<br><br><b>The sheet does not know what machine you are standing at.</b>`);
  const opts = [[`Set the dial to the book's numbers`,
    () => {
      biteCmd_um = Math.round(b.bite_mm * 1000);
      roughFeed_mm_rev = b.feed_mm_rev;
      roughBite_mm = b.bite_mm;
      refreshLoadMeter();
      logLine(`Set to the book: bite <b>${b.bite_mm.toFixed(2)} mm of radius</b> ` +
        `(${biteCmd_um} µm of radius on the dial) at <b>${b.feed_mm_rev.toFixed(2)} mm/rev</b>.`);
      /* The next thing the player should do is check it against the meter, so
         the game says so once and then never again. */
      if (!earlSaid.bookChecked) {
        earlSaid.bookChecked = true;
        setTimeout(() => say('Earl', "\u201cThe book's the book. It's never stood at " +
          "this machine. Look at the meter before you press anything.\u201d"), 1400);
      }
    }]];
  say('Tooling sheet', body, opts);
  if (REC) REC.action('read_book', { bar: b.barId, bite_mm: b.bite_mm, feed: b.feed_mm_rev,
    sheet_condition: b.assumes.machineCondition, machine_condition: GAME.machine.condition });
}

/** A NEW EDGE. Taylor makes this unavoidable rather than optional: at 320 m/min
 *  an insert is done inside a minute of cutting, so running fast is paid for in
 *  edges — which is the cost the spindle override needed in order to be a
 *  decision rather than a free win. */
function changeEdge() {
  const r = G.changeInsert(GAME, { cost: G.INSERT.cost, minutes: G.INSERT.change_min });
  if (!r.ok) {
    say('You', 'Not with it turning. Stop the spindle.');
    if (REC) REC.refusal('change_insert', r.why, { clock_min: GAME.clock_min });
    return;
  }
  GAME.machine.spindle_on = false;
  if (GAME.state_clock_floor > clocks.job_min + opMin) opMin = GAME.state_clock_floor - clocks.job_min;
  clockFloorMin = Math.max(clockFloorMin, GAME.state_clock_floor);
  GAME.clock_min = clocks.job_min + opMin;
  if (SHOP) SHOP.cash -= r.cost;
  toast(`<b>New edge.</b> The old one had <b>${(r.before * 100).toFixed(0)}%</b> of its ` +
    `life gone.<br>${r.minutes} minutes and ${money(r.cost)}.`, 6000);
  logLine(`Changed the insert — the old edge was <b>${(r.before * 100).toFixed(0)}%</b> used. ` +
    `${r.minutes} min, ${money(r.cost)}.`);
}

/** PUT THE MACHINE BACK ON ITS OWN SCALE. Wear makes a machine cut differently
 *  every time; a calibration error makes it cut wrong the SAME way every time,
 *  which is worse, because a machinist trusts a machine that repeats. */
function callCalibration() {
  const r = G.calibrateMachine(GAME, { cost: G.CALIB.cost, minutes: G.CALIB.minutes });
  if (!r.ok) {
    say('You', 'Calibration is done with the machine stopped.');
    if (REC) REC.refusal('calibrate', r.why, { clock_min: GAME.clock_min });
    return;
  }
  if (GAME.state_clock_floor > clocks.job_min + opMin) opMin = GAME.state_clock_floor - clocks.job_min;
  clockFloorMin = Math.max(clockFloorMin, GAME.state_clock_floor);
  GAME.clock_min = clocks.job_min + opMin;
  if (SHOP) SHOP.cash -= r.cost;
  toast(`<b>Calibrated.</b> The scale was <b>${r.before.toFixed(1)} µm</b> out — ` +
    `every part had been coming off that much the same way wrong.<br>` +
    `${r.minutes} minutes and ${money(r.cost)}.`, 7000);
  logLine(`Calibrated the machine. It had been reading <b>${r.before.toFixed(1)} µm</b> out. ` +
    `${r.minutes} min, ${money(r.cost)}.`);
}

/** Book the machine in. The only thing that puts condition back, and it cannot
 *  be done with the spindle turning. It costs money the shop has to have. */
function callMaint() {
  const r = G.maintain(GAME, { cost: 340, minutes: 45 });
  if (!r.ok) {
    say('You', 'Not while it is turning. Stop the spindle first.');
    if (REC) REC.refusal('maint', r.why, { clock_min: GAME.clock_min });
    return;
  }
  if (SHOP) SHOP.cash -= r.cost;
  if (GAME.state_clock_floor > clocks.job_min + opMin) opMin = GAME.state_clock_floor - clocks.job_min;
  clockFloorMin = Math.max(clockFloorMin, GAME.state_clock_floor);
  GAME.clock_min = clocks.job_min + opMin;
  toast(`<b>Maintenance.</b> Condition ${r.before.toFixed(0)} → <b>${r.after.toFixed(0)}</b>. ` +
    `TIR now ${r.runout_um.toFixed(1)} µm.<br>${r.minutes} minutes and ${money(r.cost)}.`, 7000);
  logLine(`Service visit. Condition <b>${r.before.toFixed(0)} → ${r.after.toFixed(0)}</b>, ` +
    `runout <b>${r.runout_um.toFixed(1)} µm</b>. ${money(r.cost)} and ${r.minutes} minutes gone.`);
  if (REC) REC.action('maint', { before: r.before, after: r.after, cost: r.cost, minutes: r.minutes });
}

/* ── ROUND 9 VERBS — the floor the part moves across ──────────────────────
   Every one of these reads the PHYSICAL state and says what is there. None of
   them reports a diameter, a band position, or a "score": the rack is a rack,
   the bin is a bin, and the only instrument in the shop that measures a bore
   is the one in your hand. */

/* THE Ø ON THE CRATE IS THE DRAWING'S, NOT THE CRATE'S. As it read, the label
   (`Ø90 housings, as-cast`) and the line the crate speaks (`Ø88 mm as-cast
   bore`) sat in one frame with two different diameters and no way to tell which
   was which — the viewer who flagged the frame's sizes called it out. The
   drawing's Ø is what these castings are FOR; the hole in them is 88. */
add(CRATE, () => `Casting crate — as-cast housings for the Ø${GAME.job.nominal_mm} bore`, 'count them', () => {
  const n = GAME.stock_on_hand;
  const r = crateMeta();
  say('You', n > 0
    ? `${n} casting${n === 1 ? '' : 's'} in the crate. Ø${GAME.job.start_hole_dia_mm} mm as-cast bore, ` +
      `${GAME.job.bore_depth_mm} mm deep. Same drawing, same material.`
    : 'The crate is empty. Whatever happens now, it happens without another casting.');
  /* NO COUNT HERE. The header prints `crate N` every frame and this line
     outlives the act that printed it; see the note beside the rack verb. */
  if (n > 0) logLine(`Crate: cast housings, Ø${GAME.job.start_hole_dia_mm} mm as-cast bore, ` +
    `${GAME.job.bore_depth_mm} mm deep.`);
  if (n > 0 && !SEEN.crate) {
    SEEN.crate = true;
    setTimeout(() => say('Earl', `\u201cThat's the crate. ${W.hhmm(G.arrivalMin(GAME.job))} is the van. ` +
      `You get one casting in the machine at a time and there are ${n} in there. Do the arithmetic.\u201d`), 1200);
  }
}, () => true);

add(RACK, 'Finished-part rack — by the roll-up door', 'check it', () => {
  if (HELD) { putDown(); return; }
  const rack = onShelf();
  const send = rack.filter((p) => p.disposition === 'SEND');
  const rework = rack.filter((p) => p.disposition === 'REWORK');
  /* §73'S Part RUNG HAS A VERB. Reading a shelf is not holding the part, and the
     brief asks for it in your hand — so the rack offers it up. Each part is an
     option rather than "take the top one", because which part you pick up is the
     whole question when one of them is undersize. */
  const opts = rack.map((p) => [`Pick up ${p.id} — ${p.disposition}`, () => takeInHand(p.id)]);
  say('You', rack.length === 0
    ? 'Empty. Four slots, nothing on them.'
    : rack.map((p) => `${p.id} — ${p.disposition === 'SEND'
        ? 'in spec, traveller signed, waiting for the van'
        : 'under the bottom of the band, flagged to finish at the customer'}`).join('<br>'),
    opts.length ? opts : undefined);
  /* NO RACK LINE AT ALL. Taking the count out of it was only half the repair:
     what was left named the parts, and a cold viewer read that name against the
     live header in the same frame — `Rack: J1-01 (REWORK)` from four acts ago,
     `rack 0 of 4` in the corner — as the shop disagreeing with itself about its
     own floor. A name goes stale into a contradiction the moment the line that
     took the part away is not read with it, and nothing on a screen makes a
     reader do that. THE TEST, and it is the one that settled this: does the
     line carry a fact that is in the log nowhere else? The count is in the
     header, which is the only surface re-derived every frame. What is on the
     rack is in the log as EVENTS — every part that reached it was put there by
     a settlement line that names it and says where it went (`on the rack by the
     door`, `on the rack, flagged to the customer for rework`) — and the van
     says what it took. So the line was a second derivation of a fact already
     recorded, printed as a state, and it is gone. The look still answers the
     question where the answer is current when it is printed: in the panel. */
  logLine(`Van books ${W.hhmm(G.arrivalMin(GAME.job))}–${W.hhmm(G.departsMin(GAME.job))}. ` +
    (GAME.courier.left
      ? (send.length || rework.length || GONE_SENT ? 'It has been and gone — with the part.'
                                  : 'It has been and gone — <b>with nothing</b>.')
      : `The job is due ${W.hhmm(GAME.job.deadline_min)} — ship after that and it pays ` +
        `${(GAME.job.late_credit * 100).toFixed(0)}%, not full. Anything not on the rack by ` +
        `${W.hhmm(G.departsMin(GAME.job))} does not go at all.`));
}, () => true);

add(FIXTURE, 'Holding fixture — parallels and two strap clamps', 'look at the setup', () => {
  const p = GAME.part.mounted ? G.currentPart(GAME) : null;
  const on = GAME.part.mounted;
  /* ══ §53, ON THE SCREEN AT LAST ═════════════════════════════════════════
     `describeBore` and `perceptionOf` have been in world.mjs since they were
     written and NEITHER WAS EVER CALLED. The whole layered model — you see "a
     hole in a block" until you have measured something; then it is 4140 with a
     36 mm hole; then it is an H6 bore with so many µm of radius left; and only
     after you have been corrected does it become a band, a lobing figure and a
     feed-mark pitch — was modelled, tested by construction, and invisible.

     This is the Part and Feature rungs of the ladder the brief calls the
     signature of the platform, and the layering is the point: the same object
     says four different things depending on what you have done, and none of it
     is a tutorial box. §53 asks for exactly this and it was one call away. */
  const bore = W.describeBore(GAME, SEEN);
  const look = W.perceptionOf(bore, SEEN);
  say('You', (on
    ? `A casting is clamped on the parallels — ${p ? p.id : 'the current part'}. ` +
      `Your dial is zeroed to THIS face and THIS bore.`
    : 'Nothing on the parallels. The clamps are thrown back clear of the table, ' +
      'and the dial reference died with the last part.') +
    `<br><br>${look.text}` +
    /* THE HINT NAMES THE ACT. "There is more here than you can read yet" was a
       promise with no verb in it — a cold viewer called it circular, and they
       were right: the layers unlock by MEASURING (`seen.measured` then
       `seen.corrected`), not by looking again. So the line says what to do. */
    (look.layer < 3 ? `<br><i>Measure it and it says more.</i>` : ''));
  logLine(on
    ? `Fixture: <b>${p ? p.id : 'part'}</b> clamped. Dial reference is this bore.`
    : 'Fixture: <b>empty</b>. Clamps thrown back. Touch off again — the old datum is gone.');
}, () => true);

let biteCmd_um = 0, stickout = 45;

/* ── ROUGHING IS A DECISION, NOT A BUTTON (round 2) ─────────────────────────
 * `DIALS` above is the FINISHING dial — small, fine, one-directional, and it
 * stays exactly as it was because the mechanic it carries (a commanded number
 * that is never what comes off) is the one the round measures. Roughing has a
 * different job: it exists to shift metal, and the bites that matter there are
 * whole millimetres. Reaching 4 mm with the 400 µm dial would need ten presses
 * and would tell the player nothing about load.
 *
 * So roughing gets its own bite ladder, and a feed. The feed is the interesting
 * one: measured on J2, bite 4 mm at 0.12 mm/rev draws 43 % of spindle power and
 * at 0.30 mm/rev is REFUSED at 107 %. Same dial, refusal decided entirely by
 * feed — which is the true statement about this physics (MRR = b·h·vc) and it
 * is already in the kernel. Nothing tells the player that. They find it by
 * having a move turned down. */
/* How much metal roughing deliberately leaves on the RADIUS for the finish
   pass, in µm. 40 µm is a real allowance on a 16 µm-wide IT6 band: it is far
   more than the thermal drift and the surplus combined, so the finish pass is
   always a genuine decision and never a formality. See the note in `doRough`
   for why this replaced a fixed 8 µm offset. */
const FINISH_ALLOWANCE_UM = 40;
const ROUGH_BITES_MM = [0.1, 0.2, 0.3, 0.5, 1.0, 2.0, 3.0, 4.0];
const ROUGH_FEEDS_MM_REV = [0.08, 0.12, 0.20, 0.30, 0.50];
let roughBite_mm = 0.3;      /* the old hard-wired value, kept as the default */
let roughFeed_mm_rev = 0.12; /* ditto */

/* ── THE PREDICTION ─────────────────────────────────────────────────────────
 * Design-lead ruling (2026-09-11): "Make the player expose their current model
 * before the machine gives them the answer." The game refuses to perform the
 * inference for the player — it collects every observation and stops.
 *
 * Shift+1..6 states what you EXPECT the dial to actually remove, in µm, before
 * the cut. From pass one, because "their first prediction is valuable precisely
 * because it records their naive model." A cut with no prediction recorded is
 * refused here rather than silently defaulted, because a default of 0 would
 * manufacture a revision moment the player never had.
 *
 * The historical causal-chain line (dial → removed → surplus) is untouched:
 * "Keep the existing historical causal-chain lines because they are excellent
 * evidence." What is gone is the interpretation. No "Notice that…", no
 * "Therefore…", no statement of the rule. */
const PREDICTIONS = [10, 20, 50, 100, 200, 400];
/* The FINISHING dial — small, fine, one-directional. Kept as its own ladder
   even though it looks like PREDICTIONS, because one is a COMMAND to the
   machine and the other is the player's stated BELIEF about what that command
   will do, and the whole point is that they are allowed to disagree. */
const DIALS = [10, 20, 50, 100, 200, 400];
let predicted_um = null;
const MACHINE_NEAR = new THREE.Vector3(0, 1.6, -7);

function handleMachineKeys(e) {
  const atMachine = eye.distanceTo(MACHINE_NEAR) < 4.2;
  if (!atMachine && !CARRIED.calipers) return;
  const d = 'Digit1 Digit2 Digit3 Digit4 Digit5 Digit6'.split(' ');
  const i = d.indexOf(e.code);

  /* The prediction is a DIFFERENT number from the dial (the whole point is that
     they disagree), so it gets a different key. Shift+1..6. */
  if (i >= 0 && e.shiftKey) { setPrediction(PREDICTIONS[i]); return; }
  if (e.code === 'Digit0' && e.shiftKey) { setPrediction(0); return; }

  if (i >= 0) { biteCmd_um = DIALS[i]; if (REC) REC.action('set_dial', { dial_um: biteCmd_um, key: e.code, clock_min: GAME ? GAME.clock_min : null }); toast(`Dial set to <b>${biteCmd_um} µm</b> on the radius.`, 1800); return; }
  if (e.code === 'Digit0') { biteCmd_um = 0; if (REC) REC.action('set_dial', { dial_um: 0, key: 'Digit0' }); return; }
  if (e.code === 'KeyC') doCut();
  if (e.code === 'KeyM') doMeasure();
  if (e.code === 'KeyT') doTouchOff();
  if (e.code === 'KeyW') return;  // W is also walk-forward; warm-up is Shift+W via panel
  if (e.code === 'KeyV') doWarmUp();
  if (e.code === 'Enter') doInspect();
  /* F is "fetch a casting" — the only verb that can undo a dead part, and it
     costs a real walk, real setup minutes and the stock itself. */
  if (e.code === 'KeyF') doFetchBlank();
  if (e.code === 'KeyR') doRough();
  /* Round 2 roughing controls. `[`/`]` = bite, `-`/`=` = feed. Bound only at
     the machine, like every other machining verb — a feed change made from
     across the shop floor would be a keystroke with no meaning. */
  if (e.code === 'BracketLeft') stepRoughBite(-1);
  if (e.code === 'BracketRight') stepRoughBite(1);
  if (e.code === 'Minus') stepRoughFeed(-1);
  if (e.code === 'Equal') stepRoughFeed(1);
}

function setPrediction(um) {
  predicted_um = um;
  if (REC) REC.action('predict', { predicted_um: um, dial_um: biteCmd_um,
    pass_index: GAME ? GAME.history.length : 0, clock_min: GAME ? GAME.clock_min : null });
  toast(`You expect this cut to take off <b>${um} µm of radius</b> — your guess, now on the EXPECT row. Take the cut.`, 2200);
}


function machinePanel() {
  const atMachine = eye.distanceTo(MACHINE_NEAR) < 4.2;
  const pn = $('panel');
  pn.classList.toggle('on', atMachine);
  const bg = $('budget');
  const cp = $('cutpanel');
  if (cp) cp.classList.toggle('on', atMachine);
  if (!atMachine) { if (bg) bg.classList.remove('on'); return; }
  const m = GAME.machine, last = GAME.history[GAME.history.length - 1];
  const bore = W.boreGeometry(GAME, G.partGrowth_um);
  $('pnTitle').textContent = GAME.mach.label;
  const F = (a, b) => `<div class="row"><i>${a}</i><span>${b}</span></div>`;
  /* A ROW THAT IS A SENTENCE, NOT A READING. The prediction that has not been
     stated is written as an instruction, and an instruction is longer than the
     label column is wide. In the flex row its label and its value were laid out
     on the same line, wrapped, and re-merged — a cold viewer read the pieces
     back as `expector PRED`, a word the source has never contained. A wide row
     stacks instead: label on its own line, the sentence under it, nothing to
     interleave. */
  const FW = (a, b) => `<div class="row wide"><i>${a}</i><span>${b}</span></div>`;
  $('pnRows').innerHTML =
    /* RPM AND THE SURFACE SPEED IT PRODUCES. A machinist reads both, and the
       pair is the honest picture: the same rpm is a different cutting speed on
       a different bore, which is why the speed is measured on the BORE and not
       on the bar. See the note in `boringStep`. */
    F('spindle', m.spindle_on
      ? (last ? `${last.n_rpm.toFixed(0)} rpm · ${last.vc_m_min.toFixed(0)} m/min` : 'running')
      : 'stopped') +
    F('load', m.spindle_on && last ? `${(last.power_kW / GAME.mach.power_max_kW * 100).toFixed(0)}% of 7.5 kW` : '—') +
    F('tool', GAME.toolSpec ? `${GAME.toolSpec.label} · ${stickout} mm out` : '<i>none loaded</i>') +
    F('passes', `${bore.passes}`) +
    /* THE MACHINE'S OWN CONDITION, on the machine. It is the number that makes
       the tooling book below either right or wrong, so it has to be somewhere a
       player can see it without opening anything. */
    F('machine', `${GAME.machine.condition.toFixed(0)} of 1000 · ` +
      `TIR ${G.runout_um_for(GAME.machine.condition).toFixed(1)} µm`) +
    /* THE THREE THINGS THAT GO WRONG THAT ARE NOT THE MACHINE'S STRUCTURE.
       A player has to be able to see the edge running out and the scale
       drifting, or neither is a decision — and they have to see the machine
       DOWN, because "why will it not cut" is a question the panel must answer. */
    F('edge', GAME.tool ? `${(GAME.machine.insert_wear * 100).toFixed(0)}% of its life used` +
      (GAME.machine.insert_wear > 0.8 ? ' <b>— change it</b>' : '') : '<i>no bar loaded</i>') +
    F('scale', GAME.machine.calib_um < 0.05 ? 'on the money'
      : `<b>${GAME.machine.calib_um.toFixed(1)} µm out</b>` +
        (GAME.machine.calib_um > 6 ? ' <b>— recalibrate</b>' : '')) +
    (GAME.machine.down_until !== null && GAME.machine.down_until !== undefined
      ? F('machine', '<b style="color:#e05a4e">DOWN — waiting on a fitter</b>') : '') +
    /* WHAT THE SPINDLE IS SET TO, which is a decision the operator makes and
       not a reading of what the last cut did. The row above reports the rpm and
       surface speed the last pass actually ran at; this one is the setting. */
    F('speed set', `${GAME.machine.vc_m_min} m/min <i>(pendant SPD \u2212 / +)</i>`);
  const surplus = last ? (last.bite_realised_um - last.bite_cmd_um) : 0;
  $('pnCut').innerHTML =
    /* "DIALLED IN", not "dial". Everywhere else in this shop "the dial" is the
       machine's DRO — the zeroed reference you read a position off. This row is
       not a reading; it is the bite the operator has SET for the next cut, and
       a cold viewer crossed the two and saw one word holding two numbers. */
    F('dialled in', `${biteCmd_um} µm radius`) +
    /* THE SYSTEM'S OPEN CLAIM, ON THE MACHINE, WHERE YOU DECIDE. It sits beside
       the player's own expectation because they are the same kind of thing — two
       claims about a part that has not been cut — and because a player who
       cannot see what the system said before the cut cannot catch it being
       wrong after it. */
    (() => {
      const c = GAME.system.claims[GAME.system.claims.length - 1];
      if (!c || c.actual_mm !== null) return '';
      return F('system said', `Ø${c.predicted_mm.toFixed(4)} mm`);
    })() +
    (predicted_um === null
      /* THE INSTRUCTION NAMES THE WORLD, NOT A KEY. The pendant replaced the
         on-screen legend, so any text that still taught Shift+1-6 would be
         teaching a control scheme the game no longer shows. The keys still
         work — a machinist who knows them should not be slowed down — but the
         thing the game POINTS AT is the machine in front of you.
         WIDE, because it is a sentence: see the note beside `FW`. */
      ? FW('you expect', '<i>not stated — PRED −/+ steps your guess in µm of radius, not the dial. Aim at a PRED key on the pendant and press <kbd>E</kbd></i>')
      : F('you expect', `${predicted_um} µm of radius`)) +
    (last ? F('last realised', `${last.bite_realised_um.toFixed(1)} µm of radius <span class="pair"><i>(${surplus >= 0 ? '+' : ''}${surplus.toFixed(1)} µm of radius vs dialled in)</i></span>`) : '') +
    /* THE LEGEND IS GONE. It was three rows of `kbd` tags teaching a control
       scheme, which is the one thing §48 forbids outright — and the build's own
       gate report counted it as its largest remaining debt. The controls are on
       the machine now, and this panel is its readout. */
    `<div class="row" style="margin-top:6px"><i>Controls are on the pendant — ` +
      `point at a key and press <kbd>E</kbd>.</i></div>`;
  /* The instrument, refreshed on every panel tick. It reads the CURRENT
     roughing setting, so stepping the feed with `=` moves the bars before the
     cut rather than after the refusal. */
  const lm = $('pnLoad');
  if (lm) lm.innerHTML = loadMeterHTML();
  /* ══ THE COLUMN ON THE LEFT: THE PART AND ITS ERROR ═════════════════════
     Signed micrometres by cause, from the last pass that cut metal — the
     build's own headline claim, "the interesting number is why the part is
     wrong". It is a printout on the wall, not part of the machine's readout.

     THE STOCK LINE AND THE THREE TEMPERATURES MOVED HERE TOO, and not because
     the right column ran out of room (though it did). They belong to this
     question: the stock is what the part has left, and the three temperatures
     ARE the thermal terms of the budget a few rows below — the numbers that
     produced the numbers. A readout that lists +1.2 µm of workpiece growth and
     keeps the workpiece's actual temperature on a different panel is asking the
     reader to hold two screens in their head. */
  const pb = $('pnBudget');
  if (pb) {
    const lastCut = GAME.history[GAME.history.length - 1];
    pb.innerHTML =
      `<div class="row" style="margin-top:6px"><i>the part</i><span></span></div>` +
      /* THREE PLACES: the CMM the log quotes prints −59.7 µm, and 20.008 −
         19.970 only reads as that subtraction if both are carried to the third
         place. Two decimals turned a defence into a coincidence. */
      `<div class="row"><i>stock</i><span>${(GAME.part.holeDia_cold_mm / 2).toFixed(3)} mm radius</span></div>` +
      `<div class="row"><i>stock to band top</i><span>${bore.stock_to_band_um.toFixed(0)} µm of radius</span></div>` +
      /* three thermometers, one row: a machine's thermal state is read as a
         set, and the three rows it took were the difference between this
         column fitting above the log and printing through it */
      `<div class="row thermal"><i>spindle/screw/part °C</i><span>${m.spindleC.toFixed(1)} / ` +
        `${m.screwC.toFixed(1)} / ${GAME.part.partC.toFixed(1)}</span></div>` +
      (lastCut && lastCut.err_terms
        ? (() => {
            /* THE COLUMN HAS TO ADD UP. The total used to be summed from the
               raw terms while every row above it was filtered (|µm| ≥ 0.05)
               and rounded for print — two derivations of one fact, so the
               printed column could read 5.4 µm of causes under a total of
               5.2 µm, and a reader who checked the arithmetic caught the
               wall lying. The rows are built once, as the exact strings that
               get printed, and the total is the sum of those strings. */
            const printed = lastCut.err_terms
              .filter((t) => Math.abs(t.um) >= 0.05)
              .map((t) => [String(t.name).replace(/\s*\(.*\)$/, ''), t.um.toFixed(1)]);
            const total = printed.reduce((a, r) => a + Number(r[1]), 0).toFixed(1);
            return `<div class="row" style="margin-top:6px"><i>why the bore is wrong (radius)</i><span></span></div>` +
              printed.map(([name, um]) => `<div class="row"><i>${name}</i>` +
                `<span>${Number(um) > 0 ? '+' : ''}${um} µm</span></div>`).join('') +
              `<div class="row"><i><b>total</b></i><span><b>${total} µm of radius</b></span></div>`;
          })()
        : '');
    /* AN EMPTY PANEL IS A DARK RECTANGLE ON THE WALL. It appears when the
       machine has something to say and not before. */
    const bg = $('budget');
    if (bg) bg.classList.toggle('on', pb.innerHTML.trim().length > 0);
  }
}

/* ── THE VERBS — every number from the kernel, none from here ───────────── */
/* OPERATION TIME. The kernel self-reports the clock cost of what you do —
   a measurement costs half a minute, a 20-minute spindle run costs 20. Under
   the two-clock design that cost is REAL, so it is accumulated here and the
   kernel's own wall-clock advance is discarded (else it is counted twice).
   NOTE: GAME is the STATE object; the functions live on the module G. */
let opMin = 0;
/* ROUND 9. The lowest minute the job clock is allowed to be at. State changes
   in the game layer (fetching a casting, a re-setup) cost REAL minutes, and
   those costs are applied to `GAME.clock_min` inside game.mjs — where they can
   be unit-tested — rather than here. The frame loop recomputes the clock from
   `clocks.job_min + opMin` every tick, so without this floor it would hand
   every one of those minutes straight back on the next frame. */
let clockFloorMin = 0;
function kernelJob(fn, ...args) {
  const before = GAME.clock_min;
  const out = fn(GAME, ...args);
  const consumed = GAME.clock_min - before;
  GAME.clock_min = before;
  if (consumed > 0) { opMin += consumed; GAME.clock_min = clocks.job_min + opMin; }
  return out;
}
function needCalipers() {
  if (CARRIED.calipers) return true;
  if (REC) REC.refusal('measure', 'NO_CALIPERS', { clock_min: GAME.clock_min });
  say('You', 'Nothing to measure with. The calipers are on the bench by the machine.');
  return false;
}
function doMeasure() {
  if (!needCalipers()) return;
  SEEN.measured = true;
  if (phase === 'ARRIVE') phase = 'MEASURE';
  const r = kernelJob(G.measure, { samples: 3, seed: 7 });
  lastRead = { mm: r.reading_mm, sigma_um: r.sigma_um, partC: r.partC,
               at_min: GAME.clock_min, coldDia_at_measure: r.coldDia_mm };
  if (REC) REC.measurement({
    reading_mm: r.reading_mm, sigma_um: r.sigma_um, hotDia_mm: r.hotDia_mm,
    coldDia_mm: r.coldDia_mm, partC: r.partC, job: GAME.job,
    seq_index: GAME.shots, clock_min: GAME.clock_min,
    tool: GAME.tool ? GAME.tool.label : null,
  });
  const bore = W.boreGeometry(GAME, G.partGrowth_um);
  const off = r.reading_mm - GAME.job.nominal_mm;
  /* THE GAUGE'S CLAIM IS PRINTED TO THE PLACE THE PART CAN DEFEND. The CMM the
     log quotes later says −59.7 µm, and the gauge's own last digit used to be
     rounded away here — the error between the claim in your hand and the
     machine's truth (the whole subject of this shop) could not be worked out
     from the two printed numbers. */
  logLine(`Gauge says <b>Ø${r.reading_mm.toFixed(4)}</b> mm at ${r.partC.toFixed(1)} °C ` +
    `(±${r.sigma_um.toFixed(2)} µm) — ${(off * 1000).toFixed(1)} µm on the diameter from nominal. ` +
    `The dial has <b>${bore.stock_to_band_um.toFixed(0)} µm</b> of radius left under the top of the band.`);
  if (!earlSaid.corrected && Math.abs(off) > 2) {
    earlSaid.corrected = true; SEEN.corrected = true;
    setTimeout(() => say('Earl', "\u201cYou're measuring the bell-mouth. Back the thumbwheel " +
      "off, feel it touch, then read it. Don't squeeze the jaws.\u201d"), 2400);
  }
}
function doTouchOff() {
  const g = GAME;
  if (!g.tool) { if (REC) REC.refusal('touch_off', 'NO_TOOL', { clock_min: g.clock_min }); return say('You', 'No bar in the spindle.'); }
  /* the datum is set ONCE, in the cold frame, and never re-referenced */
  if (g.machine.edgeR_cold_mm === null) {
    g.machine.edgeR_cold_mm = g.part.holeDia_cold_mm / 2;
    GAME.machine.refSpindleC = g.machine.spindleC;
    GAME.machine.refScrewC = g.machine.screwC;
    if (REC) REC.action('touch_off', { clock_min: g.clock_min, first: true,
      coldDia_mm: g.part.holeDia_cold_mm });
    logLine('<b>Touch-off.</b> Dial zeroed on the wall as it stands. Every number from ' +
      'here is relative to this datum. The band is a diameter; the dial moves radius, half of it.');
    say('You', 'The bar just kissed the wall. Dial is zero here.');
  } else { if (REC) REC.action('touch_off', { clock_min: g.clock_min, first: false }); toast('Already touched off.', 1600); }
}
function doWarmUp() {
  const g = GAME;
  if (g.machine.spindle_on) { if (REC) REC.refusal('warm_up', 'ALREADY_RUNNING', { clock_min: g.clock_min }); return toast('Already running.', 1600); }
  const b4 = { s: g.machine.spindleC, r: g.machine.screwC, p: g.part.partC };
  kernelJob(G.warmUp, 20);
  g.machine.spindle_on = true;
  if (REC) REC.action('warm_up', { clock_min: g.clock_min, minutes: 20,
    spindleC_before: b4.s, spindleC_after: g.machine.spindleC,
    screwC_before: b4.r, screwC_after: g.machine.screwC,
    partC_before: b4.p, partC_after: g.part.partC,
    edgeOffset_um: G.edgeOffset_um(g) });
  logLine(`Spindle run <b>20 min</b>. Spindle ${b4.s.toFixed(1)} → ${g.machine.spindleC.toFixed(1)} °C, ` +
    `part ${b4.p.toFixed(1)} → ${g.part.partC.toFixed(1)} °C. ` +
    `Thermal edge offset now <b>${G.edgeOffset_um(g).toFixed(1)} µm</b>.`);
  if (!earlSaid.warm) { earlSaid.warm = true;
    setTimeout(() => say('Earl', "\u201cHe\u2019s got you warming spindles now. " +
      "Just don\u2019t stand there watching it, it\u2019ll take twenty minutes either way.\u201d"), 2000); }
}
/* ── THE PUSHBACK, SAID IN NUMBERS ──────────────────────────────────────────
 * A refusal that says only "no" is a slot machine. This says WHAT wall, HOW
 * FAR past it, and WHAT the machine already managed — three facts, no rule.
 *
 * It deliberately does NOT compute the largest bite that would fit. Working
 * backwards from the wall to the answer is the inference the player is here to
 * make, and handing it over would replace the round's mechanic with arithmetic
 * the game did for them. It reports the load on the move that was ASKED for,
 * which is what a load meter does, and stops. */
function refusalText(bite, feed, env, why, did_um, extra_min = 0) {
  const blade = `bite <b>${bite.toFixed(2)} mm</b> at feed <b>${feed.toFixed(2)} mm/rev</b>`;
  let head;
  if (why === 'SPINDLE POWER LIMIT') head = '<b>Not enough spindle.</b>';
  else if (why === 'TORQUE LIMIT') head = '<b>Not enough torque.</b>';
  else if (why === 'CHATTER') head = '<b>It would sing.</b>';
  else if (why === 'SPINDLE SPEED LIMIT') head = '<b>Out of rpm.</b>';
  else if (why === 'NO STOCK') head = '<b>Nothing there to cut.</b>';
  else if (why === 'RUBBING') head = '<b>Rubbing, not cutting.</b>';
  else head = `<b>Refused: ${why}.</b>`;
  /* ── WHAT A REFUSAL IS ALLOWED TO SAY ─────────────────────────────────
     It says WHICH limit stopped it. It does NOT say how far past the limit
     the command was, because that number — "wants 159 % of spindle power" —
     is the exact free oracle this round removes: it told the player precisely
     where the wall was, for any hypothetical, at no cost, without ever making
     a cut. The wall is still findable; it is found by cutting, which is the
     mechanic. The reason it is refused is still named, because a machinist
     who trips an interlock can see which lamp lit. */
  const cost = extra_min > 0
    ? `<br><span style="color:#e05a4e">Asking again cost ${extra_min} min on the drive.</span>`
    : '<br><span style="color:#8b98a6">First time, so no time lost. Try a different setting.</span>';
  toast(`${head} ${blade} — ${why.toLowerCase()}.${cost}`, 7000);
  logLine(`Roughing refused: <b>${why}</b> on ${blade}.` +
    (extra_min > 0 ? ` <b>${extra_min} min</b> lost to the drive.` : ''));
}

/* ── THE LOAD METER, AND THE ONE ROUND 9 CHANGE TO WHAT IT WILL ANSWER ──────
 * WHY THIS EXISTS, GIVEN ROUND 1'S RULE ABOUT NOT SHOWING NUMBERS. The
 * difference is that this is not a measurement of the PART — it is a
 * measurement of the MACHINE, and a machinist without a load meter is not being
 * asked to infer anything, he is being asked to guess. Every machine in the
 * shop has one and the operator glances at it constantly. It also cannot leak
 * the round-1 secret: that one is a diameter, and nothing here is derived from
 * the true bore or from the surplus.
 *
 * ── WHAT CHANGED, AND WHY THE OLD GATE IS GONE ────────────────────────────
 * Round 8 measured an INFORMATIONAL EXPLOIT, and the design lead's ruling on
 * it is the reason this function is now shaped the way it is:
 *
 *   "Don't solve free refusal by attaching an arbitrary penalty just because
 *    spam is bad... if it is an interlock rejecting an impossible command
 *    before motion, then zero metal and perhaps essentially zero machine
 *    consequence may actually be correct. In that case the problem is not
 *    physics; it is that the player receives unlimited high-quality
 *    information for free. Solve THAT informational exploit."
 *
 * That is exactly what was happening. `envelope()` is a pure function of the
 * COMMANDED bite, so this meter answered any hypothetical for free, instantly,
 * and exactly — an unlimited oracle that told the player which side of the
 * wall a move was on without ever making it. The refusal itself was fine. The
 * oracle was not.
 *
 * A REAL INTERLOCK IS A HARDWARE LIMIT. An axis drive does not answer an
 * interrogative; it feeds back and it faults. So:
 *
 *   • With no cut on record for a setting, the meter shows the CERTIFIED
 *     RANGE of the setting itself — the bite and feed the shop says the
 *     machine will take — and NOTHING about what that move would draw. That
 *     is a specification plate, which every machine really has, and it is the
 *     genuinely free information. It cannot be interrogated for an answer to
 *     "will THIS move be refused", because it does not know what this move is.
 *   • UNTIL THE PLAYER HAS COMMITTED, the bars for an untried setting show
 *     the move that was ACTUALLY MADE most recently at that setting, or read
