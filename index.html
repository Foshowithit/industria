<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="A playable digital twin of industrial civilization. You are a new hire at Halvorsen Pumps. Bore a bearing housing to H6 and hope it is right.">
<title>INDUSTRIA — your first shift at Halvorsen Pumps</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%2314181d'/><circle cx='16' cy='16' r='9' fill='none' stroke='%237d8b98' stroke-width='5'/></svg>">
<style>
  :root{ --ink:#e8edf2; --dim:#8b98a6; --warn:#e8a33d; --bad:#e05a4e; --ok:#5fbf7a; --panel:rgba(10,14,18,.82); }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#0a0d11;color:var(--ink);
    font:14px/1.45 ui-monospace,"SF Mono",Menlo,Consolas,monospace}
  canvas{display:block}
  #vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 62%,rgba(0,0,0,.32) 100%)}

  /* ── diegetic HUD: no quest arrows, no floating clutter (§48) ───────────── */
  .hud{position:fixed;pointer-events:none;text-shadow:0 1px 3px #000}
  #tl{top:14px;left:16px}
  #tl .job{font-size:15px;letter-spacing:.02em}
  #tl .cli{color:var(--dim);font-size:12px}
  #tl .clock{font-size:26px;letter-spacing:.04em;margin-top:6px}
  #tl .deadline{color:var(--dim);font-size:12px}
  #tl .deadline.late{color:var(--bad)}

  #tr{top:14px;right:16px;text-align:right;font-size:12px;color:var(--dim)}
  #tr b{color:var(--ink);font-weight:500}
  #tr .band{color:var(--ink)}
  /* the shop floor, as four counts. Never a verdict, never a diameter. */
  #tr .floor{margin-top:7px;padding-top:6px;border-top:1px solid #2a333d;
    font-size:11px;line-height:1.5;text-align:right}
  #tr .floor s{text-decoration:none;color:var(--dim)}
  #tr .floor b{font-weight:500}
  #tr .floor .vanout{color:var(--warn)}
  #tr .floor .vandone{color:var(--bad)}

  /* the hover label — the only thing that tells you a thing is a thing */
  #look{left:50%;top:calc(50% + 26px);transform:translateX(-50%);text-align:center;font-size:13px}
  #look .nm{background:var(--panel);border:1px solid #2a333d;padding:3px 9px;border-radius:2px}
  #look .act{color:var(--dim);font-size:11px;margin-top:3px}
  #look .verb{color:var(--warn)}

  /* machine panel: appears only when you are at the machine */
  #panel{right:16px;bottom:16px;width:266px;background:var(--panel);
    border:1px solid #2a333d;border-radius:3px;padding:11px 12px;pointer-events:none;display:none}
  #panel.on{display:block}
  #panel h4{margin:0 0 8px;font-size:11px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;font-weight:500}
  #panel .row{display:flex;justify-content:space-between;font-size:12px;padding:1px 0}
  #panel .row i{color:var(--dim);font-style:normal}
  #panel .cut{margin-top:8px;padding-top:8px;border-top:1px solid #2a333d}
  #panel kbd{background:#1b2229;border:1px solid #333d47;border-radius:2px;padding:0 4px;font-size:11px;color:var(--ink)}
  /* the load meter — a machine instrument, not a part measurement */
  #pnLoad{margin-top:8px;padding-top:8px;border-top:1px solid #2a333d}
  #pnLoad .lm{display:flex;align-items:center;gap:6px;font-size:10px;padding:1px 0}
  #pnLoad .lm i{color:var(--dim);font-style:normal;width:44px;letter-spacing:.06em}
  #pnLoad .lmt{flex:1;height:5px;background:#1b2229;border-radius:2px;overflow:hidden}
  #pnLoad .lmt b{display:block;height:100%;background:#69a84f}
  #pnLoad .lm em{font-style:normal;color:var(--dim);width:30px;text-align:right;font-variant-numeric:tabular-nums}
  #pnLoad .lm em.over{color:#e2614a;font-weight:600}
  #pnLoad .lmsub{color:var(--dim);font-size:10px;margin-top:3px;font-variant-numeric:tabular-nums}

  /* toasts — used ONLY for speech and events, never for instructions */
  #talk{left:50%;bottom:74px;transform:translateX(-50%);max-width:min(620px,86vw);text-align:center}
  #talk .who{color:var(--warn);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
  #talk .say{font-size:16px;margin-top:5px}
  #talk .opt{pointer-events:auto;cursor:pointer;display:inline-block;margin:9px 4px 0;padding:4px 10px;
    background:var(--panel);border:1px solid #333d47;border-radius:2px;font-size:13px}
  #talk .opt:hover{border-color:var(--warn);color:var(--warn)}

  #ev{left:50%;top:76px;transform:translateX(-50%);text-align:center;font-size:13px;color:var(--warn)}
  #ev div{margin:3px 0}
  /* The session handover. It shares #ev's corner but not its warning colour —
     this is not a problem, it is the way a run gets out of the browser. It must
     also outrank #ev's own colour rule, hence the explicit colour below.
     `pointer-events:auto` is NOT optional: .hud sets `none` on the whole layer,
     so without it the span renders, looks clickable, and silently swallows
     every click into the canvas behind it. Same reason #talk .opt re-enables it. */
  #ev .getrec{color:var(--dim);font-size:12px;background:var(--panel);
    border:1px solid #333d47;border-radius:2px;padding:6px 10px;max-width:min(420px,80vw);
    pointer-events:auto}
  #ev .getrec b{color:var(--ink);font-weight:500}
  #ev .getrec .dl{color:var(--warn);cursor:pointer;text-decoration:underline;
    text-underline-offset:2px;white-space:nowrap;pointer-events:auto}
  #ev .getrec .hint{color:var(--dim);white-space:nowrap}
  #ev .getrec kbd{background:#1b2229;border:1px solid #333d47;border-radius:2px;
    padding:0 4px;font-size:11px;color:var(--ink)}

  /* #log is a bottom-left column; #talk is a centred column. Left uncapped they
     CROSS, and #log paints later so it wins — measured 7808 px² of overlap at
     1280x760 printing the log's long pass lines straight over the dialogue.
     Cap the log's width just short of the dialogue's left edge so the two
     columns can never meet. 50vw = half the #talk max-width (min(620px,86vw));
     the 24px is the gutter. Verified 0 overlap at 1280/1366/1440/1920. */
  #log{left:16px;bottom:16px;max-width:calc(50vw - min(310px,43vw) - 24px);max-height:30vh;overflow:hidden;
    display:flex;flex-direction:column-reverse;gap:2px;font-size:12px}
  #log div{color:var(--dim)}
  #log div b{color:var(--ink);font-weight:500}
  #log .new{color:var(--ink)}

  /* entrance: the only screen that is not the world */
  #gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:#070a0d;z-index:9;cursor:pointer}
  #gate .in{max-width:640px;padding:0 26px}
  #gate h1{font-size:13px;letter-spacing:.42em;color:var(--dim);margin:0 0 22px;font-weight:400}
  #gate .big{font-size:23px;line-height:1.5}
  #gate .sub{color:var(--dim);margin-top:18px;font-size:13px;line-height:1.7}
  #gate .go{margin-top:30px;color:var(--warn);font-size:13px}
  #gate .fine{color:#5c6774;font-size:11px;margin-top:22px;line-height:1.6}
  #hint{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);color:#5c6774;font-size:11px}
</style>
</head>
<body>
<div id="vig"></div>

<div class="hud" id="tl">
  <div class="job" id="hJob">—</div>
  <div class="cli" id="hCli"></div>
  <!-- WHAT THE CLIENT IS DOING, NOT WHAT THEY SCORE. Deliberately not the
       standing number: §4 forbids progression by perk or timer and a bare
       integer in the corner of the screen is an XP bar whatever it is called.
       The behaviour is the same fact and it is the one a player can act on. -->
  <div class="cli" id="hShop"></div>
  <div class="clock" id="hClock">--:--</div>
  <div class="deadline" id="hDue"></div>
</div>

<div class="hud" id="tr">
  <div>GAUGE <b id="hGauge">—</b></div>
  <div>BAND <b class="band" id="hBand">—</b></div>
  <div style="margin-top:5px" id="hMoney">—</div>
  <!-- ── ROUND 9: THE FLOOR, ON SCREEN AND NOT IN A LEDGER ───────────────
       The pass condition says the new state must be observable WITHOUT
       reading a ledger. `#hFloor` is the compromise that keeps that honest:
       it is not a ledger — it is not a list of charges, and it never shows a
       verdict, a diameter or a score. It is four COUNTS of physical objects
       (castings in the crate, parts on the rack, parts in the bin, parts
       already collected) plus the van's own deadline. Every one of those
       numbers is also a thing you can walk up to and look at, and if this
       line and the scene ever disagreed, the scene is right and this is the
       bug. It is capped at two rows so it can never become a dashboard. -->
  <div id="hFloor" class="floor"></div>
</div>

<div class="hud" id="look"><span class="nm" id="lkName"></span><div class="act" id="lkAct"></div></div>
<div class="hud" id="ev"></div>
<div class="hud" id="talk"></div>
<div class="hud" id="log"></div>

<div class="hud" id="panel">
  <h4 id="pnTitle">Machine</h4>
  <div id="pnRows"></div>
  <div class="cut" id="pnCut"></div>
  <div data-lmhost="1" id="pnLoad"></div>
  <!-- WHY THE PART IS WRONG, ATTRIBUTED. The kernel's signed terms, from the
       last pass that actually cut metal. No score, no verdict — the arithmetic,
       the way this build's own reference cases show it. -->
  <div id="pnBudget"></div>
</div>

<div id="hint">WASD move · mouse look · <b>E</b> use · <b>shift</b> run</div>

<div id="gate"><div class="in">
  <h1>INDUSTRIA</h1>
  <div class="big" id="gBig">Loading.</div>
  <div class="sub" id="gSub"></div>
  <div class="go" id="gGo"></div>
  <div class="fine" id="gFine">Click to enter · Esc releases the mouse.</div>
  <!-- ══ THE ADVISORY NOTICE ═══════════════════════════════════════════════
       The README has claimed since it was written that "the page shows those
       badges" — `machine_execution = false` and `production_authorization =
       false` — and the page showed neither. The build's own stated position is
       that a simulation which looks authoritative and is subtly wrong is worse
       than no simulation at all, and the badges are where that position is
       supposed to be visible rather than merely asserted in a README.

       Read from the kernel rather than typed here, so the notice cannot drift
       from the flags it is describing. -->
  <div class="fine" id="gAdv"></div>
</div></div>

<script type="module">
import * as THREE from './vendor/three/three.module.min.js';
import * as G from './game.mjs';
import * as W from './world.mjs';
/* The kernel, for its ADVISORY FLAGS. The page must be able to say what this
   model is not, and the honest source for that is the model itself. */
import * as K from './kernel.mjs';
import * as P from './people.mjs';
import { createAudio } from './audio.mjs';
/* The business the machine sits in. Pure, tested, no DOM — see its header for
   what was ported from the economy architecture at ~/industria and what was
   not, and why the constants moved. */
import { newShop, recordDelivery, offersFor, endOfDay, describeShop, averageClaimError_um, STANDING_OFFERS, unreported, markReported, letterFor } from './shop.mjs';
/* The shop's surfaces. Drawn in the page, deterministic, no assets — see the
   header of materials.mjs for why they are not files. */
import { shopMaterials, shopEnvironment, tint, keypadPanel, keyAtUV, keyRectUV, KEYPAD, noticePanel, clockFace, consoleScreen } from './materials.mjs';
/* Playtest instrumentation. Dark unless the URL asks for it (`?rec=1`), so the
   public build behaves exactly as before — see recorder.mjs and PLAYTEST-KIT.md.
   Every call below is a no-op returning early when `REC` is null. */
import * as RECmod from './recorder.mjs';
const REC = RECmod.isRecording() ? RECmod : null;

/* ══════════════════════════════════════════════════════════════════════════
   INDUSTRIA — the floor.
   The numbers are the kernel's. This file decides where to put them and what
   they look like, and it is not allowed to invent any of them (§R4).
   ══════════════════════════════════════════════════════════════════════════ */

const $ = (id) => document.getElementById(id);
const cl = (v, a, b) => Math.min(b, Math.max(a, v));
/** Money on screen. `£-647.5` is not a number a shop writes on anything: the
 *  sign belongs before the symbol and the pence are part of the figure. The
 *  arithmetic stays exact; only the rendering is rounded. */
const money = (v) => `${v < 0 ? '-' : ''}\u00a3${Math.abs(v).toFixed(2)}`;

/** How many castings the crate DRAWS, which is not the same as how many it
 *  holds once one is on the table. The crate object is the shop's, so the
 *  count is the shop's count and the machine does not borrow from it. */
function crateMeta() {
  const n = GAME ? GAME.stock_on_hand : 3;
  return { shown: cl(n, 0, 3), n };
}

/* ── STATE ──────────────────────────────────────────────────────────────── */
let GAME = null;                       // the kernel's game state
/* THE SHOP OUTLIVES THE JOB. `startShift` rebuilds GAME from a fresh spec on
   purpose — nothing of the old part may leak across — but the business is not
   the part. Cash, standing and the day's record have to survive exactly the
   reset that erases everything else, which is why they live out here. */
let SHOP = null;
const clocks = { world_min: 0, job_min: 0, job_taken: false };
let START_SHIFT_MIN = 355;             // 05:55
const SEEN = { any: false, measured: false, corrected: false };  // §53 layers
/* Round 9. `GONE_SENT` is a cached fact, not a second source of truth: the
   van takes a part out of the shop and the part register then holds it as
   GONE, which is invisible to a shelf. The page keeps one boolean so a
   sentence about the bay still reads correctly after the rack is empty, and
   it is written only by `courierBeat()`, only from the courier's own result. */
let GONE_SENT = false;
const CARRIED = { calipers: false, parallels: false, traveler: false };
/* The ONLY diameter the player is ever allowed to see. Gauge resolution is
   finite and the reading goes stale the moment you cut — both by design. */
let lastRead = null;                 // { mm, sigma_um, partC, at_min }
let revealed = null;                 // truth, and only ever AFTER the part ships
/** Post-mortem only: the customer measures it properly, and then you are told.
 *  This is the one moment the truth is allowed on screen (R1). */
function revealLine() {
  if (!revealed) return '';
  return `<span style="color:#8b98a6">Customer CMM: true bore ` +
    `<b style="color:#e8edf2">Ø${revealed.true_mm.toFixed(4)}</b> mm at 20 °C, ` +
    `${revealed.err_um >= 0 ? '+' : ''}${revealed.err_um.toFixed(1)} µm vs nominal. ` +
    `Your last gauge reading was Ø${revealed.read_mm.toFixed(4)} — ` +
    `the gauge was out by ${revealed.gauge_err_um.toFixed(1)} µm.</span>`;
}
let phase = 'ARRIVE';
let earlIdleSince = 0, earlSaid = {}, lastEarlAt = -99;

/* ── THREE ──────────────────────────────────────────────────────────────── */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.42;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(72, innerWidth / innerHeight, 0.04, 220);
const eye = new THREE.Vector3(-7.5, 1.68, 8.4);
let yaw = -0.30, pitch = -0.06;

/* ── MATERIALS — §49 wants a shop that has been used, not a showroom ──────
   Every surface below is DRAWN (materials.mjs), not coloured. The previous
   pass had thirty-six flat colours and no map at all, which is why the place
   read as a greybox no matter how many objects were added to it: a colour
   value cannot be worn, chipped, stained or wiped. These can.

   The three map types matter separately:
     map          — what the surface IS (concrete, painted steel, cast iron)
     roughnessMap — where it is polished and where it is dull. This is the one
                    that makes coolant read as wet against dry cast iron.
     normalMap    — grit. Without it a floor is a photograph on a plane.
   `tint()` gives a second colour of a surface without a second canvas, which
   is how the same sheet metal is a grey machine and a yellow guard. */
const MATS = shopMaterials();
const M = {
  floor: MATS.floor,
  aisle: MATS.aisle,
  wall:  MATS.wall,
  roof:  MATS.roof,
  steel: MATS.steel,
  dark:  tint(MATS.paint, 0x454c54),
  paint: MATS.paint,
  warn:  tint(MATS.paint, 0xc9a227),
  wood:  MATS.wood,
  vise:  MATS.iron,
  iron:  MATS.iron,       // cast iron: the table, the vise, the way covers
  rust:  MATS.rust,
  brass: new THREE.MeshStandardMaterial({ color: 0xa88a4a, roughness: 0.42, metalness: 0.85 }),
  coolant: new THREE.MeshPhysicalMaterial({ color: 0xa8c4a0, roughness: 0.22, metalness: 0.1,
             transparent: true, opacity: 0.55, transmission: 0.3, thickness: 0.4 }),
  chip:  new THREE.MeshStandardMaterial({ color: 0x8e9aa4, roughness: 0.35, metalness: 0.9 }),
  glass: new THREE.MeshPhysicalMaterial({ color: 0xd8e6ef, roughness: 0.04, metalness: 0,
             transparent: true, opacity: 0.13, side: THREE.DoubleSide }),
  interior: MATS.interior,
  bench: MATS.bench,
  bright: tint(MATS.paint, 0xeef1f4),
  slot: tint(MATS.iron, 0x6d7076),
  paper: tint(MATS.paint, 0xf2efe6),
  ink:   tint(MATS.paint, 0x8d949a),
};

const box = (w, h, d, mat, x = 0, y = 0, z = 0, parent = scene) => {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true; parent.add(m); return m;
};
const cyl = (rt, rb, h, mat, seg = 24) => new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat);

/* ── THE BUILDING ───────────────────────────────────────────────────────── */
const ROOM = { w: 42, d: 34, h: 6.2 };
const floorMesh = new THREE.Mesh(new THREE.PlaneGeometry(ROOM.w, ROOM.d), M.floor);
floorMesh.rotation.x = -Math.PI / 2; floorMesh.receiveShadow = true; scene.add(floorMesh);

const roof = new THREE.Mesh(new THREE.PlaneGeometry(ROOM.w, ROOM.d),
  M.roof.clone());
roof.material.side = THREE.DoubleSide;
roof.rotation.x = Math.PI / 2; roof.position.y = ROOM.h; scene.add(roof);

/* walls, with a roll-up door on the -Z end (you came in through it) */
box(ROOM.w, ROOM.h, 0.3, M.wall, 0, ROOM.h / 2, -ROOM.d / 2);
box(0.3, ROOM.h, ROOM.d, M.wall, -ROOM.w / 2, ROOM.h / 2, 0);
box(0.3, ROOM.h, ROOM.d, M.wall, ROOM.w / 2, ROOM.h / 2, 0);
box(ROOM.w, ROOM.h, 0.3, M.wall, 0, ROOM.h / 2, ROOM.d / 2);
const door = box(5.4, 4.4, 0.22, M.dark, 0, 2.2, -ROOM.d / 2 + 0.28);
for (let i = 0; i < 6; i++) box(5.4, 0.06, 0.26, M.steel, 0, 0.5 + i * 0.72, -ROOM.d / 2 + 0.3);

/* a painted aisle down the middle, worn in the traffic lanes */
const aisle = new THREE.Mesh(new THREE.PlaneGeometry(3.2, ROOM.d - 4), M.aisle);
aisle.rotation.x = -Math.PI / 2; aisle.position.set(-2.2, 0.008, 1); aisle.receiveShadow = true; scene.add(aisle);

/* ── LIGHTING — driven by world.daylight(); shop fluorescents always on ───
   THE ENVIRONMENT COMES FIRST, and it is the reason the previous pass looked
   like a greybox even where geometry was right. A MeshStandardMaterial with
   metalness 0.7 and no environment reflects NOTHING, so every steel surface
   rendered almost black, every roughness value did nothing, and the whole room
   collapsed to a flat fog of its own paint colour. `shopEnvironment()` draws
   this room — dark roof, six lamp bars, grey walls, the cold rectangle of the
   open door — prefilters it, and from here on the materials reflect a shop.

   HAZE. A 40 m shop at half five in the morning is not sharp to the far wall,
   and without it the room reads as a diagram rather than a place. Density is
   set so the far wall is roughly a third of the way to the fog colour: enough
   to give the lamps something to bloom into, not enough to hide the van. */
scene.environment = shopEnvironment(renderer);
scene.environmentIntensity = 0.42;
scene.fog = new THREE.FogExp2(0x151a20, 0.014);

const hemi = new THREE.HemisphereLight(0xd6e2ee, 0x5a6168, 1.12); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffe9c8, 0.55);
sun.position.set(-14, 12, -8); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); sun.shadow.camera.far = 48;
sun.shadow.camera.left = -22; sun.shadow.camera.right = 22;
sun.shadow.camera.top = 22; sun.shadow.camera.bottom = -22;
sun.shadow.bias = -0.0009; sun.shadow.normalBias = 0.022; scene.add(sun);
/* The door is the only light in this building that is not a tube, and it is
   the one that tells you what time it is without a clock in the corner. */
const dawn = new THREE.DirectionalLight(0x9fbcdf, 0.32);
dawn.position.set(4, 3.4, -26); dawn.target.position.set(0, 1.6, 6);
scene.add(dawn); scene.add(dawn.target);

const LAMPS = [];
for (let ix = -1; ix <= 1; ix++) for (let iz = -1; iz <= 1; iz++) {
  const x = ix * 12, z = iz * 9.5;
  const g = new THREE.Group(); g.position.set(x, ROOM.h - 0.5, z); scene.add(g);
  box(2.4, 0.16, 0.5, M.dark, 0, 0, 0, g);
  const tube = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.06, 0.42),
    new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xeef4ff, emissiveIntensity: 2.4 }));
  tube.position.y = -0.11; g.add(tube); LAMPS.push(tube);
  const pl = new THREE.PointLight(0xf2f6ff, 2.1, 20, 2); pl.position.set(x, ROOM.h - 1.2, z); scene.add(pl);
}
/* Hanging pendants down the aisles. A shop lit only from six metres up is a
   shop nobody works in: these put pools of light at bench height, which is
   where the eye is and where the work is. Their bulbs are kept in their own
   list because the ceiling circuits and the bench circuits are not the same
   circuit — the frame loop drives each from the clock separately. */
const PRACTICALS = [];
for (const [px, pz] of [[-9, 2], [6, 5], [-4, -6], [9, -4]]) {
  const g = new THREE.Group(); g.position.set(px, 2.85, pz); scene.add(g);
  box(0.035, 2.8, 0.035, M.dark, 0, 1.4, 0, g);                  // drop rod to the frame
  const shade = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.36, 0.28, 24, 1, true), M.bright);
  shade.position.y = 0.14; shade.castShadow = true; g.add(shade);
  const bulb = new THREE.PointLight(0xfff0d6, 1.9, 11, 1.7); bulb.position.y = -0.14; g.add(bulb);
  PRACTICALS.push(bulb);

/* ── THE 3D PART — geometry driven by the kernel's bore diameter ────────── */
const PART = { mesh: null, mat: new THREE.MeshStandardMaterial({ color: 0x707880, roughness: 0.5, metalness: 0.78 }) };
function buildPartMesh(dia_mm, depth_mm) {
  if (PART.mesh) { cell.remove(PART.mesh); PART.mesh.geometry.dispose(); }
  const rO = 0.062, rI = (dia_mm / 1000) / 2, dep = depth_mm / 1000;
  /* block → bored hole, as a lathe of segments so the hole has real physical size */
  const shape = new THREE.Shape();
  shape.absarc(0, 0, rO, 0, Math.PI * 2, false);
  const hole = new THREE.Path(); hole.absarc(0, 0, rI, 0, Math.PI * 2, true); shape.holes.push(hole);
  const geo = new THREE.ExtrudeGeometry(shape, { depth: dep, bevelEnabled: false, curveSegments: 48 });
  geo.rotateX(-Math.PI / 2); geo.translate(0, dep, 0);
  PART.mesh = new THREE.Mesh(geo, PART.mat);
  PART.mesh.castShadow = PART.mesh.receiveShadow = true;
  PART.mesh.position.set(-0.1, 1.30, 0.35);
  cell.add(PART.mesh);
  return PART.mesh;
}
buildPartMesh(36, 30);

/* ══════════════════════════════════════════════════════════════════════════
   ROUND 9 — THE FLOOR THE PART MOVES ACROSS
   ══════════════════════════════════════════════════════════════════════════
   Five objects, and each one exists because a verdict has to LAND somewhere.
   A part cannot be "shipped" into a variable: it has to go and stand next to
   the roll-up door where the driver can pick it up. It cannot be "scrapped"
   into a message: it has to be in a bin. There has to be a place the casting
   came from, or "another blank" is a number rather than a walk.

   THE ONE DESIGN RULE, and it is deliberate. These objects carry PRESENCE
   and COUNT. They do not carry SIZE. A rack that rendered each finished bore
   to its true diameter, or a bin whose part visibly measured 0.02 mm small,
   would hand the player the one number this game exists to withhold (§R1
   truth-leak gate: the true bore is never rendered, before or after). A
   machinist cannot see a 4 µm difference across a shop floor either — they
   read it on a gauge, and the gauge is in your hand. So a part on the rack
   looks like a part on the rack, and only the gauge says whether it fits.
   ══════════════════════════════════════════════════════════════════════════ */

/* The colour of finished metal, and the colour of a part nobody wants. */
const M_PART_GOOD = new THREE.MeshStandardMaterial({ color: 0x8f979f, roughness: 0.42, metalness: 0.82 });
const M_PART_DEAD = new THREE.MeshStandardMaterial({ color: 0x6d6357, roughness: 0.78, metalness: 0.55 });
const M_CRATE     = new THREE.MeshStandardMaterial({ color: 0x6b5637, roughness: 0.98, metalness: 0 });

/** One casting, as an object you could pick up. Presence only — see above. */
function partObject(parent, x, y, z, dead = false) {
  const g = new THREE.Group(); g.position.set(x, y, z); parent.add(g);
  /* A Ø124 × 30 housing: a squat ring with a bore through it. The bore is
     rendered, because a hole is what a bearing housing IS — its DIAMETER is
     not, because that is the measurement, and the measurement is yours. */
  const rO = 0.062, rI = 0.020;
  const shape = new THREE.Shape(); shape.absarc(0, 0, rO, 0, Math.PI * 2, false);
  const hole = new THREE.Path(); hole.absarc(0, 0, rI, 0, Math.PI * 2, true); shape.holes.push(hole);
  const geo = new THREE.ExtrudeGeometry(shape, { depth: 0.030, bevelEnabled: false, curveSegments: 24 });
  geo.rotateX(-Math.PI / 2); geo.translate(0, 0.030, 0);
  const m = new THREE.Mesh(geo, dead ? M_PART_DEAD : M_PART_GOOD);
  m.castShadow = m.receiveShadow = true; g.add(m);
  return g;
}

/* ══ THE JOB BOARD — where the next morning's work is pinned ══════════════
   L2. Until now `JOBS` held two fully-specified jobs and the player could only
   ever play the first one; the second was reachable from a test hook and from
   nowhere else. A shop's work does not arrive on the machine — it arrives on a
   BOARD, and a machinist walks over and reads it. So the board is an object
   like everything else here: it is by the roll-up door on the way in, it has
   the week's cards pinned to it, and you read it by looking at it.

   Nothing on a card is a number this page invented. Client, bore, tolerance
   grade, band width, the rate and the van's slot all come off the job spec in
   `game.mjs`, which is the same object the kernel is handed. A card cannot say
   the job is easier than the job is. */
const JOBBOARD = new THREE.Group();

const BOARD_CARDS = [];
/* LAID OUT FOR ANY NUMBER OF JOBS. The first version placed cards at
   `-0.52 + i * 1.04`, which was correct for exactly two and ran off the edge of
   the board at four. A board that only fits the jobs that happened to exist
   when it was built is a board that will silently lose work, so the grid is
   computed from the count. */
function buildBoardCards() {
  for (const c of BOARD_CARDS.splice(0)) JOBBOARD.remove(c.group);
  const n = G.JOBS.length;
  const cols = n <= 3 ? n : Math.ceil(n / 2);
  const rows = Math.ceil(n / cols);
  const BW = 2.02, BH = 1.30, gx = 0.06, gy = 0.05;
  const cw = (BW - gx * (cols - 1)) / cols;
  const ch = (BH - gy * (rows - 1)) / rows;
  G.JOBS.forEach((j, i) => {
    const col = i % cols, row = Math.floor(i / cols);
    const g = new THREE.Group();
    g.position.set(-BW / 2 + cw / 2 + col * (cw + gx),
                   1.62 + BH / 2 - ch / 2 - row * (ch + gy), 0.10);
    g.rotation.z = ((i % 2) ? -1 : 1) * 0.012;
    JOBBOARD.add(g);
    box(cw, ch, 0.012, M.paper, 0, 0, 0, g);
    const band = box(cw, ch * 0.14, 0.014, M.warn, 0, ch * 0.42, 0.003, g);
    const lines = Math.max(3, Math.floor(ch * 9));
    for (let k = 0; k < lines; k++) {
      box(cw * 0.78, 0.011, 0.015, M.ink, -cw * 0.04, ch * 0.27 - k * (ch * 0.11), 0.003, g);
    }
    const pin = cyl(0.016, 0.016, 0.02, M.brass, 10);
    pin.rotation.x = Math.PI / 2; pin.position.set(0, ch * 0.47, 0.012); g.add(pin);
    BOARD_CARDS.push({ job: j, group: g, band });
  });
}
buildBoardCards();
/** The board reads the same state the machine does: the card for the job you
 *  are set up on is flagged, the rest are offers — and a card a client has
 *  taken off the wall is dark, because that is what happened. */
function syncBoard() {
  if (!GAME) return;
  BOARD_CARDS.forEach(({ job, band }) => {
    const mine = GAME.job.id === job.id;
    const state = SHOP ? offersFor(SHOP, [job])[0] : { offered: true };
    band.material = mine ? M.warn : state.offered ? M.ink : M.slot;
    band.visible = state.offered || mine;
  });
}

/* ── THE REST OF THE SHOP — inhabited (§49), and not all of it about you ──
   THREE OF THESE EXIST because the arrival text has promised "three spindles
   already running" since it was written and the floor had two. A shop is three
   spindles you did not start; the sentence was right and the floor was short.

   WHAT MAKES A BOX READ AS A MACHINE TOOL. The first version was a grey cuboid
   with a flat window in it, which is a shipping container. A vertical machining
   centre is recognisable from its SILHOUETTE long before its detail: a tall
   back that houses the column, a lower front with the door in it, a control box
   hanging off one side, and a chip conveyor crawling out of the base on the
   other. Get those four and it reads at a glance from across the shop, which is
   the only distance that matters for the other three. */
function vmcDressing(g, { w = 2.4, d = 2.0, front = 1.0 } = {}) {
  /* (a) leveling feet. Machines are never flat on the slab. */
  for (const fx of [-w / 2 + 0.28, w / 2 - 0.28]) {
    for (const fz of [-d / 2 + 0.28, d / 2 - 0.28]) {
      const foot = cyl(0.075, 0.10, 0.14, M.steel, 12);
      foot.position.set(fx, 0.07, fz); g.add(foot);
    }
  }
  /* (b) the chip conveyor, crawling out of the base to one side — the single
     most machine-tool-shaped object in the building. */
  const conv = box(0.62, 0.46, 1.5, M.dark, -w / 2 - 0.22, 0.68, -0.1, g);
  conv.rotation.z = 0.30;
  box(0.56, 0.30, 0.5, M.dark, -w / 2 - 0.52, 0.98, 0.45, g);
  const chipPile = new THREE.Mesh(new THREE.ConeGeometry(0.30, 0.16, 12), M.chip);
  chipPile.position.set(-w / 2 - 0.52, 1.16, 0.45); g.add(chipPile);
  /* (c) the control box on an arm, on the other side, angled toward whoever is
     standing at the door — which is where a pendant always is. */
  const cb = new THREE.Group(); cb.position.set(w / 2 + 0.30, 1.55, front * 0.55);
  cb.rotation.y = -0.34; g.add(cb);
  box(0.10, 0.10, 0.10, M.dark, -0.14, 0.0, 0, cb);          // arm joint
  box(0.06, 0.06, 0.34, M.dark, -0.24, 0.0, -0.16, cb);      // arm
  box(0.46, 0.60, 0.16, M.dark, 0, 0, 0, cb);                // the box
  box(0.34, 0.24, 0.02, new THREE.MeshStandardMaterial({ color: 0x1b3a2a, emissive: 0x2f7a4a, emissiveIntensity: 0.55 }),
      0, 0.13, 0.09, cb);
  for (let k = 0; k < 6; k++) {
    box(0.055, 0.035, 0.02, k === 2 ? M.warn : M.slot, -0.11 + (k % 3) * 0.11, -0.10 - Math.floor(k / 3) * 0.08, 0.09, cb);
  }
  /* (d) the door, framed, with a real gasket line and a handle — and the
     nameplate and warning sticker that every machine in every shop carries. */
  box(w * 0.98, 0.07, 0.07, M.dark, 0, 2.42, front + 0.02, g);
  box(w * 0.98, 0.07, 0.07, M.dark, 0, 0.90, front + 0.02, g);
  box(0.07, 1.55, 0.07, M.dark, -w * 0.46, 1.66, front + 0.02, g);
  box(0.07, 1.55, 0.07, M.dark,  w * 0.46, 1.66, front + 0.02, g);
  box(0.52, 0.045, 0.045, M.steel, w * 0.30, 1.12, front + 0.06, g);
  box(0.34, 0.10, 0.02, M.bright, -w * 0.22, 2.60, front + 0.06, g);   // nameplate
  box(0.16, 0.20, 0.02, M.warn,   w * 0.30, 1.08, front + 0.06, g);    // warning
  return g;
}

/* (4) PALLET RACKING along the far wall. The strongest silhouette in any
   warehouse, and cheap: uprights and beams. */
function racking(x, z, ry, bays) {
  const g = new THREE.Group(); g.position.set(x, 0, z); g.rotation.y = ry; scene.add(g);
  const W = 2.7, H = 4.2, D = 1.1;
  for (let b = 0; b <= bays; b++) {
    const bx = (b - bays / 2) * W;
    for (const dz of [-D / 2, D / 2]) {
      box(0.10, H, 0.10, M.rust, bx, H / 2, dz, g);
      box(0.10, H, 0.10, M.rust, bx + 0.14, H / 2, dz, g);   // the twin upright
    }
  }
  for (const lvl of [1.15, 2.55, 3.75]) {
    box(W * bays, 0.12, 0.09, M.rust, 0, lvl, -D / 2, g);
    box(W * bays, 0.12, 0.09, M.rust, 0, lvl, D / 2, g);
    for (let b = 0; b < bays; b++) {
      box(W * 0.92, 0.04, D * 0.86, M.steel, (b - bays / 2 + 0.5) * W, lvl + 0.08, 0, g);
    }
  }
  return g;
}

}

/* ══ THE CHIP TRAY — §73's bottom rung, made readable ═════════════════════
   The ladder in the brief runs Planet → ... → Machine → Fixture → Part →

  c.position.set((Math.random() - 0.5) * 1.05, 0.045 + Math.random() * 0.02,
                 (Math.random() - 0.5) * 0.52);

/** THE LAST CHIP, as the tray would show it. Kept as a fact about the pass
 *  rather than as a mesh, because the thing that matters about a chip is its
 *  thickness and its colour and neither of those is geometry. */
let LAST_CHIP = null;

const NEW_CHIPS = [];
/* ONE shared material, deliberately.
 *
 * A chip is a 10-triangle tetrahedron: the right answer is a bright diffuse
 * surface, not a polished one. The old material was metalness 0.9, and a metal
 * has almost no diffuse response — it shows you only what it reflects, so a
 * chip sitting in a dark cavity renders as a black speck and the HUD ends up
 * describing a chip the player cannot see. This is that fix.
 *
 * Shared (and therefore never disposed) because a per-chip material would be
 * disposed on eviction while other chips still referenced it. */
const CHIP_MAT = new THREE.MeshStandardMaterial({ color: 0xc8ccd0, roughness: 0.55, metalness: 0.12 });
const CHIP_GEO = new THREE.TetrahedronGeometry(1.0);
function chipsFromPass(rec, material) {
  const info = W.chipFromPass(rec, material);
  /* THE TRAY AGREES WITH THE SPRAY. Both take their colour from the same
     `chipFromPass` return, so there is no way for the chips on the floor and
     the chips you can read to describe two different cuts. */
  if (info && info.colour_hex) {
    try { CHIP_MAT.color.set(info.colour_hex); } catch (e) {}
    try { M.chip.color.set(info.colour_hex); } catch (e) {}
  }
  LAST_CHIP = info;
  /* Emitted at the TOOL NOSE, in the cell's own space.
   *
   * The old emitter did `scene.add` at a hand-picked WORLD position of
   * (x, 1.28, z 0.35). `cell` is the group that actually holds the machine
   * (cell.position.z = -7), so those world coordinates are ~7 units outside
   * the enclosure: every chip in the shop sprayed onto the floor 9 units wide,
   * none of them at the cut, and none of them inside the cell where the one
   * worklight is. Parented to `spindleGroup`, the chips land in cell space like
   * the part, the vise and the tool do — measured at the bar nose, local
   * y = -0.64, which is the bottom of `barMesh`. */
  for (let i = 0; i < 10; i++) {
    const c = new THREE.Mesh(CHIP_GEO, CHIP_MAT);
    const s = 0.008 + Math.random() * 0.01;
    c.scale.setScalar(s);
    c.position.set((Math.random() - 0.5) * 0.06, -0.64 - Math.random() * 0.04,
                   0.25 + (Math.random() - 0.5) * 0.06);
    /* Thrown DOWN and out, under the tool — the old velocity launched them
       upward at 0.7+, which is why the spray spread across the shop instead of
       falling past the vise.
     *
     * These are SCALED units: the bore is 18 mm across and appears here as
     * 0.036 units, so a "metre" is ~2 units. Velocities are scaled to match,
     * and `stepChips` applies gravity in the same units -- mixing a raw metric
     * constant into a scaled world is what made a correctly-placed chip
     * invisible. */
    c.userData.v = new THREE.Vector3((Math.random() - .5) * 0.30,
                                     -(0.06 + Math.random() * 0.10),
                                     (Math.random() - .5) * 0.30);
    c.userData.spin = 2.0 + Math.random() * 3.0;
    spindleGroup.add(c); NEW_CHIPS.push(c);
  }
  return info;
}
function stepChips(dt) {
  for (let i = NEW_CHIPS.length - 1; i >= 0; i--) {
    const c = NEW_CHIPS[i];
    /* Gravity, in the units this world is actually authored in: the bore is
       18 mm across and draws as 0.036 units, so a metre is ~2 units and one
       metric 9.8 m/s^2 is 3.9 units/s^2. The old code applied a raw 9.8 here,
       which is 24.5 m/s^2 -- two and a half times real gravity. Measured: ten
       correctly-placed chips crossed from the tool nose to the enclosure floor
       inside a single frame, so a correct emitter still showed the player
       nothing. 3.9 gives the fall ~0.64 s, which is when a chip is actually
       visible leaving the cut. */
    c.userData.v.y -= 3.9 * dt;
    c.position.addScaledVector(c.userData.v, dt);
    c.rotation.x += dt * (c.userData.spin || 5);
    c.rotation.z += dt * (c.userData.spin || 4) * 0.8;
    /* THE FLOOR TEST HAS TO BE IN ONE FRAME OF REFERENCE.
     *
     * `c.position` is SPINDLE-LOCAL: the emitter puts the nose at local y
     * -0.64, and the spindle group sits at cell-local y 2.52, so the nose is
     * cell-local 1.88. Comparing a spindle-local y against the cell-local floor
     * (1.06) says "-0.67 < 1.06" — TRUE — so every chip was slammed onto the
     * floor on the frame it spawned. Measured: 720 clamp hits, all at y around
     * -0.67, while the HUD described a chip that never drew a single visible
     * frame. Convert once, then compare. */
    const worldFloor = 1.06;                       // cell-local floor height
    const spindleY = spindleGroup.position.y;      // cell-local y of the parent
    if (spindleY + c.position.y <= worldFloor) {
      c.userData.v.set(0, 0, 0);
      c.position.y = worldFloor - spindleY;
    }
  }
  if (NEW_CHIPS.length > 260) {
    const c = NEW_CHIPS.shift();
    /* `scene.remove(c)` is a NO-OP on a child of a child, and it fails SILENTLY
       — the mesh stays in the scene, so chips would accumulate at 10 per pass
       forever while NEW_CHIPS still reported its 260 cap honoured. A list lying
       about its own contents. Removing from the real parent is the only thing
       that works, and it must ship with the parenting change above or not at
       all. Disposes the geometry only: CHIP_MAT is shared and still in use. */
    c.removeFromParent();
    c.geometry.dispose();
  }
}

let AUD = null;

/* ── THE BRIDGE FROM KERNEL RECORD → ACOUSTICS ────────────────────────────
   These are DIFFERENT VOCABULARIES and joining them is exactly where a page
   can lie about the physics. world.cutAcoustics reads `step.n` (CONSTANT
   rpm), `step.power_frac` (0..1 of rated) and `step.b_radial_mm`; the kernel
   history record carries `n_rpm`, `power_kW` and `bite_effective_um`. Passing
   the raw record is silent (n is the PASS NUMBER) — measured, not guessed.
   One adapter, one place, and it reads only real record fields. */
function acousticsFrom(rec, g, { rubbing = false, verdict } = {}) {
  if (!rec) return W.idleAcoustics(g.mach, { rpmFrac: 0, spindle_on: g.machine.spindle_on });

    n: rec.n_rpm,
    power_frac: rec.power_kW / g.mach.power_max_kW,
    b_radial_mm: (rec.bite_effective_um ?? rec.bite_realised_um ?? 0) / 1000,
    F_peak_N: rec.force_N,
  }, { z: g.tool?.z ?? 1, rubbing, verdict: verdict ?? rec.verdict });
}

function toast(html, ms = 4200) {
  const d = document.createElement('div'); d.innerHTML = html; $('ev').appendChild(d);
  if (REC) REC.hint({ kind: 'toast', who: null, text: html, is_question: false });

}
/* ── HANDING THE SESSION OVER ────────────────────────────────────────────────
 * Everything a playtest run produces is in this browser's localStorage, and the
 * only person who can get it out is the player. So this is deliberately a
 * one-click affordance that says what it is, not a hidden key binding: a tester
 * who has to be told a shortcut will not use it, and a session that is never
 * exported is a session that was never run. */
let exportOffered = false;
/* One place that saves, reports, and RECORDS that it saved. Two callers (the
   link and the S key) must not mean two log lines for one file. */
function saveSession(via) {
  if (!REC || !RECmod.downloadLocal) return { ok: false, why: 'not recording' };
  /* Record FIRST, before the file is built. The .jsonl is assembled by reading
     localStorage, so anything logged after that read is absent from the file it
     describes — and the row count the file reports would describe the state
     before its own export. Measured: `export_session` said rows: 28 while the
     file it had just written ended at seq 44. That is a session export that
     systematically under-reports itself, this project's signature failure in
     miniature, so the fix is order, not a bigger number. */
  REC.action('export_session', { via, clock_min: GAME ? GAME.clock_min : null });
  if (RECmod.flushLocal) RECmod.flushLocal();
  const r = RECmod.downloadLocal();
  const el = document.querySelector('.getrec .dl');
  if (el) el.textContent = r.ok ? `Saved ${r.filename} (${r.rows} events)` : `Could not save: ${r.why}`;
  return r;
}
function offerSessionDownload() {
  if (!REC || exportOffered) return;
  /* Flush first. The recorder's heartbeat is 4 s and this can run sooner, so
     without this a player who ships quickly reads rows:0 below and is offered
     nothing — the exit would vanish for the fastest player. */
  const st = RECmod.flushLocal ? RECmod.flushLocal() : (RECmod.localStats ? RECmod.localStats() : null);
  if (!st || !st.rows) return;
  exportOffered = true;
  const d = document.createElement('div');
  d.className = 'getrec';
  /* The link is a convenience for a released pointer; the key is the one that
     works inside the game. Both are stated, because a tester who is told only
     about the link will press it and nothing will happen. */
  d.innerHTML = `<b>Your session is in this browser.</b> ` +
    `${st.rows} events so far.` +
    (st.dropped ? ` <span style="color:#e0a030">${st.dropped} dropped (storage full).</span>` : '') +
    ` <span class="dl">Save it as a file</span> <span class="hint">or press <kbd>S</kbd></span>`;
  d.querySelector('.dl').onclick = () => saveSession('click');
  $('ev').appendChild(d);
}
let talkTimer = null;

  if (options) for (const [label, fn] of options) {
    const b = document.createElement('div'); b.className = 'opt'; b.textContent = label;
    b.onclick = () => { t.innerHTML = ''; if (REC) REC.choice(label, { who }); fn(); }; t.appendChild(b);
  }
  if (REC) REC.hint({ kind: 'say', who, text, is_question: !!options,
                      options: options ? options.map((o) => o[0]) : null });
  clearTimeout(talkTimer);
  if (!options) talkTimer = setTimeout(() => { t.innerHTML = ''; }, 5400);
}

  const d = document.createElement('div'); d.innerHTML = html;
  const L = $('log'); L.prepend(d); L.children[0].classList.add('new');
  if (REC) REC.hint({ kind: 'log', who: null, text: html, is_question: false });

}

   L2. The card for the job you are set up on is flagged; the others are
   offers. Every figure on the board is read from the job spec the kernel is
   handed, so a card cannot describe a job as easier than it is. */
add(JOBBOARD, "Job board — the week's work", 'read it', () => {
  const offers = offersFor(SHOP, G.JOBS);
  const lines = offers.map((o) => {
    const j = o.job;
    const mine = j.id === GAME.job.id;
    const band = ((j.band_high_mm - j.band_low_mm) * 1000).toFixed(0);
    const head = `${mine ? '<b>' : ''}${j.id} · ${j.client}${mine ? '</b> <i>— on your machine</i>' : ''}`;
    const spec = `Ø${j.nominal_mm} ${j.grade}, band ${band} µm · ` +
      `${j.start_hole_dia_mm} mm as-cast, ${j.bore_depth_mm} deep · van ${W.hhmm(G.departsMin(j))}`;
    /* A card a client has NOT put up is still printed, and says why. A job that
       silently vanishes from the wall is a job the player cannot learn from. */
    if (!o.offered) {
      return `<span style="color:#8b98a6">${head}<br>${spec}<br>` +
        `<b style="color:var(--bad)">${o.reason}</b></span>`;
    }
    return `${head}<br>${spec} · <b>${money(o.rate)}</b> <i>${o.reason}</i>`;
  });

  /* ── THEIR LAST WORD ─────────────────────────────────────────────────────
     What the customer measured, set against what you told them it was. This is
     the only place in the game where the two numbers sit on the same line, and
     it is the sentence the whole build exists to produce. */
  const last = SHOP.shipper.length ? SHOP.shipper[SHOP.shipper.length - 1] : null;
  const letter = last
    ? `<i>${last.client}'s last word — ${last.report} ` +
      `Standing ${last.standing_before} → <b>${last.standing_after}</b>.</i><br><br>`
    : '';
  const worth = averageClaimError_um(SHOP);
  const books = `<br><br><i>Banked <b>${money(SHOP.cash)}</b> · day ${SHOP.day} · ` +
    `overhead ${money(260)} a morning` +
    (worth === null ? ' · nothing measured yet' : ` · your word is good to ${worth.toFixed(1)} µm`) + '.</i>';

  const opts = offers
    .filter((o) => o.offered && o.job.id !== GAME.job.id)
    .map((o) => [`Take ${o.job.id} — ${o.job.client}, Ø${o.job.nominal_mm} ${o.job.grade}, ` +
                 `band ${((o.job.band_high_mm - o.job.band_low_mm) * 1000).toFixed(0)} µm at ${money(o.rate)}`,
                 () => takeJob(o.job.id)]);
  say('Board', letter + lines.join('<br><br>') + books, opts.length ? opts : undefined);
  logLine(`Board: <b>${offers.filter((o) => o.offered).length}</b> of ${offers.length} on offer. ` +
    `Banked <b>${money(SHOP.cash)}</b>.` +
    (opts.length ? '' : ' <b>Nothing here is yours to take.</b>'));
}, () => true);

/* ── THE PENDANT'S VERB ──────────────────────────────────────────────────
   Aim at a key, press E. Every one of these is the same function the keyboard
   shortcut calls, so a player who drives the machine off the pendant and a
   player who knows Shift+1-6 are operating the identical machine. The keys are
   not removed — a machinist who knows them should not be slowed down — they are
   simply no longer the only way, and no longer printed on the screen. */
function stepIn(arr, cur, dir) {
  const i = arr.indexOf(cur);
  if (i < 0) return arr[0];
  return arr[Math.max(0, Math.min(arr.length - 1, i + dir))];
}
function pressKey(id) {
  switch (id) {
    case 'dial_down':
    case 'dial_up': {
      const up = id === 'dial_up';
      const v = stepIn(DIALS, biteCmd_um, up ? 1 : -1);
      if (v === biteCmd_um) { toast(`Dial is already at its ${up ? 'deepest' : 'finest'}: <b>${v} µm</b>.`, 1800); return; }
      biteCmd_um = v;
      if (REC) REC.action('set_dial', { dial_um: v, key: 'pendant', clock_min: GAME ? GAME.clock_min : null });
      toast(`Dial set to <b>${v} µm</b> on the radius.`, 1800);
      return;
    }
    case 'pred_down':
    case 'pred_up': {
      const cur = predicted_um === null ? PREDICTIONS[0] : predicted_um;
      setPrediction(stepIn(PREDICTIONS, cur, id === 'pred_up' ? 1 : -1));
      return;
    }
    case 'feed_down': stepRoughFeed(-1); return;
    case 'feed_up':   stepRoughFeed(1);  return;
    case 'spd_down':
    case 'spd_up': {
      const up = id === 'spd_up';
      const v = stepIn(G.SPEEDS.steps, GAME.machine.vc_m_min, up ? 1 : -1);
      if (v === GAME.machine.vc_m_min) {
        toast(`Spindle is already at its ${up ? 'fastest' : 'slowest'}: <b>${v} m/min</b>.`, 1800);
        return;
      }
      GAME.machine.vc_m_min = v;
      refreshLoadMeter();
      if (REC) REC.action('set_speed', { vc_m_min: v, clock_min: GAME.clock_min });
      toast(`<b>${v} m/min</b> at the edge — ${G.SPEEDS.note(v)}.`, 2600);
      logLine(`Spindle set to <b>${v} m/min</b>. ${G.SPEEDS.note(v)}.`);
      return;
    }
    case 'bite_down': stepRoughBite(-1); return;
    case 'bite_up':   stepRoughBite(1);  return;
    case 'book':      readBook();  return;
    case 'maint':     callMaint(); return;
    case 'touch':     doTouchOff(); return;
    case 'warm':      doWarmUp();   return;
    case 'rough':     doRough();    return;
    case 'cut':       doCut();      return;
    case 'measure':   doMeasure();  return;
    case 'inspect':   doInspect();  return;
    default: return;
  }
}
add(pendPad, 'Machine control — pendant', 'press a key', () => {
  if (!pendHover) { say('You', 'A membrane keypad. Point at a key and press E.'); return; }
  if (REC) REC.action('pendant_key', { key: pendHover.id, label: pendHover.label,
    clock_min: GAME ? GAME.clock_min : null });
  pressKey(pendHover.id);
}, () => eye.distanceTo(MACHINE_NEAR) < 4.2);

/* ── THE CHIP'S VERB — the bottom rung ────────────────────────────────────
   A chip is the physical evidence of the cut and a machinist reads it before
   they read anything else: its colour says how hot the cut ran, its thickness
   says what the bar actually took, and both of those are already computed by
   `W.chipFromPass` from the real cutting energy and the real bite. Nothing
   here asserts a number the kernel did not produce.

   AND IT CARRIES THE LESSON WITHOUT STATING IT. The chip is thicker than the
   dial said — every time, because that is what the surplus IS — and the read
   puts those two numbers on one line and stops. */
add(CHIP_TRAY, 'Chip tray — what came off the last pass', 'look in it', () => {
  if (!LAST_CHIP) {
    say('You', 'Turnings from somebody else\u2019s shift. Blue and straw, mostly — ' +
      'whatever ran in here before you got to it. Nothing of yours in the tray yet.');
    return;
  }
  const c = LAST_CHIP;
  const surplus = c.surplus_um;
  /* WHAT A CHIP CAN HONESTLY TELL YOU, and every figure here is exact: its
     WIDTH is the bite the bar actually took, which is where the surplus lives;
     its THICKNESS is the feed times the chip-thickening ratio, the dimension
     that decides whether it breaks; its MASS is the annulus it came out of.
     NO TEMPERATURE AND NO DIAGNOSIS — see the note on CHIP_HEAT in world.mjs
     for why this build does not quote one. A number you cannot defend is the
     one thing a machinist will not forgive, and the brief fails the whole build
     for a single one of them. */
  say('Chip tray',
    `<b>${c.colour_name}</b> chip · <b>${c.t2_um.toFixed(0)} µm</b> thick · ` +
    `<b>${c.width_um.toFixed(0)} µm</b> wide · ${c.mass_g.toFixed(1)} g<br>` +
    `the dial said <b>${c.bite_cmd_um.toFixed(0)} µm</b> and the bar took ` +
    `<b>${c.bite_realised_um.toFixed(1)} µm</b>` +
    (Math.abs(surplus) >= 0.05
      ? surplus > 0
        ? ` — <b>+${surplus.toFixed(1)} µm</b> wider than you asked for`
        : ` — <b>${Math.abs(surplus).toFixed(1)} µm</b> short of what you asked for`
      : '') +
    `<br><br>` +
    (c.breaks
      ? `<i>It broke up rather than stringing. That is the feed being right for the material.</i>`
      : `<i>It came off in a string rather than breaking up. That is the feed, not the bar.</i>`) +
    `<br><i>${c.mass_g.toFixed(1)} g of ${GAME.mat.label} that is now swarf.</i>`);
  logLine(`Chip: <b>${c.colour_name}</b>, <b>${c.t2_um.toFixed(0)} µm</b> thick, ` +
    `<b>${c.width_um.toFixed(0)} µm</b> wide (` +
    (surplus >= 0 ? `+${surplus.toFixed(1)}` : `${Math.abs(surplus).toFixed(1)} short of`) +
    ` the dial), ${c.mass_g.toFixed(1)} g.`);
  if (REC) REC.action('read_chip', { colour: c.colour_name,
    t2_um: c.t2_um, width_um: c.width_um, mass_g: c.mass_g,
    surplus_um: surplus, breaks: c.breaks });
}, () => true);

/* ══ ASKING THE SYSTEM ════════════════════════════════════════════════════
   Walk to the console, press E, and it tells you what it makes of the bore at
   the dial you have set. Then the books close on it when metal comes off.

   WHAT IT WILL NOT DO is tell you what to think of its own answer. It reports
   both conditions on the same screen — the one it surveyed, and the one the
   machine is at — and says nothing about the gap. The player who compares those
   two lines is the player who stops scraping castings on a worn machine. */
/** The customer's letters, and the only place in this build where the number
 *  you read off a gauge and the number their CMM produced share a line. */
/* THE SHOP KEYS ITS BOOK BY ID AND THE LETTERHEAD IS A NAME. `client_id` is an
   identity and `client` is what goes on paper; the first version printed the id,
   so a letter arrived from "halvorsen". A display name is not an identity and an
   identity is not a display name — which is why the job spec carries both. */
const clientName = (id) => (G.JOBS.find((j) => j.client_id === id) || {}).client || id;

function readPost() {
  const post = unreported(SHOP);
  const parts = post.map((p) => {
    const L = letterFor(SHOP, p);
    const rows = L.lines.map((l) =>
      `<b>${l.job}</b> · ${l.what}<br><span style="color:#8b98a6">${l.said}</span><br>` +
      `${l.verdict} <b>${money(l.money)}</b>` +
      (l.out_by === null ? '' :
        `<br><i>${l.agreed ? 'It agrees with what you said.'
          : `It is ${Math.abs(l.out_by).toFixed(1)} µm from what you said.`}</i>`)).join('<br><br>');
    const worth = L.worth === null ? '' :
      ` <span style="color:#8b98a6">· your word with them holds to ${L.worth.toFixed(1)} µm</span>`;
    return `<b>${String(clientName(L.client)).toUpperCase()}</b> — incoming inspection<br>` +
      `<span style="color:#8b98a6">standing ${L.standing}</span>${worth}<br><br>${rows}`;
  });
  say('SYSTEM — post', parts.join('<br><br>———<br><br>'),
    [['Read. Put it on the board.', () => {
      let n = 0;
      for (const p of post) n += markReported(SHOP, p.client, SHOP.day);
      logLine(`Read the post — <b>${n}</b> part${n === 1 ? '' : 's'} reported back. ` +
        post.map((p) => `${clientName(p.client)} standing <b>${SHOP.book[p.client].standing}</b>`).join(' · ') + '.');
      toast(`Post read. ${post.map((p) => `${clientName(p.client).split(' ')[0]} ${SHOP.book[p.client].standing}`).join(' · ')}`, 6000);
      paintTerminal([
        { k: 'post', v: 'read' },
        { k: 'machine', v: GAME.machine.condition.toFixed(0) },
        'ask me about the bore when you want.',
      ], 'READY');
    }]]);
  paintTerminal([
    { k: 'letters', v: String(post.length) },
    { k: 'parts', v: String(post.reduce((a, p) => a + p.entries.length, 0)) },
    'on screen.',
  ], 'POST');
}

add(TERMINAL, 'Shop system — console', 'read it', () => {
  if (!GAME) return;
  /* THE POST COMES FIRST. A shop's morning starts with what came back, not
     with what you were about to do, and burying the letters under a forecast
     would be the interface deciding the player does not need to know. */
  if (unreported(SHOP).length) { readPost(); return; }
  const rec = G.systemRecord(GAME);
  const surveyed = GAME.system.surveyed_condition;
  const now = GAME.machine.condition;
  const drift = now - surveyed;
  const lines = [];
  lines.push(`surveyed at <b>${W.hhmm(GAME.system.surveyed_at_min)}</b> — condition ` +
    `<b>${surveyed.toFixed(0)}</b>, TIR ${G.runout_um_for(surveyed).toFixed(1)} µm`);
  lines.push(`machine now — condition <b>${now.toFixed(0)}</b>, ` +
    `TIR ${G.runout_um_for(now).toFixed(1)} µm` +
    (Math.abs(drift) < 1 ? '' : ` <b>(${drift < 0 ? '' : '+'}${drift.toFixed(0)} since I looked)</b>`));

  let body = lines.join('<br>');
  const opts = [];

  if (!GAME.tool) {
    body += `<br><br>Nothing in the spindle, so there is nothing to forecast. ` +
      `Put a bar in and ask me again.`;
  } else {
    const f = G.forecastPass(GAME, { bite_mm: biteCmd_um / 1000, feed_mm_rev: roughFeed_mm_rev });
    if (!f) body += `<br><br>I cannot model that.`;
    else if (f.refused) body += `<br><br>At <b>${biteCmd_um} µm</b> the machine will refuse it ` +
      `(${String(f.why).replace(/_/g, ' ').toLowerCase()}). If you take that cut you will get a ` +
      `refusal, not a part.`;
    else {
      G.claimPass(GAME, f.coldDia_mm, { dial_um: biteCmd_um });
      body += `<br><br>At <b>${biteCmd_um} µm</b> on the dial, I make that ` +
        `<b>Ø${f.coldDia_mm.toFixed(4)} mm</b> cold.`;
      body += `<br><br><i>I will be told whether I was right when you cut it.</i>`;
    }
  }

  /* THE RECORD, kept by the shop and not by the system. Written as a fact about
     the calls it has made — mean and worst, absolute micrometres — and never as
     a rating, because the number a supplier's own scoreboard carries is worth
     nothing to the person who has to decide whether to believe it. */
  body += `<br><br>` + (rec.n === 0
    ? `<i>No calls settled yet.</i>`
    : `<i>Of the last <b>${rec.n}</b> calls I have made: mean <b>${rec.mean_abs_um.toFixed(1)} µm</b> ` +
      `out, worst <b>${rec.worst_um.toFixed(1)} µm</b>, and ` +
      (rec.signed_um < -0.05
        ? `<b>optimistic</b> by ${Math.abs(rec.signed_um).toFixed(1)} µm on average.`
        : rec.signed_um > 0.05
          ? `<b>pessimistic</b> by ${rec.signed_um.toFixed(1)} µm on average.`
          : `balanced.`));

  opts.push(['Survey the machine now', () => {
    const r = G.SYSTEM.survey(GAME);
    paintTerminal([
      { k: 'condition', v: r.condition.toFixed(0) },
      { k: 'TIR', v: G.runout_um_for(r.condition).toFixed(1) + ' um', warn: G.runout_um_for(r.condition) > 7 },
      { k: 'claims', v: '0 kept' },
      'surveyed. ask me again.',
    ], 'READY');
    logLine(`System surveyed the machine: condition <b>${r.condition.toFixed(0)}</b>, ` +
      `TIR <b>${G.runout_um_for(r.condition).toFixed(1)} µm</b>. Its call record is reset with it.`);
    toast(`Surveyed. Condition ${r.condition.toFixed(0)} · ` +
      `TIR ${G.runout_um_for(r.condition).toFixed(1)} µm.<br>` +
      `Its previous calls were made about a different machine.`, 6000);
  }]);

  say('SYSTEM', body, opts);
  paintTerminal([
    { k: 'surveys', v: 'yes' },
    { k: 'machine', v: now.toFixed(0), warn: Math.abs(drift) > 60 },
    { k: rec.n ? 'calls' : 'calls', v: rec.n ? rec.n + ' settled' : 'none yet' },
    rec.n ? { k: 'worst call', v: rec.worst_um.toFixed(1) + ' um' } : 'waiting for a cut',
  ], rec.n ? 'READY' : 'NO RECORD');
  if (REC) REC.action('ask_system', { surveyed, actual: now, drift,
    dial_um: biteCmd_um, calls: rec.n,
    mean_abs_um: rec.mean_abs_um, signed_um: rec.signed_um });
}, () => true);

/* ══ THE BOOK, AND THE VISIT ═════════════════════════════════════════════
   Two verbs that only work because the shop is a business with a supplier and
   a machine that wears. */

/** Read the tooling supplier's cutting data for the bar in the spindle.
 *
 *  THE ASSUMPTION IS PRINTED WITH THE NUMBER, and that is the whole design.
 *  The recommendation is computed from this game's own kernel for a machine at
 *  condition 1000 and the bar at its catalogue stickout, so it is a real
 *  number that really runs — on that machine. Yours is at
 *  `GAME.machine.condition` and falling. A recommendation without its
 *  assumptions is an instruction; the moment you can compare the assumption
 *  against the machine in front of you it becomes advice. */
function readBook() {
  if (!GAME.tool) {
    say('Book', 'The sheet is indexed by bar. There is nothing in the spindle to look up.');
    return;
  }
  const b = G.bookCut(GAME.tool, GAME.materialKey, GAME.machineKey);
  if (!b) { say('Book', 'Nothing in the catalogue covers that combination.'); return; }
  const mine = G.runout_um_for(GAME.machine.condition);
  const theirs = G.runout_um_for(b.assumes.machineCondition);
  const agree = Math.abs(mine - theirs) < 0.6;
  const body =
    `<b>${b.bar}</b> in ${GAME.mat.label}<br>` +
    `Take <b>${b.bite_mm.toFixed(2)} mm</b> at <b>${b.feed_mm_rev.toFixed(2)} mm/rev</b>.<br><br>` +
    `<i>Recommended for ${b.assumes.note}: condition ` +
    `${b.assumes.machineCondition}, bar at ${(GAME.toolSpec.D * 2.5).toFixed(0)} mm out.</i><br>` +
    `<i>This machine is at condition ${GAME.machine.condition.toFixed(0)} — ` +
    `TIR ${mine.toFixed(1)} µm against the sheet's ${theirs.toFixed(1)}.</i>` +
    (agree ? '' : `<br><br><b>The sheet does not know what machine you are standing at.</b>`);
  const opts = [[`Set the dial to the book's numbers`,
    () => {
      biteCmd_um = Math.round(b.bite_mm * 1000);
      roughFeed_mm_rev = b.feed_mm_rev;
      roughBite_mm = b.bite_mm;
      refreshLoadMeter();
      logLine(`Set to the book: bite <b>${b.bite_mm.toFixed(2)} mm</b> ` +
        `(${biteCmd_um} µm on the dial) at <b>${b.feed_mm_rev.toFixed(2)} mm/rev</b>.`);
      /* The next thing the player should do is check it against the meter, so
         the game says so once and then never again. */
      if (!earlSaid.bookChecked) {
        earlSaid.bookChecked = true;
        setTimeout(() => say('Earl', "\u201cThe book's the book. It's never stood at " +
          "this machine. Look at the meter before you press anything.\u201d"), 1400);
      }
    }]];
  say('Tooling sheet', body, opts);
  if (REC) REC.action('read_book', { bar: b.barId, bite_mm: b.bite_mm, feed: b.feed_mm_rev,
    sheet_condition: b.assumes.machineCondition, machine_condition: GAME.machine.condition });
}

/** Book the machine in. The only thing that puts condition back, and it cannot
 *  be done with the spindle turning. It costs money the shop has to have. */
function callMaint() {
  const r = G.maintain(GAME, { cost: 340, minutes: 45 });
  if (!r.ok) {
    say('You', 'Not while it is turning. Stop the spindle first.');
    if (REC) REC.refusal('maint', r.why, { clock_min: GAME.clock_min });
    return;
  }
  if (SHOP) SHOP.cash -= r.cost;
  if (GAME.state_clock_floor > clocks.job_min + opMin) opMin = GAME.state_clock_floor - clocks.job_min;
  clockFloorMin = Math.max(clockFloorMin, GAME.state_clock_floor);
  GAME.clock_min = clocks.job_min + opMin;
  toast(`<b>Maintenance.</b> Condition ${r.before.toFixed(0)} → <b>${r.after.toFixed(0)}</b>. ` +
    `TIR now ${r.runout_um.toFixed(1)} µm.<br>${r.minutes} minutes and ${money(r.cost)}.`, 7000);
  logLine(`Service visit. Condition <b>${r.before.toFixed(0)} → ${r.after.toFixed(0)}</b>, ` +
    `runout <b>${r.runout_um.toFixed(1)} µm</b>. ${money(r.cost)} and ${r.minutes} minutes gone.`);
  if (REC) REC.action('maint', { before: r.before, after: r.after, cost: r.cost, minutes: r.minutes });
}

/* ── ROUND 9 VERBS — the floor the part moves across ──────────────────────
   Every one of these reads the PHYSICAL state and says what is there. None of
   them reports a diameter, a band position, or a "score": the rack is a rack,
   the bin is a bin, and the only instrument in the shop that measures a bore
   is the one in your hand. */

add(CRATE, 'Casting crate — Ø40 housings, as-cast', 'count them', () => {
  const n = GAME.stock_on_hand;
  const r = crateMeta();
  say('You', n > 0
    ? `${n} casting${n === 1 ? '' : 's'} in the crate. Ø${GAME.job.start_hole_dia_mm} as-cast bore, ` +
      `${GAME.job.bore_depth_mm} deep. Same drawing, same material.`
    : 'The crate is empty. Whatever happens now, it happens without another casting.');
  logLine(n > 0
    ? `Crate: <b>${n}</b> casting${n === 1 ? '' : 's'} left. Each one is ${GAME.job.start_hole_dia_mm} mm as-cast.`
    : 'The crate is <b>empty</b>.');
  if (n > 0 && !SEEN.crate) {
    SEEN.crate = true;
    setTimeout(() => say('Earl', `\u201cThat's the crate. ${W.hhmm(G.arrivalMin(GAME.job))} is the van. ` +
      `You get one casting in the machine at a time and there are ${n} in there. Do the arithmetic.\u201d`), 1200);
  }
}, () => true);

add(RACK, 'Finished-part rack — by the roll-up door', 'check it', () => {
  const rack = G.rackParts(GAME);
  const send = rack.filter((p) => p.disposition === 'SEND');
  const rework = rack.filter((p) => p.disposition === 'REWORK');
  say('You', rack.length === 0
    ? 'Empty. Four slots, nothing on them.'
    : rack.map((p) => `${p.id} — ${p.disposition === 'SEND'
        ? 'in spec, traveller signed, waiting for the van'
        : 'under the bottom of the band, flagged to finish at the customer'}`).join('<br>'));
  logLine(`Rack: <b>${rack.length}</b>/${GAME.rack_slots} slots — ` +
    (rack.length ? rack.map((p) => `${p.id} (${p.disposition})`).join(', ')
                 : 'empty') + '.');
  logLine(`Van books ${W.hhmm(G.arrivalMin(GAME.job))}–${W.hhmm(G.departsMin(GAME.job))}. ` +
    (GAME.courier.left
      ? (send.length || rework.length || GONE_SENT ? 'It has been and gone — with the part.'
                                  : 'It has been and gone — <b>with nothing</b>.')
      : `${W.hhmm(G.departsMin(GAME.job))} is when it stops mattering what you are about to do.`));
}, () => true);

add(SCRAPBIN, 'Scrap bin — rust, dents, dead parts', 'look in it', () => {
  const bin = G.binParts(GAME);
  say('You', bin.length === 0
    ? 'Empty, apart from the dents. Nothing of yours in there yet.'
    : bin.map((p) => `${p.id} — ${p.under_um ? p.under_um.toFixed(1) + ' µm under.' : 'dead.'}`).join('<br>'));
  logLine(bin.length === 0
