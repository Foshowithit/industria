<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="A playable digital twin of industrial civilization. You are a new hire at Halvorsen Pumps. Bore a bearing housing to H6 and hope it is right.">
<title>INDUSTRIA — your first shift at Halvorsen Pumps</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%2314181d'/><circle cx='16' cy='16' r='9' fill='none' stroke='%237d8b98' stroke-width='5'/></svg>">
<style>
  /* THE BACKDROP HAS TO BE DARKER THAN WHAT IS BEHIND IT, OR YOU READ THE
     WORLD THROUGH THE PRINTING. At .82 a cold viewer photographed the shop's own
     DIAL and SPINDLE signage showing through the machine panel, and the panel's
     numbers and the machine's numbers arrived on the same few pixels. .93 is
     still a panel you can see the shop through — the point is that the type on
     it wins. */
  :root{ --ink:#e8edf2; --dim:#8b98a6; --warn:#e8a33d; --bad:#e05a4e; --ok:#5fbf7a; --panel:rgba(10,14,18,.93); }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#0a0d11;color:var(--ink);
    font:14px/1.45 ui-monospace,"SF Mono",Menlo,Consolas,monospace}
  canvas{display:block}
  #vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 62%,rgba(0,0,0,.32) 100%)}

  /* ── diegetic HUD: no quest arrows, no floating clutter (§48) ───────────── */
  /* THE HUD HAS TO SURVIVE A LIT SCREEN BEHIND IT. A 3px drop shadow is enough
     over a wall and it is nothing over an emissive display: the pendant's own
     screen is the brightest thing in the room, it stands at the left of the
     frame on the walk in and at the right of the frame at the machine, and a
     cold viewer caught both ends of the same fault — the job title printed
     through the green STOPPED screen and read as "garbled and overstruck", and
     `GAUGE …` printed through the spindle line and read as "clipped off the
     screen edge" when nothing was clipped at all. Same fix in both places: the
     wide halo `#hint` already carries, because a caption over a bright surface
     is a solved problem and the answer is a dark cloud, not a bigger font. */
  .hud{position:fixed;pointer-events:none;text-shadow:0 1px 3px #000,0 0 11px rgba(0,0,0,.92)}
  #tl{top:14px;left:16px}
  #tl .job{font-size:15px;letter-spacing:.02em}
  #tl .cli{color:var(--dim);font-size:12px}
  #tl .clock{font-size:26px;letter-spacing:.04em;margin-top:6px}
  #tl .deadline{color:var(--dim);font-size:12px}
  #tl .deadline.late{color:var(--bad)}

  #tr{top:14px;right:16px;text-align:right;font-size:12px;color:var(--dim)}
  #tr b{color:var(--ink);font-weight:500}
  #tr .band{color:var(--ink)}
  /* the shop floor, as four counts. Never a verdict, never a diameter. */
  #tr .floor{margin-top:7px;padding-top:6px;border-top:1px solid #2a333d;
    font-size:11px;line-height:1.5;text-align:right}
  #tr .floor s{text-decoration:none;color:var(--dim)}
  #tr .floor b{font-weight:500}
  #tr .floor .vanout{color:var(--warn)}
  #tr .floor .vandone{color:var(--bad)}

  /* the hover label — the only thing that tells you a thing is a thing */
  #look{left:50%;top:calc(50% + 26px);transform:translateX(-50%);text-align:center;font-size:13px}
  #look .nm{background:var(--panel);border:1px solid #2a333d;padding:3px 9px;border-radius:2px}
  #look .act{color:var(--dim);font-size:11px;margin-top:3px}
  #look .verb{color:var(--warn)}

  /* machine panel: appears only when you are at the machine */
  /* TWO PANELS, ANCHORED TO OPPOSITE EDGES, BECAUSE ONE OF THEM OUTGREW THE
     SCREEN. The machine panel was anchored to the bottom and grew upward with
     nothing above it to stop it, and a cold viewer caught the result: "the
     panel does not fit any more" — its top printing type through the top-right
     status block, and its own header pushed off the top of the viewport once
     the error budget filled up. The budget now lives on the left (see #budget),
     the machine's own state hangs BELOW the status block from a fixed top edge,
     and the numbers you dial with sit at the bottom. Two columns from two edges
     cannot collide, whatever is added to either. */
  #rightcol{right:16px;top:152px;bottom:16px;width:266px;display:flex;
    flex-direction:column;justify-content:space-between;gap:10px}
  #panel,#cutpanel{background:var(--panel);border:1px solid #2a333d;border-radius:3px;
    padding:11px 12px;display:none}
  #panel.on,#cutpanel.on{display:block}
  /* ── ONE ROW LAYOUT FOR ALL THREE READOUT BOXES ──────────────────────────
     These were three copies of the same two declarations, and the copy is what
     broke. `justify-content:space-between` with no gap and no cap on the label
     lets a label that reaches the end of the column and a value that wraps BOTH
     keep laying out on the same pixels: the cold viewer read `you expect` back as
     "expector PRED" because the label's second word and the value's first line
     had merged into one line of type, and read `stock … · to band top 37 µm` back
     as two separate facts because the wrap split it there.

     So: the label wraps, and the value takes the remainder, right-aligned, so the
     numbers form a column the eye can run down and compare pass to pass; and the
     gap is the gutter that was missing.

     THE LABEL USED TO BE CUT, NOT WRAPPED — `max-width:46%` with `nowrap` and an
     ellipsis — and it was measured as the defect it is: eleven rows across the
     three boxes ended in `…`, mid-word (`Tool deflecti…`, `Extra deflect…`,
     `Ballscrew the…`, `speed …`, `st…`), and the value's `min-width:0` had
     removed the floor that would have kept it whole. An ellipsis is not
     overflow: `scrollWidth` never exceeded `clientWidth` on any of them, which
     is exactly why the overflow check could not see it. The label wraps now,
     nothing is hidden, and the value keeps its automatic min-content floor — a
     row whose label and value both hit their floors still fits, because the
     widest label word and the widest value run both measure narrow.
     `i:not(:only-child)` is load-bearing: one row in this panel is a label with
     no value ("Controls are on the pendant …"), and it must not be squeezed by
     a value that is not there. */
  #panel .row,#cutpanel .row,#budget .row{display:flex;gap:10px;font-size:12px;padding:1px 0}
  #panel .row > i,#cutpanel .row > i,#budget .row > i{color:var(--dim);font-style:normal}
  #panel .row > i:not(:only-child),#cutpanel .row > i:not(:only-child),
  #budget .row > i:not(:only-child){flex:0 1 auto;white-space:normal}
  #panel .row > span,#cutpanel .row > span,#budget .row > span{flex:1 1 auto;
    text-align:right}
  /* a parenthetical rides with its number instead of being broken off it */
  #panel .row > span i,#cutpanel .row > span i,#budget .row > span i{white-space:nowrap}
  /* A VALUE THAT IS A SENTENCE IS NOT A VALUE. It gets the full width under its
     own label, where it cannot be mistaken for the row above or below.
     THE ID IS LOAD-BEARING, AND THESE THREE RULES WERE MISSING IT. Written as
     bare classes they lost to the box rules above — `#cutpanel .row{display:
     flex}` is an id against a class, so the row it was written for never once
     laid out this way: computed display was `flex`, the label's two words were
     squeezed onto two lines, and the sentence stayed right-aligned beside them
     (`text-align` was lost the same way, to the id-scoped span rule). On screen
     that read as `you` stacked over `expect` at the left with the instruction
     running down the right, so the label looked like the first words of the
     sentence — the exact misreading this layout exists to prevent. The
     `white-space` rule below already carried its id for this same reason; the
     other three were written one class short and nobody had looked. */
  #panel .row.wide,#cutpanel .row.wide,#budget .row.wide{display:block}
  #panel .row.wide > i,#cutpanel .row.wide > i,#budget .row.wide > i{display:block;max-width:none}
  #panel .row.wide > span,#cutpanel .row.wide > span,#budget .row.wide > span{text-align:left}
  /* …and the sentence itself has to be allowed to wrap: `nowrap` on a row span's
     `i` is right for a parenthetical riding its number and wrong for a line of
     instruction, which is one unbreakable run that ran 266 px past the panel's
     right edge — off the screen at 1280×720 — out of a box 240 px wide. Written
     with the id so it outranks the parenthetical rule above, which a bare
     `.row.wide` cannot: that is one class short. */
  #panel .row.wide > span i,#cutpanel .row.wide > span i,
  #budget .row.wide > span i{white-space:normal}
  /* A VALUE AND ITS QUALIFIER ARE ONE UNIT. `nowrap` on the `i` keeps the
     parenthesis whole but still let the number sit alone on the line above it —
     which a cold viewer read as an orphaned line with no owner ("(−0.4 vs
     dial)"). The pair now rides together and moves down as a block when it does
     not fit beside its label, which is what a reader expects of a measurement
     and its qualifier. */
  #panel .row > span > .pair,#cutpanel .row > span > .pair,
  #budget .row > span > .pair{white-space:nowrap}
  #cutpanel kbd{background:#1b2229;border:1px solid #333d47;border-radius:2px;padding:0 4px;font-size:11px;color:var(--ink)}
  #panel h4{margin:0 0 8px;font-size:11px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;font-weight:500}
  #panel .cut,#cutpanel .cut{margin-top:8px;padding-top:8px;border-top:1px solid #2a333d}
  #panel kbd{background:#1b2229;border:1px solid #333d47;border-radius:2px;padding:0 4px;font-size:11px;color:var(--ink)}
  /* the attribution column — left of the work, under the job header, above the
     log. Anchored to the TOP: it is a printout on the wall, and a printout that
     grows downward off a fixed top edge cannot walk into anything. */
  /* BOUNDED ON BOTH SIDES. On the top by the job header, on the bottom by the
     log's own cap — but the bottom is a MAXIMUM now, not a second edge. Pinned
     top and bottom, the box was as tall as the space it had and the printout sat
     in its upper half: 267 px of content in a 355 px rectangle at 1280x720, and
     the dead black below `total` grew as the width fix stopped the rows wrapping.
     Two edges and a hug are different claims: the top edge and the maximum are
     what keep it off the log, and `calc(74vh - 176px)` is the same line the old
     `bottom` drew (720 - 150 - 16 - 26vh - 10 at any viewport height), so nothing
     about the guarantee moved. If rows are added here and it starts clipping,
     that is the signal to move something, because the alternative is what the
     viewer saw: this column printing through the pass lines of the log below. */
  #budget{left:16px;top:150px;max-height:calc(74vh - 176px);width:328px;background:var(--panel);
    border:1px solid #2a333d;border-radius:3px;padding:11px 12px;overflow:hidden;display:none}
  #budget.on{display:block}
  /* the row layout lives with the other two boxes — see the note above #panel */
  #budget b{color:var(--ink);font-weight:500}
  /* A SHORT WINDOW DEGRADES ON PURPOSE, OR IT CLIPS THE TOTAL. Measured at
     1280x620: the column wants 358 px and has 283, and `overflow:hidden` would
     take it out of the last row — which is the total, the one number the column
     exists for. So below 680 px the thermal triple goes (its three values are
     the CONTEXT for the terms, not the terms) and the rows tighten by a point.
     A deliberate drop beats a silent clip: one is a decision, the other is a
     readout that is lying about its own contents. */
  /* THE WIDTH IS A MEASUREMENT, NOT A PREFERENCE. Wrapping stopped the mid-word
     cuts and then printed every row as two lines with the unit orphaned —
     `Tool deflection under` / `MEAN force    µm` — one fact split in two, the
     same class of defect as the cut. Measured in the page at this type size: the
     widest row that is not a sentence is the deflection term and the thermal
     triple, both 292 px (231 + 10 + 51 and 152 + 10 + 130), and the widest label
     alone needs 299 px at 12 px — which is why no font size rescues a 252 px box,
     and 11 px and 10 px were measured and rejected as both too small for a wall
     printout and still too wide. 328 px gives 302 px of content inside the 24 px
     of padding and the 2 px border: the widest row clears by 10 px, the rest by
     more, and the value stands beside its label on one line.
     THE STOCK SENTENCE LEFT AS A VALUE at the same time. It was 253 px of prose
     that grows toward 320 px with a four-digit band figure, and a value that is
     a sentence is not a value; it is two labelled facts in the build code now.
     THE PADDING-TIGHTENING RULE WENT WITH THE WRAPPING IT PAID FOR. It bought
     22 px of height because wrapping cost 18 lines; every row is one line now
     and the column measures 267 px of content against its 355 px maximum at
     1280x720. A rule kept as insurance against a defect that is gone is a rule
     that hides the next one. Below 680 the triple still goes as it always did. */
  @media (max-height:680px){
    #budget .thermal{display:none}
    #budget .row{font-size:11.5px;padding:0}
  }
  /* the load meter — a machine instrument, not a part measurement */
  #pnLoad{margin-top:8px;padding-top:8px;border-top:1px solid #2a333d}
  #pnLoad .lm{display:flex;align-items:center;gap:6px;font-size:10px;padding:1px 0}
  #pnLoad .lm i{color:var(--dim);font-style:normal;width:44px;letter-spacing:.06em}
  #pnLoad .lmt{flex:1;height:5px;background:#1b2229;border-radius:2px;overflow:hidden}
  #pnLoad .lmt b{display:block;height:100%;background:#69a84f}
  #pnLoad .lm em{font-style:normal;color:var(--dim);width:30px;text-align:right;font-variant-numeric:tabular-nums}
  #pnLoad .lm em.over{color:#e2614a;font-weight:600}
  #pnLoad .lmsub{color:var(--dim);font-size:10px;margin-top:3px;font-variant-numeric:tabular-nums}

  /* toasts — used ONLY for speech and events, never for instructions */
  #talk{left:50%;bottom:74px;transform:translateX(-50%);max-width:min(620px,86vw);text-align:center}
  #talk .who{color:var(--warn);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
  #talk .say{font-size:16px;margin-top:5px}
  #talk .opt{pointer-events:auto;cursor:pointer;display:inline-block;margin:9px 4px 0;padding:4px 10px;
    background:var(--panel);border:1px solid #333d47;border-radius:2px;font-size:13px}
  #talk .opt:hover{border-color:var(--warn);color:var(--warn)}

  #ev{left:50%;top:76px;transform:translateX(-50%);text-align:center;font-size:15px;color:var(--warn)}
  #ev div{margin:4px 0}
  /* THE CHARGE IS ITS OWN LINE. The fee used to ride inside a sentence —
     "…charge you for the rework: −£647.50 off the day (£1,850.00 job × 35%)" —
     and two independent cold viewers misread £1,850.00 as £1,050.00 on
     different captures of the same 13px orange line. The pixels were right
     both times; the line was not cold-readable. A money figure that arrives
     mid-sentence, in warning colour, at caption size, with the shop behind it,
     is a number nobody can defend the reading of. So the charge now stands on
     its own line in ink, the way the day line names its own money
     ("ON THE DAY"), with the derivation under it — the rate first, so the
     parent lands before the child. Same roots, same order, no new words. */
  /* The session handover. It shares #ev's corner but not its warning colour —
     this is not a problem, it is the way a run gets out of the browser. It must
     also outrank #ev's own colour rule, hence the explicit colour below.
     `pointer-events:auto` is NOT optional: .hud sets `none` on the whole layer,
     so without it the span renders, looks clickable, and silently swallows
     every click into the canvas behind it. Same reason #talk .opt re-enables it. */
  #ev .getrec{color:var(--dim);font-size:12px;background:var(--panel);
    border:1px solid #333d47;border-radius:2px;padding:6px 10px;max-width:min(420px,80vw);
    pointer-events:auto}
  #ev .getrec b{color:var(--ink);font-weight:500}
  #ev .getrec .dl{color:var(--warn);cursor:pointer;text-decoration:underline;
    text-underline-offset:2px;white-space:nowrap;pointer-events:auto}
  #ev .getrec .hint{color:var(--dim);white-space:nowrap}
  #ev .getrec kbd{background:#1b2229;border:1px solid #333d47;border-radius:2px;
    padding:0 4px;font-size:11px;color:var(--ink)}

  /* #log is a bottom-left column; #talk is a centred column. Left uncapped they
     CROSS, and #log paints later so it wins — measured 7808 px² of overlap at
     1280x760 printing the log's long pass lines straight over the dialogue.
     Cap the log's width just short of the dialogue's left edge so the two
     columns can never meet. 50vw = half the #talk max-width (min(620px,86vw));
     the 24px is the gutter. Verified 0 overlap at 1280/1366/1440/1920. */
  /* THE OLDEST LINE FADES, IT DOES NOT GET SLICED. This column is
     `column-reverse` — the newest line is at the bottom and older lines stack
     upward — and with a `max-height` and `overflow:hidden` the line past the cap
     is cut through the middle of its own letterforms. Three separate stills of
     the cold-viewer set carried the same complaint ("bottom-left writing is cut
     off at the top"), which is what a half-row of type looks like when you cannot
     scroll to it. The fade says `this is the edge of the column` in the same way
     a darkroom door says it, and it cannot be mistaken for a print fault.
     THE FADE ALONE DID NOT CLEAR IT. Two further cold-viewer rounds reported the
     same cut line, because a fade dims a half-row, it does not stop it being a
     half-row: the top line was still type sliced through its letters, now also
     washed out, and "only `are not your machines.` is visible, hard to read" is
     what that looks like. `fitLogRows` now hides any row the column cannot show
     whole, so the topmost line is always a complete one, and the mask only has to
     soften the column's edge — six pixels, not twenty-four. */
  /* THE COLUMN HAS TO SURVIVE A BRIGHT FLOOR. A cold viewer read the log's dim
     lines as "clipped and low contrast against floor" while the floor behind
     them was a pale machine deck and the type was 12px grey over it. The scrim
     runs to the corner of the screen, so it has no bottom edge to read as a
     pasted bar, and the fill under it is one mix of the palette's own tokens —
     62% --dim over 38% --ink is #aeb8c3 — so the hierarchy survives the lift:
     the column's body is still quieter than its <b> and .new lines. */
  #log{left:0;bottom:0;max-width:calc(50vw - min(310px,43vw) + 8px);max-height:26vh;overflow:hidden;
    display:flex;flex-direction:column-reverse;gap:2px;font-size:12px;
    padding:2px 16px 14px;
    background:linear-gradient(to top,rgba(10,14,18,.88) 0,rgba(10,14,18,.70) 56%,rgba(10,14,18,0));
    -webkit-mask-image:linear-gradient(to bottom,rgba(0,0,0,.3) 0,#000 6px);
    mask-image:linear-gradient(to bottom,rgba(0,0,0,.3) 0,#000 6px)}
  #log div{color:#aeb8c3}
  #log div b{color:var(--ink);font-weight:500}
  #log .new{color:var(--ink)}

  /* entrance: the only screen that is not the world */
  #gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:#070a0d;z-index:9;cursor:pointer}
  #gate .in{max-width:640px;padding:0 26px}
  #gate h1{font-size:13px;letter-spacing:.42em;color:var(--dim);margin:0 0 22px;font-weight:400}
  #gate .big{font-size:23px;line-height:1.5}
  #gate .sub{color:var(--dim);margin-top:18px;font-size:13px;line-height:1.7}
  #gate .go{margin-top:30px;color:var(--warn);font-size:13px}
  #gate .fine{color:#5c6774;font-size:11px;margin-top:22px;line-height:1.6}
  /* THE ONE LINE OF TYPE THAT IS NOT IN A BOX, so it has to stand on its own
     against whatever is behind it. #5c6774 was a smudge on the walkway — the cold
     viewer read it as "faint gray on gray" and then could not say what the
     controls were. It is now the dim ink the rest of the HUD uses, with the same
     shadow the .hud layer gives everything else: this element was never inside
     `.hud`, which is why it had no shadow at all and every other block did. */
  #hint{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);color:var(--dim);font-size:11px;
    text-shadow:0 1px 3px #000,0 0 10px rgba(0,0,0,.9)}
</style>
</head>
<body>
<div id="vig"></div>

<div class="hud" id="tl">
  <div class="job" id="hJob">—</div>
  <div class="cli" id="hCli"></div>
  <!-- WHAT THE CLIENT IS DOING, NOT WHAT THEY SCORE. Deliberately not the
       standing number: §4 forbids progression by perk or timer and a bare
       integer in the corner of the screen is an XP bar whatever it is called.
       The behaviour is the same fact and it is the one a player can act on. -->
  <div class="cli" id="hShop"></div>
  <div class="clock" id="hClock">--:--</div>
  <div class="deadline" id="hDue"></div>
</div>

<div class="hud" id="tr">
  <div>GAUGE <b id="hGauge">—</b></div>
  <div>BAND <b class="band" id="hBand">—</b></div>
  <div style="margin-top:5px" id="hMoney">—</div>
  <!-- ── ROUND 9: THE FLOOR, ON SCREEN AND NOT IN A LEDGER ───────────────
       The pass condition says the new state must be observable WITHOUT
       reading a ledger. `#hFloor` is the compromise that keeps that honest:
       it is not a ledger — it is not a list of charges, and it never shows a
       verdict, a diameter or a score. It is four COUNTS of physical objects
       (castings in the crate, parts on the rack, parts in the bin, parts
       already collected) plus the van's own deadline. Every one of those
       numbers is also a thing you can walk up to and look at, and if this
       line and the scene ever disagreed, the scene is right and this is the
       bug. It is capped at two rows so it can never become a dashboard. -->
  <div id="hFloor" class="floor"></div>
</div>

<div class="hud" id="look"><span class="nm" id="lkName"></span><div class="act" id="lkAct"></div></div>
<div class="hud" id="ev"></div>
<div class="hud" id="talk"></div>
<div class="hud" id="log"></div>

<!-- ── ONE COLUMN, TWO PANELS, AND THEY CANNOT OVERLAP EACH OTHER ───────────
     A flex column anchored to the top of the free space and the bottom of the
     screen: the machine's own state hangs under the status block, the numbers
     you dial with sit at the bottom, and `space-between` keeps them apart no
     matter how many rows either of them grows. Two panels positioned
     independently from opposite edges CAN and did collide in the middle — the
     machine panel's stock row was printing through the cut panel's dial row in
     exactly the layout that was supposed to have fixed this. -->
<div class="hud" id="rightcol">
  <div id="panel">
    <h4 id="pnTitle">Machine</h4>
    <div id="pnRows"></div>
  </div>
  <!-- THE NUMBERS YOU DIAL WITH. Separate from the machine's condition on
       purpose: this is the pass being decided, not the state of the machine. -->
  <div id="cutpanel">
    <div class="cut" id="pnCut"></div>
    <div data-lmhost="1" id="pnLoad"></div>
  </div>
</div>

<!-- ── WHY THE PART IS WRONG, ATTRIBUTED — ITS OWN SURFACE ───────────────────
     The kernel's signed terms from the last pass that cut metal. No score, no
     verdict — the arithmetic, the way this build's own reference cases show it.

     IT USED TO BE THE TAIL OF #panel, AND THAT BROKE THE SCREEN. A cold viewer,
     given only stills: "the panel does not fit any more" — by the time the
     error budget had eight terms in it the machine panel's top was printing
     type through the top-right status block and its own header had gone off the
     top of the viewport. The panel is anchored to the BOTTOM, so it grows
     upward, and there was nothing above it to stop it. Six to twelve rows of
     attribution is a column of its own; it belongs where a machinist would put
     a printout, up on the wall to the left of the work, not stapled to the
     machine's own readout. -->
<div class="hud" id="budget"><div id="pnBudget"></div></div>

<div id="hint">WASD move · mouse look · <b>E</b> use · <b>shift</b> run</div>

<div id="gate"><div class="in">
  <h1>INDUSTRIA</h1>
  <div class="big" id="gBig">Loading.</div>
  <div class="sub" id="gSub"></div>
  <div class="go" id="gGo"></div>

<!-- ══ A THROWN HANDLER MUST BE VISIBLE ══════════════════════════════════════
     The board's verb threw a ReferenceError and the game did nothing at all: no
     message, no log line, no change on screen. It took a browser probe and three
     attempts to find, because the page had no way to say that anything had gone
     wrong. The audio probe learned this same lesson for itself and prints its own
     death; the GAME had not, and a silent failure in the game is worse because a
     player cannot tell it from a control that does not work.

     Registered in a classic script BEFORE the module, because a listener declared
     inside a module is registered too late to hear that module fail. -->
<script>
  window.__gameErrors = [];
  window.addEventListener('error', (e) => {
    const msg = String(e.message) + ' @ ' + (e.filename || '?').split('/').pop() + ':' + e.lineno;
    window.__gameErrors.push(msg);
    const L = document.getElementById('log');
    if (L) {
      const d = document.createElement('div');
      d.innerHTML = '<b style="color:#e05a4e">Something went wrong:</b> ' + msg;
      L.prepend(d);
    }
  });
</script>

<script type="module">
import * as THREE from './vendor/three/three.module.min.js';
import * as G from './game.mjs';
import * as W from './world.mjs';
/* The kernel, for its ADVISORY FLAGS. The page must be able to say what this
   model is not, and the honest source for that is the model itself. */
import * as K from './kernel.mjs';
import * as P from './people.mjs';
import { createAudio } from './audio.mjs';
/* The business the machine sits in. Pure, tested, no DOM — see its header for

   not, and why the constants moved. */
import { newShop, recordDelivery, offersFor, endOfDay, describeShop, averageClaimError_um, STANDING_OFFERS, unreported, markReported, letterFor, OVERHEAD_PER_DAY, adviseJob } from './shop.mjs';
/* The shop's surfaces. Drawn in the page, deterministic, no assets — see the
   header of materials.mjs for why they are not files. */
import { shopMaterials, shopEnvironment, tint, keypadPanel, keyAtUV, keyRectUV, KEYPAD, noticePanel, clockFace, consoleScreen, drawingSheet } from './materials.mjs';
/* Playtest instrumentation. Dark unless the URL asks for it (`?rec=1`), so the
   public build behaves exactly as before — see recorder.mjs and PLAYTEST-KIT.md.
   Every call below is a no-op returning early when `REC` is null. */
import * as RECmod from './recorder.mjs';
const REC = RECmod.isRecording() ? RECmod : null;

/* ══════════════════════════════════════════════════════════════════════════
   INDUSTRIA — the floor.
   The numbers are the kernel's. This file decides where to put them and what
   they look like, and it is not allowed to invent any of them (§R4).
   ══════════════════════════════════════════════════════════════════════════ */

const $ = (id) => document.getElementById(id);
const cl = (v, a, b) => Math.min(b, Math.max(a, v));
/** Money on screen. `£-647.5` is not a number a shop writes on anything: the
 *  sign belongs before the symbol and the pence are part of the figure. The
 *  thousands wear their comma too (`£1850.00` is how a spreadsheet talks, not
 *  a shop). The arithmetic stays exact; only the rendering is rounded. Every
 *  figure on screen flows through this one function, so the shop cannot write
 *  money two ways. */
const money = (v) => `${v < 0 ? '-' : ''}\u00a3${Math.abs(v).toLocaleString('en-GB', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;

/** How many castings the crate DRAWS, which is not the same as how many it
 *  holds once one is on the table. The crate object is the shop's, so the
 *  count is the shop's count and the machine does not borrow from it. */
function crateMeta() {
  const n = GAME ? GAME.stock_on_hand : 3;
  return { shown: cl(n, 0, 3), n };
}

/* ── STATE ──────────────────────────────────────────────────────────────── */
let GAME = null;                       // the kernel's game state
/* THE SHOP OUTLIVES THE JOB. `startShift` rebuilds GAME from a fresh spec on
   purpose — nothing of the old part may leak across — but the business is not
   the part. Cash, standing and the day's record have to survive exactly the
   reset that erases everything else, which is why they live out here. */
let SHOP = null;
const clocks = { world_min: 0, job_min: 0, job_taken: false };
let START_SHIFT_MIN = 355;             // 05:55
const SEEN = { any: false, measured: false, corrected: false };  // §53 layers
/* Round 9. `GONE_SENT` is a cached fact, not a second source of truth: the
   van takes a part out of the shop and the part register then holds it as
   GONE, which is invisible to a shelf. The page keeps one boolean so a
   sentence about the bay still reads correctly after the rack is empty, and
   it is written only by `courierBeat()`, only from the courier's own result. */
let GONE_SENT = false;
const CARRIED = { calipers: false, parallels: false, traveler: false };
/* The ONLY diameter the player is ever allowed to see. Gauge resolution is
   finite and the reading goes stale the moment you cut — both by design. */
let lastRead = null;                 // { mm, sigma_um, partC, at_min }
let revealed = null;                 // truth, and only ever AFTER the part ships
/** Post-mortem only: the customer measures it properly, and then you are told.
 *  This is the one moment the truth is allowed on screen (R1). */
function revealLine() {
  if (!revealed) return '';
  /* THE READING ON THE SAME RULER AS THE TRUTH. The CMM number is µm from
     nominal, so the gauge reading is printed that way too — the old line
     printed the reading as an absolute mm beside a µm-from-nominal truth, and
     a cold viewer had to convert units mid-sentence to compare them. And the
     gap is YOUR reading being out, never the gauge's fault: heat and a stale
     read are in the difference as well as the instrument, and the arithmetic
     is the claim note's own (`claimed − true` on the same two inputs, same
     order), so the caption and the standing line can never disagree.
     (`revealed.gauge_err_um` is kept for the record shape; no surface reads
     it.) */
  const read_um = (revealed.read_mm - GAME.job.nominal_mm) * 1000;
  const gap_um = read_um - revealed.err_um;
  return `<span style="color:#8b98a6">Customer CMM: true bore ` +
    `<b style="color:#e8edf2">Ø${revealed.true_mm.toFixed(4)}</b> mm at 20 °C, ` +
    `${revealed.err_um >= 0 ? '+' : ''}${revealed.err_um.toFixed(1)} µm on the diameter vs nominal. ` +
    `Your last gauge reading was ${read_um >= 0 ? '+' : ''}${read_um.toFixed(1)} µm on the diameter vs nominal — ` +
    `your reading was ${Math.abs(gap_um).toFixed(1)} µm out on the diameter.</span>`;
}
let phase = 'ARRIVE';
let earlIdleSince = 0, earlSaid = {}, lastEarlAt = -99;

/* ── THREE ──────────────────────────────────────────────────────────────── */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.42;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(72, innerWidth / innerHeight, 0.04, 220);
/* ══ THE CAMERA IS IN THE SCENE GRAPH BECAUSE THE PART IS A CHILD OF IT ════
   Anything parented to a camera is only rendered if the camera is itself part of
   the scene — three.js traverses the scene, and an orphan camera is never
   traversed. Without this line the held part is added, positioned, rotated by the
   mouse and NEVER DRAWN, which looks exactly like a part that failed to load and
   says nothing anywhere. Found by picking one up and looking. */
scene.add(camera);
const eye = new THREE.Vector3(-7.5, 1.68, 8.4);
let yaw = -0.30, pitch = -0.06;

/* ── MATERIALS — §49 wants a shop that has been used, not a showroom ──────
   Every surface below is DRAWN (materials.mjs), not coloured. The previous
   pass had thirty-six flat colours and no map at all, which is why the place
   read as a greybox no matter how many objects were added to it: a colour
   value cannot be worn, chipped, stained or wiped. These can.

   The three map types matter separately:
     map          — what the surface IS (concrete, painted steel, cast iron)
     roughnessMap — where it is polished and where it is dull. This is the one
                    that makes coolant read as wet against dry cast iron.
     normalMap    — grit. Without it a floor is a photograph on a plane.
   `tint()` gives a second colour of a surface without a second canvas, which
   is how the same sheet metal is a grey machine and a yellow guard. */
const MATS = shopMaterials();
const M = {
  floor: MATS.floor,
  aisle: MATS.aisle,
  wall:  MATS.wall,
  roof:  MATS.roof,
  steel: MATS.steel,
  dark:  tint(MATS.paint, 0x454c54),
  /* THE FOUR VALUES THAT MAKE A MACHINE READ AS ONE, after both cold viewers
     said the machine was "a pile of grey boxes". Everything in the cavity used
     to be castIron (94) or toolSteel (122) under a light-grey wall, so the
     whole frame sat inside one value. These four separate it: ground steel is
     the bright datum faces, rubber is the black that the light is measured
     against, the enclosure flanks are the machine's own faded paint, and the
     e-stop is the one saturated thing in the room. */
  ground: MATS.ground,
  cover:  MATS.cover,
  enamel: tint(MATS.paint, 0x8e9aa6),
  red:   tint(MATS.paint, 0xb03a2e),
  paint: MATS.paint,
  warn:  tint(MATS.paint, 0xc9a227),
  wood:  MATS.wood,
  vise:  MATS.iron,
  iron:  MATS.iron,       // cast iron: the table, the vise, the way covers
  rust:  MATS.rust,
  brass: new THREE.MeshStandardMaterial({ color: 0xa88a4a, roughness: 0.42, metalness: 0.85 }),
  coolant: new THREE.MeshPhysicalMaterial({ color: 0xa8c4a0, roughness: 0.22, metalness: 0.1,
             transparent: true, opacity: 0.55, transmission: 0.3, thickness: 0.4 }),
  chip:  new THREE.MeshStandardMaterial({ color: 0x8e9aa4, roughness: 0.35, metalness: 0.9 }),
  glass: new THREE.MeshPhysicalMaterial({ color: 0xd8e6ef, roughness: 0.04, metalness: 0,
             transparent: true, opacity: 0.13, side: THREE.DoubleSide }),
  interior: MATS.interior,
  bench: MATS.bench,
  bright: tint(MATS.paint, 0xeef1f4),
  slot: tint(MATS.iron, 0x6d7076),
  paper: tint(MATS.paint, 0xf2efe6),
  ink:   tint(MATS.paint, 0x8d949a),
};

const box = (w, h, d, mat, x = 0, y = 0, z = 0, parent = scene) => {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true; parent.add(m); return m;
};
const cyl = (rt, rb, h, mat, seg = 24) => new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat);

/* ── CONTACT SHADOWS ──────────────────────────────────────────────────────
   See `contactShade()` in materials.mjs for why this is a decal and not a
   shadow. `w` and `d` are the FOOTPRINT plus a quarter either side, because
   what the quad draws is the falloff around an object, not the object. */
const CONTACT_MAT = new THREE.MeshBasicMaterial({ map: MATS.shade, transparent: true,
  opacity: 0.55, depthWrite: false, color: 0xffffff });
function contactShadow(parent, w, d, x = 0, y = 0, z = 0, opacity = null) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d),
    opacity === null ? CONTACT_MAT

          opacity, depthWrite: false, color: 0xffffff }));
  m.rotation.x = -Math.PI / 2;
  m.position.set(x, y, z);
  m.renderOrder = 2;
  parent.add(m); return m;
}

/* ── THE BUILDING ───────────────────────────────────────────────────────── */
const ROOM = { w: 42, d: 34, h: 6.2 };
const floorMesh = new THREE.Mesh(new THREE.PlaneGeometry(ROOM.w, ROOM.d), M.floor);
floorMesh.rotation.x = -Math.PI / 2; floorMesh.receiveShadow = true; scene.add(floorMesh);

const roof = new THREE.Mesh(new THREE.PlaneGeometry(ROOM.w, ROOM.d),
  M.roof.clone());
roof.material.side = THREE.DoubleSide;
roof.rotation.x = Math.PI / 2; roof.position.y = ROOM.h; scene.add(roof);

/* walls, with a roll-up door on the -Z end (you came in through it) */
box(ROOM.w, ROOM.h, 0.3, M.wall, 0, ROOM.h / 2, -ROOM.d / 2);
box(0.3, ROOM.h, ROOM.d, M.wall, -ROOM.w / 2, ROOM.h / 2, 0);
box(0.3, ROOM.h, ROOM.d, M.wall, ROOM.w / 2, ROOM.h / 2, 0);
box(ROOM.w, ROOM.h, 0.3, M.wall, 0, ROOM.h / 2, ROOM.d / 2);
const door = box(5.4, 4.4, 0.22, M.dark, 0, 2.2, -ROOM.d / 2 + 0.28);
for (let i = 0; i < 6; i++) box(5.4, 0.06, 0.26, M.steel, 0, 0.5 + i * 0.72, -ROOM.d / 2 + 0.3);

/* a painted aisle down the middle, worn in the traffic lanes */
const aisle = new THREE.Mesh(new THREE.PlaneGeometry(3.2, ROOM.d - 4), M.aisle);
aisle.rotation.x = -Math.PI / 2; aisle.position.set(-2.2, 0.008, 1); aisle.receiveShadow = true; scene.add(aisle);

/* ── LIGHTING — driven by world.daylight(); shop fluorescents always on ───
   THE ENVIRONMENT COMES FIRST, and it is the reason the previous pass looked
   like a greybox even where geometry was right. A MeshStandardMaterial with
   metalness 0.7 and no environment reflects NOTHING, so every steel surface
   rendered almost black, every roughness value did nothing, and the whole room
   collapsed to a flat fog of its own paint colour. `shopEnvironment()` draws
   this room — dark roof, six lamp bars, grey walls, the cold rectangle of the
   open door — prefilters it, and from here on the materials reflect a shop.

   HAZE. A 40 m shop at half five in the morning is not sharp to the far wall,
   and without it the room reads as a diagram rather than a place. Density is
   set so the far wall is roughly a third of the way to the fog colour: enough
   to give the lamps something to bloom into, not enough to hide the van. */
scene.environment = shopEnvironment(renderer);
scene.environmentIntensity = 0.42;
scene.fog = new THREE.FogExp2(0x151a20, 0.014);

const hemi = new THREE.HemisphereLight(0xd6e2ee, 0x5a6168, 1.12); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffe9c8, 0.55);
sun.position.set(-14, 12, -8); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); sun.shadow.camera.far = 48;
sun.shadow.camera.left = -22; sun.shadow.camera.right = 22;
sun.shadow.camera.top = 22; sun.shadow.camera.bottom = -22;
sun.shadow.bias = -0.0009; sun.shadow.normalBias = 0.022; scene.add(sun);
/* The door is the only light in this building that is not a tube, and it is
   the one that tells you what time it is without a clock in the corner. */
const dawn = new THREE.DirectionalLight(0x9fbcdf, 0.32);
dawn.position.set(4, 3.4, -26); dawn.target.position.set(0, 1.6, 6);
scene.add(dawn); scene.add(dawn.target);

const LAMPS = [];
for (let ix = -1; ix <= 1; ix++) for (let iz = -1; iz <= 1; iz++) {
  const x = ix * 12, z = iz * 9.5;
  const g = new THREE.Group(); g.position.set(x, ROOM.h - 0.5, z); scene.add(g);
  box(2.4, 0.16, 0.5, M.dark, 0, 0, 0, g);
  const tube = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.06, 0.42),
    new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xeef4ff, emissiveIntensity: 2.4 }));
  tube.position.y = -0.11; g.add(tube); LAMPS.push(tube);
  const pl = new THREE.PointLight(0xf2f6ff, 2.1, 20, 2); pl.position.set(x, ROOM.h - 1.2, z); scene.add(pl);
}
/* Hanging pendants down the aisles. A shop lit only from six metres up is a
   shop nobody works in: these put pools of light at bench height, which is
   where the eye is and where the work is. Their bulbs are kept in their own
   list because the ceiling circuits and the bench circuits are not the same
   circuit — the frame loop drives each from the clock separately. */
const PRACTICALS = [];
for (const [px, pz] of [[-9, 2], [6, 5], [-4, -6], [9, -4]]) {
  const g = new THREE.Group(); g.position.set(px, 2.85, pz); scene.add(g);
  box(0.035, 2.8, 0.035, M.dark, 0, 1.4, 0, g);                  // drop rod to the frame
  const shade = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.36, 0.28, 24, 1, true), M.bright);
  shade.position.y = 0.14; shade.castShadow = true; g.add(shade);
  const bulb = new THREE.PointLight(0xfff0d6, 1.9, 11, 1.7); bulb.position.y = -0.14; g.add(bulb);
  PRACTICALS.push(bulb);
  const glow = new THREE.Mesh(new THREE.SphereGeometry(0.055, 12, 10),
    new THREE.MeshStandardMaterial({ color: 0xfff6e2, emissive: 0xffeec6, emissiveIntensity: 4.0 }));
  glow.position.y = -0.10; g.add(glow);
}

/* ── THE ROOF STRUCTURE ───────────────────────────────────────────────────
   A 42 × 34 m bay does not float: it is a portal frame, and the frame is the
   thing your eye uses to measure the room. Without it the ceiling is a black
   lid and the space reads as a box rather than a building. Purlins between the
   beams give the light fittings something to be bolted to. */
for (let z = -ROOM.d / 2 + 4; z <= ROOM.d / 2 - 4; z += 8.5) {
  const beam = box(ROOM.w, 0.34, 0.16, M.dark, 0, ROOM.h - 0.55, z);
  beam.castShadow = false;
  box(ROOM.w, 0.10, 0.30, M.dark, 0, ROOM.h - 0.40, z);
}
for (let x = -ROOM.w / 2 + 3; x <= ROOM.w / 2 - 3; x += 6) {
  const p = box(0.12, 0.16, ROOM.d, M.dark, x, ROOM.h - 0.30, 0);
  p.castShadow = false;
}
/* Columns, at the wall line where the frame lands. */
for (const cx of [-ROOM.w / 2 + 0.9, ROOM.w / 2 - 0.9]) {
  for (const cz of [-ROOM.d / 2 + 3, 0, ROOM.d / 2 - 3]) {
    box(0.5, ROOM.h, 0.5, M.dark, cx, ROOM.h / 2, cz);
  }
}

/* ── THE MACHINE — vmc_40taper_7k5 ─────────────────────────────────────────
   Built as a CASTING, not a crate: column at the back, a real open cavity in
   front of it, tool hanging into that cavity, and the door glass looking in.
   The first attempt made the column a solid box filling the whole enclosure,
   so the window looked into a brick. Measured, not assumed. */
const cell = new THREE.Group(); cell.position.set(0, 0, -7); scene.add(cell);
/* plinth and column — the mass lives at the REAR */
box(3.2, 0.44, 2.6, M.dark, 0, 0.22, 0, cell);
contactShadow(cell, 4.3, 3.7, 0, 0.006, 0, 0.62);          // the machine on the slab
box(3.2, 3.2, 0.95, M.enamel, 0, 2.2, -0.82, cell);         // column casting
box(3.2, 0.30, 2.6, M.enamel, 0, 3.85, 0, cell);            // top cap
/* the enclosure: floor, roof, two side walls — leaving a C-shaped cavity.
   THE FLOOR IS THE CHIP PAN AND IT IS BLACK. It was machineInterior, the same
   light paint as the walls, so the cavity had no bottom and the table floated
   in a grey wash; a real enclosure drains into a dark pan and the table sits in
   it. This is also the surface the table casts its contact shadow onto. */
box(3.2, 0.10, 2.6, M.cover, 0, 1.02, 0, cell);
box(3.2, 0.10, 2.6, M.dark, 0, 3.70, 0, cell);
box(0.10, 2.7, 2.6, M.enamel, -1.55, 2.36, 0, cell);
box(0.10, 2.7, 2.6, M.enamel,  1.55, 2.36, 0, cell);
/* liner panels: the INSIDE faces of the cavity are coolant-stained cast, the
   outside flanks are painted sheet. One box cannot be both, so the inner skin
   is its own thin panel and the machine stops looking like a white cabinet. */
box(0.02, 2.6, 2.58, M.interior, -1.48, 2.36, 0, cell);
box(0.02, 2.6, 2.58, M.interior,  1.48, 2.36, 0, cell);
/* interior back wall of the cavity (in front of the column casting) */
box(3.0, 2.6, 0.06, M.interior, 0, 2.36, -0.32, cell);
/* THE WORKLIGHT — the single reason the interior reads as a machine at all */
const workLight = new THREE.PointLight(0xfff3e0, 1.85, 6.4, 1.5);
workLight.position.set(0.9, 3.5, 0.7); cell.add(workLight);
const workLamp = new THREE.Mesh(new THREE.SphereGeometry(0.06, 10, 8),
  new THREE.MeshStandardMaterial({ color: 0xfff6e2, emissive: 0xfff2d8, emissiveIntensity: 3.0 }));
workLamp.position.copy(workLight.position); cell.add(workLamp);
/* ══ THE POSITION READOUT — the machine's own numbers, on the machine ══════
   Both cold viewers, shown only pictures: "it is called a 3-AXIS VMC and there
   is no axis readout anywhere on it." They are right, and it is the cheapest
   credibility in the shot: every real machine has one and an operator reads it
   without thinking.

   WHAT IT MAY SHOW, and this is the whole constraint:
     X — the bar's cutting edge position on the MACHINE'S OWN SCALE, read
         straight off `edgeR_cold_mm`, which is the value the kernel cuts with.
     Z — the depth the tool is programmed to travel, from the job.
     And the spindle's state, which is `spindle_on` — the same one derivation
     the pendant reads, never a second one.

   TWO DECIMALS, NOT THREE, AND THAT IS A RESOLUTION DECISION, NOT A STYLE ONE.
   After a pass `edgeR_cold_mm` holds the position the edge ACTUALLY reached,
   so at three decimals this panel would be a micrometre-resolution readout of
   the achieved bore radius — it would replace the gauge, and it would beat it,
   because the gauge in this game carries a calibration error of its own. The
   whole finish sequence is played in 2–6 µm nudges; at 2 dp this scale cannot
   resolve a single one of them, which is exactly as much as a machine-mounted
   display is entitled to. The achieved size is MEASURED in this shop, and the
   panel that says otherwise is the customer's CMM.

   What it must NEVER show is the part's size against the drawing. The DRO is
   what the machine believes; the gauge is what it measured; the CMM is what is
   true. Those three being different is the game. */
const droC = canvasFor(512, 256);
const droTex = new THREE.CanvasTexture(droC);
const droBezel = box(0.52, 0.28, 0.035, M.dark, 1.02, 2.60, -0.2725, cell);
const dro = new THREE.Mesh(new THREE.PlaneGeometry(0.46, 0.225),
  new THREE.MeshStandardMaterial({ map: droTex, emissiveMap: droTex, emissive: 0xffffff,
    emissiveIntensity: 0.9, roughness: 0.34, metalness: 0.0 }));
dro.position.set(1.02, 2.60, -0.2545); cell.add(dro);
let droKey = '';
function paintDRO() {
  const g = GAME; if (!g) return;
  const x = g.machine.edgeR_cold_mm;
  const key = `${x === null || x === undefined ? 'null' : x.toFixed(2)}|${g.job.bore_depth_mm}|${g.machine.spindle_on}`;
  if (key === droKey) return;
  droKey = key;
  const ctx = droC.getContext('2d');
  ctx.fillStyle = '#0a0c0b'; ctx.fillRect(0, 0, 512, 256);
  const row = (y, k, v, hot = false) => {
    ctx.font = '400 21px ui-monospace, Menlo, monospace'; ctx.fillStyle = '#6d6a3f';

     `translate(0, 0.030, 0)` used to sit here, written on the belief that the
     rotation had put the ring at y 0..−0.030. Measured against the vendored
     three.js it put every casting 30 mm in the air: the crate stack floated at
     rim height and the rack slots floated above the shelf, and a cold viewer
     counted the crate wrong because the third casting sat up where the rim
     crosses it. The lift is gone; `y` means the surface. (The same
     rotate-then-lift idiom stands in `buildPartMesh`, where it is LOAD-BEARING:
     the clamp seat at 0.042 was derived against that raised part, so do not
     "unify" the two without re-deriving the clamps.) */
  geo.rotateX(-Math.PI / 2);
  const m = new THREE.Mesh(geo, dead ? M_PART_DEAD : M_PART_GOOD);
  m.castShadow = m.receiveShadow = true; g.add(m);
  return g;
}

/* ══ THE JOB BOARD — where the next morning's work is pinned ══════════════
   L2. Until now `JOBS` held two fully-specified jobs and the player could only
   ever play the first one; the second was reachable from a test hook and from
   nowhere else. A shop's work does not arrive on the machine — it arrives on a
   BOARD, and a machinist walks over and reads it. So the board is an object
   like everything else here: it is by the roll-up door on the way in, it has
   the week's cards pinned to it, and you read it by looking at it.

   Nothing on a card is a number this page invented. Client, bore, tolerance
   grade, band width, the rate and the van's slot all come off the job spec in
   `game.mjs`, which is the same object the kernel is handed. A card cannot say
   the job is easier than the job is. */
const JOBBOARD = new THREE.Group();
JOBBOARD.position.set(-6.6, 0, -16.3);
scene.add(JOBBOARD);
box(2.36, 1.66, 0.10, M.dark, 0, 1.62, 0, JOBBOARD);            // frame

box(2.18, 0.14, 0.06, M.warn, 0, 2.28, 0.07, JOBBOARD);         // header strip
const BOARD_CARDS = [];
/* LAID OUT FOR ANY NUMBER OF JOBS. The first version placed cards at
   `-0.52 + i * 1.04`, which was correct for exactly two and ran off the edge of
   the board at four. A board that only fits the jobs that happened to exist
   when it was built is a board that will silently lose work, so the grid is
   computed from the count. */
function buildBoardCards() {
  for (const c of BOARD_CARDS.splice(0)) JOBBOARD.remove(c.group);
  const n = G.JOBS.length;
  const cols = n <= 3 ? n : Math.ceil(n / 2);
  const rows = Math.ceil(n / cols);
  const BW = 2.02, BH = 1.30, gx = 0.06, gy = 0.05;
  const cw = (BW - gx * (cols - 1)) / cols;
  const ch = (BH - gy * (rows - 1)) / rows;
  G.JOBS.forEach((j, i) => {
    const col = i % cols, row = Math.floor(i / cols);
    const g = new THREE.Group();
    g.position.set(-BW / 2 + cw / 2 + col * (cw + gx),
                   1.62 + BH / 2 - ch / 2 - row * (ch + gy), 0.10);
    g.rotation.z = ((i % 2) ? -1 : 1) * 0.012;
    JOBBOARD.add(g);
    box(cw, ch, 0.012, M.paper, 0, 0, 0, g);
    const band = box(cw, ch * 0.14, 0.014, M.warn, 0, ch * 0.42, 0.003, g);
    const lines = Math.max(3, Math.floor(ch * 9));
    for (let k = 0; k < lines; k++) {
      box(cw * 0.78, 0.011, 0.015, M.ink, -cw * 0.04, ch * 0.27 - k * (ch * 0.11), 0.003, g);
    }
    const pin = cyl(0.016, 0.016, 0.02, M.brass, 10);
    pin.rotation.x = Math.PI / 2; pin.position.set(0, ch * 0.47, 0.012); g.add(pin);
    BOARD_CARDS.push({ job: j, group: g, band });
  });
}
buildBoardCards();
/** The board reads the same state the machine does: the card for the job you
 *  are set up on is flagged, the rest are offers — and a card a client has
 *  taken off the wall is dark, because that is what happened. */
function syncBoard() {
  if (!GAME) return;
  BOARD_CARDS.forEach(({ job, band }) => {
    const mine = GAME.job.id === job.id;
    const state = SHOP ? offersFor(SHOP, [job])[0] : { offered: true };
    band.material = mine ? M.warn : state.offered ? M.ink : M.slot;
    band.visible = state.offered || mine;
  });
}

/* ── THE REST OF THE SHOP — inhabited (§49), and not all of it about you ──
   THREE OF THESE EXIST because the arrival text has promised "three spindles
   already running" since it was written and the floor had two. A shop is three
   spindles you did not start; the sentence was right and the floor was short.

   WHAT MAKES A BOX READ AS A MACHINE TOOL. The first version was a grey cuboid
   with a flat window in it, which is a shipping container. A vertical machining
   centre is recognisable from its SILHOUETTE long before its detail: a tall
   back that houses the column, a lower front with the door in it, a control box
   hanging off one side, and a chip conveyor crawling out of the base on the
   other. Get those four and it reads at a glance from across the shop, which is
   the only distance that matters for the other three. */
function vmcDressing(g, { w = 2.4, d = 2.0, front = 1.0 } = {}) {
  /* (a) leveling feet. Machines are never flat on the slab. */
  for (const fx of [-w / 2 + 0.28, w / 2 - 0.28]) {
    for (const fz of [-d / 2 + 0.28, d / 2 - 0.28]) {
      const foot = cyl(0.075, 0.10, 0.14, M.steel, 12);
      foot.position.set(fx, 0.07, fz); g.add(foot);
    }
  }
  /* (b) the chip conveyor, crawling out of the base to one side — the single
     most machine-tool-shaped object in the building. */
  const conv = box(0.62, 0.46, 1.5, M.dark, -w / 2 - 0.22, 0.68, -0.1, g);
  conv.rotation.z = 0.30;
  box(0.56, 0.30, 0.5, M.dark, -w / 2 - 0.52, 0.98, 0.45, g);
  const chipPile = new THREE.Mesh(new THREE.ConeGeometry(0.30, 0.16, 12), M.chip);
  chipPile.position.set(-w / 2 - 0.52, 1.16, 0.45); g.add(chipPile);
  /* (c) the control box on an arm, on the other side, angled toward whoever is
     standing at the door — which is where a pendant always is. */
  const cb = new THREE.Group(); cb.position.set(w / 2 + 0.30, 1.55, front * 0.55);
  cb.rotation.y = -0.34; g.add(cb);
  box(0.10, 0.10, 0.10, M.dark, -0.14, 0.0, 0, cb);          // arm joint
  box(0.06, 0.06, 0.34, M.dark, -0.24, 0.0, -0.16, cb);      // arm
  box(0.46, 0.60, 0.16, M.dark, 0, 0, 0, cb);                // the box
  box(0.34, 0.24, 0.02, new THREE.MeshStandardMaterial({ color: 0x1b3a2a, emissive: 0x2f7a4a, emissiveIntensity: 0.55 }),
      0, 0.13, 0.09, cb);
  for (let k = 0; k < 6; k++) {
    box(0.055, 0.035, 0.02, k === 2 ? M.warn : M.slot, -0.11 + (k % 3) * 0.11, -0.10 - Math.floor(k / 3) * 0.08, 0.09, cb);
  }
  /* (d) the door, framed, with a real gasket line and a handle — and the
     nameplate and warning sticker that every machine in every shop carries. */
  box(w * 0.98, 0.07, 0.07, M.dark, 0, 2.42, front + 0.02, g);
  box(w * 0.98, 0.07, 0.07, M.dark, 0, 0.90, front + 0.02, g);
  box(0.07, 1.55, 0.07, M.dark, -w * 0.46, 1.66, front + 0.02, g);
  box(0.07, 1.55, 0.07, M.dark,  w * 0.46, 1.66, front + 0.02, g);
  box(0.52, 0.045, 0.045, M.steel, w * 0.30, 1.12, front + 0.06, g);
  box(0.34, 0.10, 0.02, M.bright, -w * 0.22, 2.60, front + 0.06, g);   // nameplate
  box(0.16, 0.20, 0.02, M.warn,   w * 0.30, 1.08, front + 0.06, g);    // warning
  return g;
}
function otherMachine(x, z, ry, colorHex, noise) {
  const g = new THREE.Group(); g.position.set(x, 0, z); g.rotation.y = ry; scene.add(g);
  const paint = tint(MATS.paint, colorHex);
  box(2.6, 0.40, 2.2, M.dark, 0, 0.20, 0, g);                 // plinth
  /* the tall back that houses the column, and the lower front that holds the
     door — the two masses that make the silhouette */
  box(2.4, 3.10, 1.05, paint, 0, 1.95, -0.58, g);
  box(2.4, 1.65, 1.05, paint, 0, 1.22, 0.52, g);
  box(2.52, 0.16, 2.2, paint, 0, 3.58, 0, g);                 // top cap
  box(2.4, 0.12, 2.2, M.dark, 0, 0.44, 0, g);                 // belt line
  const w2 = new THREE.Mesh(new THREE.PlaneGeometry(1.62, 1.10), M.glass);
  w2.position.set(0, 1.55, 1.06); g.add(w2);
  vmcDressing(g, { w: 2.4, d: 2.2, front: 1.06 });
  /* ══ A MACHINE THAT RUNS HAS SOMETHING THAT TURNS ════════════════════════
     These three were built, lit, cutting and entirely frozen: the noise told you
     they were running and the picture said they were switched off, and the brief's
     §1 and §5 are both about a factory that goes on without you. A spindle nose
     and a work light inside the window is the smallest change that makes a
     machine visibly alive — the light already existed on the player's machine for
     exactly this reason, and these never got one.

     THE SPEED IS THE MACHINE'S OWN, from the acoustics it is already being driven
     with, so what you see and what you hear are the same rpm. `machineMotion` is
     the player's machine and lives in `cell`; this is the same idea one object
     over, and it is deliberately not a shared function because the two machines
     are driven by different things — yours by the kernel, theirs by a script. */
  const nose = cyl(0.09, 0.12, 0.34, M.steel, 16);
  nose.position.set(0, 2.30, 0.25); g.add(nose);
  const inLight = new THREE.PointLight(0xfff3e0, 1.1, 2.6, 1.8);
  inLight.position.set(0.5, 2.9, 0.5); g.add(inLight);
  return { g, noise, nose };
}

/* (4) PALLET RACKING along the far wall. The strongest silhouette in any
   warehouse, and cheap: uprights and beams. */
function racking(x, z, ry, bays) {
  const g = new THREE.Group(); g.position.set(x, 0, z); g.rotation.y = ry; scene.add(g);
  const W = 2.7, H = 4.2, D = 1.1;
  for (let b = 0; b <= bays; b++) {
    const bx = (b - bays / 2) * W;
    for (const dz of [-D / 2, D / 2]) {
      box(0.10, H, 0.10, M.rust, bx, H / 2, dz, g);
      box(0.10, H, 0.10, M.rust, bx + 0.14, H / 2, dz, g);   // the twin upright
    }
  }
  for (const lvl of [1.15, 2.55, 3.75]) {
    box(W * bays, 0.12, 0.09, M.rust, 0, lvl, -D / 2, g);
    box(W * bays, 0.12, 0.09, M.rust, 0, lvl, D / 2, g);
    for (let b = 0; b < bays; b++) {
      box(W * 0.92, 0.04, D * 0.86, M.steel, (b - bays / 2 + 0.5) * W, lvl + 0.08, 0, g);
    }
  }
  contactShadow(g, W * bays + 0.7, D + 0.6, 0, 0.005, 0, 0.45);

   THICKNESS, so from the reading view — the one view a caliper has to

   see, only the bar and a blocky grey mass under the hand, which is what
   the review kept calling it. On the tool the jaws run off the beam's
   WIDTH, in the plane of the scale, so the reading view gets the silhouette
   everybody knows: bar across, fork down at the left end, the depth rod
   along the lower edge. The tool lies flat on the bench now, too, instead
   of standing on its prongs, because a real caliper's jaws are flush with
   its back. (The first rebuild was about size: the label said 150 mm and
   the beam was drawn 300 — one fact derived twice, disagreeing. CALIPER_MM
   is the only place the size exists; the beam is it in metres, the scale
   prints it, the label names it.) The rest is the silhouette a vernier is
   known by: the slider five millimetres open, the thumbwheel under it, the
   lock screw standing on it where the bar's own shadow cannot hide it,
   ground tips on the measuring faces, the rod's end flush with the beam's
   end when the jaws are shut. AND THE SLIDER'S ZERO RIDES AT THE FORK'S
   OPENING: the old build's slider sat at the 45 while its jaws gapped 23 —
   one opening, derived twice, disagreeing with itself. The moving prong now
   hangs off the slider's zero edge, so the scale's 5, the gap and the
   slider are one fact. */
const CALIPER_MM = 150;
const CALIPER_M = CALIPER_MM / 1000;

/* THE SCALE IS ENGRAVED, NOT MODELED. Forty separate tick boxes were hairlines
   only by courtesy — at the held distance they collapsed into a striped blur,
   and a scale with no numerals is not a scale; the sighted reviewer called
   exactly that. The engraving is drawn once on a canvas the way the DRO and
   the drawing already are, in THREE CONTRASTS: light short 1 mm ticks, mid
   5 mm ticks, heavy 10 mm ticks with numerals — at one weight the whole
   ruling averaged into a striped blur; at three, the eye picks the decade
   out. The numerals sit below the tick line, clear of it, the zero at the
   fixed jaw's measuring face. Every figure on it comes off
   CALIPER_MM, so the strip cannot disagree with the label that names the
   tool. The strip now runs the full beam, because a 150 mm scale needs 150 mm
   of beam; the slider rides over it, as a slider does. */
const scaleC = canvasFor(1600, 320);
{
  const ctx = scaleC.getContext('2d');
  const pxmm = 1600 / CALIPER_MM, mid = 160;
  ctx.fillStyle = '#c3c7cc'; ctx.fillRect(0, 0, 1600, 320);
  ctx.textAlign = 'center';
  for (let mm = 0; mm <= CALIPER_MM; mm++) {
    const x = mm * pxmm, major = mm % 10 === 0, five = mm % 5 === 0;
    ctx.strokeStyle = major ? '#1d2024' : five ? '#4a4f55' : '#9aa0a6';
    ctx.lineWidth = major ? 6 : five ? 3 : 1;
    ctx.beginPath(); ctx.moveTo(x, mid);
    ctx.lineTo(x, mid - (major ? 96 : five ? 56 : 22)); ctx.stroke();
    if (major) { ctx.fillStyle = '#1d2024'; ctx.font = '600 48px ui-monospace, Menlo, monospace'; ctx.fillText(String(mm), x, 246); }
  }
}

/* One skin, one cuff, one lamp recipe for BOTH hands: the glove's values were
   measured once — 0x242b33 under the 0.30 warm lamp lands lit flanks near 68 —
   and the calipers' hand reuses the exact materials instead of deriving its
   own, because a second derivation of one value is how two hands end up
   different colours. dropGlove tears the glove down by disposing what it
   holds, so it must never see these shared ones. */
const SKIN = new THREE.MeshStandardMaterial({ color: 0x242b33, roughness: 1.0, metalness: 0.0 });
const CUFF = new THREE.MeshStandardMaterial({ color: 0x404852, roughness: 0.95, metalness: 0.05 });
const handLamp = () => new THREE.PointLight(0xfff2dc, 0.30, 1.3, 2.0);

/* THE HAND, WHEN THE TOOL IS TAKEN. A tool held by no one floats, and five
   grips have died on it: a lamp-lit grey mass (measured: the wrist's own near
   end, 0.27 m out, with a lamp 0.11 m off its skin), a white frustum with a
   black rim, a matte black cylinder, three black knobs, and four round balls
   in a row — the last one measured at 46 px wide against 45 px long, an
   aspect of 1.0, and a thing whose length equals its width is a ball however
   it is lit.

   Three facts write this build. The reader looks UP at the tool from below
   and in front, so the only hand surfaces it can see face down-and-front, and
   the lamp must stay above the engraved face's plane, because the face reads
   by being dark against the bright scale. The bar is a box (x ±0.075, y
   0.0255..0.0345, z ±0.015) and it cuts the frame into three regimes: below it
   a part is always visible, inside its band a part shows only in front of the
   near face (z > 0.015), and above it a part shows only in front of a line
   that falls with height (z > 0.113 − 0.39757·(y + 0.212)). And a tube's
   visible flank faces +z when its axis is vertical or along x, but faces −y
   when its axis runs along z — which is why round five's wrist, 0.36 m of
   cylinder down the −z axis, measured N·L −0.08 and L 0.0 at every sample and
   read as a black pipe. Length cannot fix a tube that faces away from the
   lamp, and round five's thumb showed as a bare cap for the same reason: it
   crossed the bar's band behind the near face.

   So the fingers ARCH and cross in front: each is one capsule from a crown
   above and in front of the bar (y 0.070, z 0.020) down to a tip below it
   (y 0.015, z 0.009). On screen they run 80-110 px long against 28-30 px wide
   — aspect 2.9 to 3.7, tubes instead of balls — and the row's own run across
   the pose staggers them (crowns 457→436 px, tips 526→510), so no height is
   authored to avoid a railing. The tips land 17-18 px clear of the numerals:
   the glyph band and the scale's left half stay clear, and the pinky's tube
   stops at 1121 px, short of the HUD's 1160 px edge. The knuckle ridge is one
   capsule along x, deliberately the darkest part of the hand (a horizontal
   cylinder catches N·L 0.25 against the fingers' 0.80), so the fingers read
   as emerging from a line rather than as balls on an edge. The thumb crosses
   the near face the same way and bites the band at 72 px long, aspect 2.35,
   stopping clear of the lock screw's 799 px. The heel is a capsule along x
   behind the bar's bottom edge, closing the gap of lit floor that made round
   five float — its arm's top sat 112 px below the bar. The forearm leaves the
   heel along a taper (0.020 m at the wrist to 0.029 m) and the cuff covers it
   at 1.5× the wrist's radius, so the cuff's opening reads as a cuff; the
   forearm's near cap is buried inside the heel, so no flat cut shows. Skin,
   cuff and lamp are the glove's recipe at the glove's distance, unchanged — a
   second derivation is how two hands end up different colours. Take the tool
   while wearing the glove and both private lamps burn; both are the same dim
   recipe and the reading gate is shot with the bench clear. The bench copy of
   the tool never gets a hand — this is built when the tool is taken, and the
   take is one-way. */
function buildCaliperGrip() {
  const g = new THREE.Group();
  const cap = (r, len, at, axis) => {
    const c = new THREE.Mesh(new THREE.CapsuleGeometry(r, len, 6, 14), SKIN);
    const yv = new THREE.Vector3(axis[0], axis[1], axis[2]).normalize();
    const ref = Math.abs(yv.y) > 0.9 ? new THREE.Vector3(1, 0, 0) : new THREE.Vector3(0, 1, 0);
    const xv = new THREE.Vector3().crossVectors(ref, yv).normalize();
    const zv = new THREE.Vector3().crossVectors(xv, yv).normalize();
    c.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(xv, yv, zv));
    c.position.set(at[0], at[1], at[2]); c.castShadow = false; g.add(c); return c;
  };
  /* Every part below is one capsule or one cylinder between two points; len is
     the axis distance minus both end caps, so a joint is solid skin rather than
     two discs butting. */
  const seg = (a, b, r) => {
    const av = new THREE.Vector3(a[0], a[1], a[2]);
    const bv = new THREE.Vector3(b[0], b[1], b[2]);
    const axis = bv.clone().sub(av);
    const len = Math.max(axis.length() - 2 * r, 0.0005);
    cap(r, len, av.add(bv).multiplyScalar(0.5).toArray(), axis.toArray());

  const xs = [-0.020, 0.002, 0.024, 0.046];   // index..pinky, across the scale's right half only; the pinky's tube stops at 1121 px, short of the HUD's 1160 px edge

  const wrist = new THREE.Mesh(new THREE.CylinderGeometry(0.029, 0.020, 0.20, 14), SKIN);
  wrist.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), aAxis);
  wrist.position.set(0.024, 0.012, -0.024).add(aAxis.clone().multiplyScalar(0.10));   // its near cap sits inside the heel, so the taper starts as skin and no flat cut shows
  wrist.castShadow = false; g.add(wrist);
  const cuff = new THREE.Mesh(new THREE.CylinderGeometry(0.031, 0.031, 0.20, 16), CUFF);
  cuff.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), aAxis);
  cuff.position.set(0.024, 0.012, -0.024).add(aAxis.clone().multiplyScalar(0.12));   // wider than the forearm at every t it covers, so the sleeve swallows the arm and only its opening edge reads
  cuff.castShadow = false; g.add(cuff);
  return g;
}

/* ══ THE PART IN YOUR HAND — §73's Part rung ══════════════════════════════
   The brief asks for "the housing in your hand, rotatable, with the bore

   machine and sitting on a shelf. Both are places you look AT it. Neither is
   holding it.

   at arm's length. A second render pass and an inset viewport would be a picture
   OF a part; this is the part, at the size the kernel says it is, in front of
   the eye that is already there.

   the reason the mode is legible: while you are holding a part the mouse turns
   the PART instead of the world, and you cannot operate the machine. A machinist
   holding a housing does not walk around looking at things.

   be this build telling a lie with geometry. */

   here and nowhere else. The header printed `rack 1 of 4` from the raw rack
   while the log's newest line printed `The rack is empty` from the same list
   minus the part in hand — one fact, two derivations, disagreeing in a single
   frame, and a cold viewer read the shop contradicting itself. The floor, the
   rack, the slot a finished part lands in, the header and the recorder all read
   this. The log does not: it prints what happened, not how many there are, so
   the count reaches the screen once — in the header, where it is current. */
const onShelf = () => G.rackParts(GAME).filter((p) => p.id !== HELD);
let HELD_MESH = null, heldSpin = 0, heldTilt = 0.35;
const HELD_SCALE_TO_VIEW = 0.0016;   // mm -> world units at arm's length

function buildHeldMesh(dia_mm, depth_mm) {
  const rO = (G.HOUSING_OD_MM / 2) * HELD_SCALE_TO_VIEW, rI = (dia_mm / 2) * HELD_SCALE_TO_VIEW;
  const dep = depth_mm * HELD_SCALE_TO_VIEW;
  const shape = new THREE.Shape(); shape.absarc(0, 0, rO, 0, Math.PI * 2, false);
  const hole = new THREE.Path(); hole.absarc(0, 0, rI, 0, Math.PI * 2, true); shape.holes.push(hole);
  const geo = new THREE.ExtrudeGeometry(shape, { depth: dep, bevelEnabled: false, curveSegments: 48 });
  geo.rotateX(-Math.PI / 2); geo.translate(0, dep, 0); geo.center();
  const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
    /* THE THIRD TIME ON THIS ONE MATERIAL, so it is written down properly: at
       metalness 0.86 with the shop's dark roof overhead this part rendered as a
       BLACK RING in the hand — the exact trap `toolSteel` documents. Held up in
       your hand it is the brightest object in the frame, and it is bright
       because of its albedo, not because it is a mirror. */
    color: 0x9aa3ab, roughness: 0.42, metalness: 0.42 }));

}
/** Take the part off the rack and put it in your hands. */
/* ══ THE HAND ═════════════════════════════════════════════════════════════
   A cold viewer, shown the held-part still: "there is no hand. The part is
   floating in mid-air in front of a rack, and the caption says it is in my
   hands." That was the whole of it. The brief's part rung asks for the part IN
   YOUR HAND, and the build shipped a part with nothing holding it.

   This is a glove and not a hand on purpose. A modelled human hand at this
   poly budget reads as a claw, and a claw is worse than nothing — but a dark
   matte work glove is a SHAPE, it is what a machinist is actually wearing, and
   it puts the part against something instead of against the sky.

   THE SECOND COMPLAINT WAS THE FIRST ONE'S FAULT. A sighted reviewer, ten
   stills of one session: "large silver disc with center hole, black rectangular
   finger blocks clipping through it" — the payoff object of the session reading
   as a flat washer. Measured off the still: four near-black boxes 40 px wide
   covered 234 of the disc's 306 px across the whole thickness band, so the OD
   wall — the one thing on screen that says housing and not washer — showed only
   in the gaps between them. The blocks were not clipping; they were in front.
   But a part with its thickness hidden behind your own fingers reads exactly
   like a part with no thickness at all.

   So the fingers are cylinders TANGENT to the OD, not slabs laid across it: a
   capsule of radius rF whose axis sits at rO + rF touches the wall along one
   line and cannot enter the metal however the hand is turned. Each capsule's
   straight flank runs up the visible wall and its rounded tip stops at the
   rim without crossing onto the face. The thumb comes up the near-RIGHT edge,
   where the disc's own silhouette ends near 880 px and the thumb sits just
   outside it — it holds the edge and costs no wall at all. Nothing here is a
   new feature of the part: OD, bore, thickness and one face are all the
   drawing publishes, and this only stops the hand hiding them.

   The whole glove — fingers, thumb, palm, wrist and cuff — is built in the
   PART'S OWN FRAME and posed by `poseHeld()` from the same two numbers as the
   metal, because a hand holding something turns with it. The first wrist hung
   off the glove root with its own pose, and when the hand tilted it stayed
   behind: a grey pipe floating beside the casting, and a cuff black in the
   corner of the frame. From the palm it now drops toward the bottom of the
   frame, mostly hidden by the part it holds.

   THE SKIN IS NOT BLACK. The old glove was 0x1e2228, the darkest thing in the
   frame, which is why fingers read as holes rather than as a hand. 0x242b33
   under the 0.30 lamp lands the lit finger flanks near 68 and the thumb near
   45: under the casting's 101-164, above the floor's 20, and no glove surface
   reads as a void. */
function buildGlove(rO, halfH) {
  const g = new THREE.Group();
  const skin = SKIN;
  const cuff = CUFF;
  const put = (w, h, d, m, x, y, z, into) => {
    const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
    b.position.set(x, y, z); b.castShadow = false; into.add(b); return b;
  };
  /* A capsule is built along +Y, so it is turned onto the axis it is given by an
     explicit basis rather than by an Euler guess — a finger that has to sit on a
     rim is no place to be reasoning about rotation order. */
  const cap = (r, len, m, at, axis, into) => {
    const c = new THREE.Mesh(new THREE.CapsuleGeometry(r, len, 6, 18), m);
    const yv = new THREE.Vector3(axis[0], axis[1], axis[2]).normalize();
    const ref = Math.abs(yv.y) > 0.9 ? new THREE.Vector3(1, 0, 0) : new THREE.Vector3(0, 1, 0);
    const xv = new THREE.Vector3().crossVectors(ref, yv).normalize();
    const zv = new THREE.Vector3().crossVectors(xv, yv).normalize();
    c.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(xv, yv, zv));
    c.position.set(at[0], at[1], at[2]);
    c.castShadow = false; into.add(c); return c;
  };
  /* ── THE HAND, in the part's own frame ────────────────────────────────────
     Local +Y is the part's axis, its OD is rO, its faces are at ±halfH. Every
     number below comes off those two, so the fingers are cut to the casting
     they are actually holding and not to a remembered size — the four jobs are
     not the same part and their thicknesses differ by 3:1. */
  const hand = new THREE.Group();
  g.add(hand); g.userData.hand = hand;
  const rF = 0.0095, rT = 0.013;             // finger and thumb radius
  const rc = rO + rF, rt = rO + rT;          // axes one radius out: tangent, never inside
  const yB = -halfH - 0.060;                 // they end inside the palm, where nothing shows
  put(0.130, 0.024, 0.095, skin, 0.010, -(halfH + 0.045), 0.060, hand);   // palm, cupped under the part
  put(0.115, 0.022, 0.050, skin, 0.010, -0.058, -0.013, hand);            // the heel of the hand
  /* A grip, not posts beside it: each capsule's straight flank runs up the
     wall to near the top rim, so the glove touches the casting along its
     visible height and the rounded tip curls just over the rim. The tips are
     staggered — pinky shortest, middle longest — because four tips at one
     height read as a railing; the stagger is small enough that even the
     shortest finger's flank still reaches the thinnest job's lower face. */
  const drops = [0.009, 0.003, 0.0, 0.005];  // pinky, ring, middle, index
  [-0.0465, -0.0155, 0.0155, 0.0465].forEach((x, i) => {
    const top = halfH - drops[i];
    cap(rF, (top - yB) - 2 * rF, skin, [x, (top + yB) / 2, Math.sqrt(rc * rc - x * x)], [0, 1, 0], hand);
  });
  /* The thumb comes up the near-right edge and stops at the rim, where the
     disc's own silhouette has already ended: it holds the edge and costs no
     wall. No pad over the face — the first pad read as a blemish on the
     casting, and the hand needs nothing on the metal to read as a hand. */
  const pt = 1.30, ut = [Math.sin(pt), 0, Math.cos(pt)];
  cap(rT, (halfH - yB) - 2 * rT, skin, [ut[0] * rt, (halfH + yB) / 2, ut[2] * rt], [0, 1, 0], hand);
  /* The forearm belongs to the same frame as the hand it serves: the first
     version hung it off the glove root with its own pose, and when the hand
     tilted it stayed behind — a grey pipe floating beside the casting. From
     the palm it drops toward the bottom of the frame, mostly hidden by the
     part it holds. */
  const wrist = new THREE.Mesh(new THREE.CylinderGeometry(0.034, 0.048, 0.26, 14), skin);
  wrist.position.set(0.030, -halfH - 0.145, 0.052); wrist.rotation.set(0.14, 0, -0.16);
  wrist.castShadow = false; hand.add(wrist);
  const band = new THREE.Mesh(new THREE.CylinderGeometry(0.052, 0.056, 0.050, 14), cuff);
  band.position.set(0.016, -halfH - 0.050, 0.060); band.rotation.set(0.14, 0, -0.16); hand.add(band);
  /* THE PART IS HELD UP, AND A PART HELD UP IS LIT. No new number and no new
     state — the light is the light a person gets by turning the casting toward
     the machine lamp instead of standing in their own shadow. It sits BELOW the
     fingers, not in front of them: at the first position it lit the glove to
     the same value as the casting and the fingers read as part of the part. */
  const lamp = handLamp();
  lamp.position.set(0.02, -0.30, -0.26); g.add(lamp);
  return g;
}
let GLOVE = null;
/* THE PART AND THE HAND SHARE ONE FRAME. heldTilt/heldSpin are one fact about
   where the casting is, and both the metal and the fingers are posed from them
   here — if they were written in two places they would drift apart the first
   time either moved. */
const HELD_AT = [0, -0.03, -0.42];
function poseHeld() {
  if (HELD_MESH) {
    HELD_MESH.position.set(HELD_AT[0], HELD_AT[1], HELD_AT[2]);
    HELD_MESH.rotation.set(heldTilt, heldSpin, 0);
  }
  const hand = GLOVE && GLOVE.userData.hand;
  if (hand) {
    hand.position.set(HELD_AT[0], HELD_AT[1], HELD_AT[2]);
    hand.rotation.set(heldTilt, heldSpin, 0);
  }
}
/* The glove is rebuilt for every part that comes off the rack: its fingers are
   cut to THAT part's OD and thickness, and a cached glove would put a 30 mm
   housing's fingers on an 18 mm one. */
function dropGlove() {
  if (!GLOVE) return;
  camera.remove(GLOVE);
  GLOVE.traverse((o) => {
    if (o.geometry) o.geometry.dispose();
    /* SKIN and CUFF are the calipers' hand's materials too (one derivation of
       one value); a rebuilt glove must not dispose them out from under it. */
    if (o.material && o.material !== SKIN && o.material !== CUFF) o.material.dispose();
  });

}
function takeInHand(partId) {
  const p = GAME.part_register.find((x) => x.id === partId);
  if (!p) return false;
  HELD = partId;
  if (HELD_MESH) { camera.remove(HELD_MESH); HELD_MESH.geometry.dispose(); }
  /* THE SIZE IT ACTUALLY IS. `position_in_band_um` records where the part landed
     against nominal, so the bore drawn here is the bore the CUSTOMER will measure
     — not the dial, not the gauge, and not a plausible-looking number. */
  const dia = GAME.job.nominal_mm + ((p.position_in_band_um ?? 0) / 1000);
  HELD_MESH = buildHeldMesh(dia, GAME.job.bore_depth_mm);
  camera.add(HELD_MESH);

    (GAME.job.bore_depth_mm * HELD_SCALE_TO_VIEW) / 2);

     bearing housing, Ø39.9403 mm through the bore" — and a cold viewer stopped:
     the drawing says Ø40 and the hand says Ø39.9403, so which is it. It is both
     (a Ø40 housing whose bore came out small), but the sentence has to say so,
     because the number in the hand is the failure, not the name. */
  const offUm = (dia - GAME.job.nominal_mm) * 1000;
  say('You', `<b>${partId}</b> — a Ø${GAME.job.nominal_mm} bearing housing, ` +
    `bore came out ${Math.abs(offUm).toFixed(1)} µm ${offUm < 0 ? 'small' : 'large'} on the diameter ` +
    `(Ø${dia.toFixed(4)} mm). Turn your hand to look at it; ` +
    `<b>E</b> again to put it back on the rack.`);
  /* THE LOG PRINTS EVENTS AND MEASUREMENTS, NEVER A COUNT OF STATE. The header's
     count reads `onShelf` and is current every frame; a count printed here is a
     snapshot that stays on screen after the next act makes it false. A cold
     viewer read `rack 0 of 4` in the header, `Rack: 1 of 4 slots used` from a
     look four acts back and `The rack is empty` from this line as three versions
     of one number — two of them stale, none of them wrong, and the frame read as
     a shop that cannot count its own parts. */
  logLine(`Picked up <b>${partId}</b>. The bore is Ø${dia.toFixed(4)} mm.`);
  return true;
}
function putDown() {

  dropGlove();
  syncFloor();
  say('You', `<b>${id}</b> back on the rack.`);
