let biteCmd_um = 0, stickout = 45;

/* ── ROUGHING IS A DECISION, NOT A BUTTON (round 2) ─────────────────────────
 * `DIALS` above is the FINISHING dial — small, fine, one-directional, and it
 * stays exactly as it was because the mechanic it carries (a commanded number
 * that is never what comes off) is the one the round measures. Roughing has a
 * different job: it exists to shift metal, and the bites that matter there are
 * whole millimetres. Reaching 4 mm with the 400 µm dial would need ten presses
 * and would tell the player nothing about load.
 *
 * So roughing gets its own bite ladder, and a feed. The feed is the interesting
 * one: measured on J2, bite 4 mm at 0.12 mm/rev draws 43 % of spindle power and
 * at 0.30 mm/rev is REFUSED at 107 %. Same dial, refusal decided entirely by
 * feed — which is the true statement about this physics (MRR = b·h·vc) and it
 * is already in the kernel. Nothing tells the player that. They find it by
 * having a move turned down. */
/* How much metal roughing deliberately leaves on the RADIUS for the finish
   pass, in µm. 40 µm is a real allowance on a 16 µm-wide IT6 band: it is far
   more than the thermal drift and the surplus combined, so the finish pass is
   always a genuine decision and never a formality. See the note in `doRough`
   for why this replaced a fixed 8 µm offset. */
const FINISH_ALLOWANCE_UM = 40;
const ROUGH_BITES_MM = [0.1, 0.2, 0.3, 0.5, 1.0, 2.0, 3.0, 4.0];
const ROUGH_FEEDS_MM_REV = [0.08, 0.12, 0.20, 0.30, 0.50];
let roughBite_mm = 0.3;      /* the old hard-wired value, kept as the default */
let roughFeed_mm_rev = 0.12; /* ditto */

/* ── THE PREDICTION ─────────────────────────────────────────────────────────
 * Design-lead ruling (2026-09-11): "Make the player expose their current model
 * before the machine gives them the answer." The game refuses to perform the
 * inference for the player — it collects every observation and stops.
 *
 * Shift+1..6 states what you EXPECT the dial to actually remove, in µm, before
 * the cut. From pass one, because "their first prediction is valuable precisely
 * because it records their naive model." A cut with no prediction recorded is
 * refused here rather than silently defaulted, because a default of 0 would
 * manufacture a revision moment the player never had.
 *
 * The historical causal-chain line (dial → removed → surplus) is untouched:
 * "Keep the existing historical causal-chain lines because they are excellent
 * evidence." What is gone is the interpretation. No "Notice that…", no
 * "Therefore…", no statement of the rule. */
const PREDICTIONS = [10, 20, 50, 100, 200, 400];
/* The FINISHING dial — small, fine, one-directional. Kept as its own ladder
   even though it looks like PREDICTIONS, because one is a COMMAND to the
   machine and the other is the player's stated BELIEF about what that command
   will do, and the whole point is that they are allowed to disagree. */
const DIALS = [10, 20, 50, 100, 200, 400];
let predicted_um = null;
const MACHINE_NEAR = new THREE.Vector3(0, 1.6, -7);

function handleMachineKeys(e) {
  const atMachine = eye.distanceTo(MACHINE_NEAR) < 4.2;
  if (!atMachine && !CARRIED.calipers) return;
  const d = 'Digit1 Digit2 Digit3 Digit4 Digit5 Digit6'.split(' ');
  const i = d.indexOf(e.code);

  /* The prediction is a DIFFERENT number from the dial (the whole point is that
     they disagree), so it gets a different key. Shift+1..6. */
  if (i >= 0 && e.shiftKey) { setPrediction(PREDICTIONS[i]); return; }
  if (e.code === 'Digit0' && e.shiftKey) { setPrediction(0); return; }

  if (i >= 0) { biteCmd_um = DIALS[i]; if (REC) REC.action('set_dial', { dial_um: biteCmd_um, key: e.code, clock_min: GAME ? GAME.clock_min : null }); toast(`Dial set to <b>${biteCmd_um} µm</b> on the radius.`, 1800); return; }
  if (e.code === 'Digit0') { biteCmd_um = 0; if (REC) REC.action('set_dial', { dial_um: 0, key: 'Digit0' }); return; }
  if (e.code === 'KeyC') doCut();
  if (e.code === 'KeyM') doMeasure();
  if (e.code === 'KeyT') doTouchOff();
  if (e.code === 'KeyW') return;  // W is also walk-forward; warm-up is Shift+W via panel
  if (e.code === 'KeyV') doWarmUp();
  if (e.code === 'Enter') doInspect();
  /* F is "fetch a casting" — the only verb that can undo a dead part, and it
     costs a real walk, real setup minutes and the stock itself. */
  if (e.code === 'KeyF') doFetchBlank();
  if (e.code === 'KeyR') doRough();
  /* Round 2 roughing controls. `[`/`]` = bite, `-`/`=` = feed. Bound only at
     the machine, like every other machining verb — a feed change made from
     across the shop floor would be a keystroke with no meaning. */
  if (e.code === 'BracketLeft') stepRoughBite(-1);
  if (e.code === 'BracketRight') stepRoughBite(1);
  if (e.code === 'Minus') stepRoughFeed(-1);
  if (e.code === 'Equal') stepRoughFeed(1);
}

function setPrediction(um) {
  predicted_um = um;
  if (REC) REC.action('predict', { predicted_um: um, dial_um: biteCmd_um,
    pass_index: GAME ? GAME.history.length : 0, clock_min: GAME ? GAME.clock_min : null });
  toast(`You expect the dial to remove <b>${um} µm</b>. Take the cut.`, 2200);
}


function machinePanel() {
  const atMachine = eye.distanceTo(MACHINE_NEAR) < 4.2;
  const pn = $('panel');
  pn.classList.toggle('on', atMachine);
  if (!atMachine) return;
  const m = GAME.machine, last = GAME.history[GAME.history.length - 1];
  const bore = W.boreGeometry(GAME, G.partGrowth_um);
  $('pnTitle').textContent = GAME.mach.label;
  const F = (a, b) => `<div class="row"><i>${a}</i><span>${b}</span></div>`;
  $('pnRows').innerHTML =
    /* RPM AND THE SURFACE SPEED IT PRODUCES. A machinist reads both, and the
       pair is the honest picture: the same rpm is a different cutting speed on
       a different bore, which is why the speed is measured on the BORE and not
       on the bar. See the note in `boringStep`. */
    F('spindle', m.spindle_on
      ? (last ? `${last.n_rpm.toFixed(0)} rpm · ${last.vc_m_min.toFixed(0)} m/min` : 'running')
      : 'stopped') +
    F('load', m.spindle_on && last ? `${(last.power_kW / GAME.mach.power_max_kW * 100).toFixed(0)}% of 7.5 kW` : '—') +
    F('spindle °C', `${m.spindleC.toFixed(1)} (ref ${m.refSpindleC.toFixed(1)})`) +
    F('screw °C', `${m.screwC.toFixed(1)}`) +
    F('part °C', `${GAME.part.partC.toFixed(1)}`) +
    F('tool', GAME.toolSpec ? `${GAME.toolSpec.label} · ${stickout} mm out` : '<i>none loaded</i>') +
    F('passes', `${bore.passes}`) +
    /* THE MACHINE'S OWN CONDITION, on the machine. It is the number that makes
       the tooling book below either right or wrong, so it has to be somewhere a
       player can see it without opening anything. */
    F('machine', `${GAME.machine.condition.toFixed(0)} of 1000 · ` +
      `TIR ${G.runout_um_for(GAME.machine.condition).toFixed(1)} µm`) +
    /* WHAT THE SPINDLE IS SET TO, which is a decision the operator makes and
       not a reading of what the last cut did. The row above reports the rpm and
       surface speed the last pass actually ran at; this one is the setting. */
    F('speed set', `${GAME.machine.vc_m_min} m/min <i>(pendant SPD \u2212 / +)</i>`) +
    F('stock', `${((GAME.part.holeDia_cold_mm - 0) / 2).toFixed(2)} mm radius · ` +
      `to band top ${bore.stock_to_band_um.toFixed(0)} µm`);
  const surplus = last ? (last.bite_realised_um - last.bite_cmd_um) : 0;
  $('pnCut').innerHTML =
    F('dial', `${biteCmd_um} µm radius`) +
    F('you expect', predicted_um === null
      /* THE INSTRUCTION NAMES THE WORLD, NOT A KEY. The pendant replaced the
         on-screen legend, so any text that still taught Shift+1-6 would be
         teaching a control scheme the game no longer shows. The keys still
         work — a machinist who knows them should not be slowed down — but the
         thing the game POINTS AT is the machine in front of you. */
      ? '<i>not stated — the pendant\u2019s <b>PRED</b> keys</i>'
      : `${predicted_um} µm`) +
    (last ? F('last realised', `${last.bite_realised_um.toFixed(1)} µm <i>(${surplus >= 0 ? '+' : ''}${surplus.toFixed(1)} vs dial)</i>`) : '') +
    /* THE LEGEND IS GONE. It was three rows of `kbd` tags teaching a control
       scheme, which is the one thing §48 forbids outright — and the build's own
       gate report counted it as its largest remaining debt. The controls are on
       the machine now, and this panel is its readout. */
    `<div class="row" style="margin-top:6px"><i>Controls are on the pendant — ` +
      `point at a key and press <kbd>E</kbd>.</i></div>`;
  /* The instrument, refreshed on every panel tick. It reads the CURRENT
     roughing setting, so stepping the feed with `=` moves the bars before the
     cut rather than after the refusal. */
  const lm = $('pnLoad');
  if (lm) lm.innerHTML = loadMeterHTML();
  /* ── THE BUDGET ────────────────────────────────────────────────────────
     Signed micrometres by cause, from the last pass that cut metal. This is
     the build's own headline claim — "the interesting number is why the part
     is wrong" — and it belongs on the machine, not in a report. Terms under a
     twentieth of a micron are dropped because the panel is a readout and not a
     transcript, and the reader needs the ones that matter. */
  const pb = $('pnBudget');
  if (pb) {
    const lastCut = GAME.history[GAME.history.length - 1];
    if (lastCut && lastCut.err_terms) {
      const terms = lastCut.err_terms.filter((t) => Math.abs(t.um) >= 0.05);
      pb.innerHTML = `<div class="row" style="margin-top:6px"><i>why the bore is wrong</i><span></span></div>` +
        terms.map((t) => `<div class="row"><i>${String(t.name).replace(/\s*\(.*\)$/, '')}</i>` +
          `<span>${t.um >= 0 ? '+' : ''}${t.um.toFixed(1)} µm</span></div>`).join('') +
        `<div class="row"><i><b>total</b></i><span><b>${lastCut.err_terms.reduce((a, t) => a + t.um, 0).toFixed(1)} µm</b></span></div>`;
    } else { pb.innerHTML = ''; }
  }
}

/* ── THE VERBS — every number from the kernel, none from here ───────────── */
/* OPERATION TIME. The kernel self-reports the clock cost of what you do —
   a measurement costs half a minute, a 20-minute spindle run costs 20. Under
   the two-clock design that cost is REAL, so it is accumulated here and the
   kernel's own wall-clock advance is discarded (else it is counted twice).
   NOTE: GAME is the STATE object; the functions live on the module G. */
let opMin = 0;
/* ROUND 9. The lowest minute the job clock is allowed to be at. State changes
   in the game layer (fetching a casting, a re-setup) cost REAL minutes, and
   those costs are applied to `GAME.clock_min` inside game.mjs — where they can
   be unit-tested — rather than here. The frame loop recomputes the clock from
   `clocks.job_min + opMin` every tick, so without this floor it would hand
   every one of those minutes straight back on the next frame. */
let clockFloorMin = 0;
function kernelJob(fn, ...args) {
  const before = GAME.clock_min;
  const out = fn(GAME, ...args);
  const consumed = GAME.clock_min - before;
  GAME.clock_min = before;
  if (consumed > 0) { opMin += consumed; GAME.clock_min = clocks.job_min + opMin; }
  return out;
}
function needCalipers() {
  if (CARRIED.calipers) return true;
  if (REC) REC.refusal('measure', 'NO_CALIPERS', { clock_min: GAME.clock_min });
  say('You', 'Nothing to measure with. The calipers are on the bench by the machine.');
  return false;
}
function doMeasure() {
  if (!needCalipers()) return;
  SEEN.measured = true;
  if (phase === 'ARRIVE') phase = 'MEASURE';
  const r = kernelJob(G.measure, { samples: 3, seed: 7 });
  lastRead = { mm: r.reading_mm, sigma_um: r.sigma_um, partC: r.partC,
               at_min: GAME.clock_min, coldDia_at_measure: r.coldDia_mm };
  if (REC) REC.measurement({
    reading_mm: r.reading_mm, sigma_um: r.sigma_um, hotDia_mm: r.hotDia_mm,
    coldDia_mm: r.coldDia_mm, partC: r.partC, job: GAME.job,
    seq_index: GAME.shots, clock_min: GAME.clock_min,
    tool: GAME.tool ? GAME.tool.label : null,
  });
  const bore = W.boreGeometry(GAME, G.partGrowth_um);
  const off = r.reading_mm - GAME.job.nominal_mm;
  logLine(`Gauge says <b>Ø${r.reading_mm.toFixed(4)}</b> mm at ${r.partC.toFixed(1)} °C ` +
    `(±${r.sigma_um.toFixed(2)} µm) — ${(off * 1000).toFixed(0)} µm from nominal. ` +
    `<b>${bore.stock_to_band_um.toFixed(0)} µm</b> of radius left under the top of the band.`);
  if (!earlSaid.corrected && Math.abs(off) > 2) {
    earlSaid.corrected = true; SEEN.corrected = true;
    setTimeout(() => say('Earl', "\u201cYou're measuring the bell-mouth. Back the thumbwheel " +
      "off, feel it touch, then read it. Don't squeeze the jaws.\u201d"), 2400);
  }
}
function doTouchOff() {
  const g = GAME;
  if (!g.tool) { if (REC) REC.refusal('touch_off', 'NO_TOOL', { clock_min: g.clock_min }); return say('You', 'No bar in the spindle.'); }
  /* the datum is set ONCE, in the cold frame, and never re-referenced */
  if (g.machine.edgeR_cold_mm === null) {
    g.machine.edgeR_cold_mm = g.part.holeDia_cold_mm / 2;
    GAME.machine.refSpindleC = g.machine.spindleC;
    GAME.machine.refScrewC = g.machine.screwC;
    if (REC) REC.action('touch_off', { clock_min: g.clock_min, first: true,
      coldDia_mm: g.part.holeDia_cold_mm });
    logLine('<b>Touch-off.</b> Dial zeroed on the wall as it stands. Every number from ' +
      'here is relative to this datum.');
    say('You', 'The bar just kissed the wall. Dial is zero here.');
  } else { if (REC) REC.action('touch_off', { clock_min: g.clock_min, first: false }); toast('Already touched off.', 1600); }
}
function doWarmUp() {
  const g = GAME;
  if (g.machine.spindle_on) { if (REC) REC.refusal('warm_up', 'ALREADY_RUNNING', { clock_min: g.clock_min }); return toast('Already running.', 1600); }
  const b4 = { s: g.machine.spindleC, r: g.machine.screwC, p: g.part.partC };
  kernelJob(G.warmUp, 20);
  g.machine.spindle_on = true;
  if (REC) REC.action('warm_up', { clock_min: g.clock_min, minutes: 20,
    spindleC_before: b4.s, spindleC_after: g.machine.spindleC,
    screwC_before: b4.r, screwC_after: g.machine.screwC,
    partC_before: b4.p, partC_after: g.part.partC,
    edgeOffset_um: G.edgeOffset_um(g) });
  logLine(`Spindle run <b>20 min</b>. Spindle ${b4.s.toFixed(1)} → ${g.machine.spindleC.toFixed(1)} °C, ` +
    `part ${b4.p.toFixed(1)} → ${g.part.partC.toFixed(1)} °C. ` +
    `Thermal edge offset now <b>${G.edgeOffset_um(g).toFixed(1)} µm</b>.`);
  if (!earlSaid.warm) { earlSaid.warm = true;
    setTimeout(() => say('Earl', "\u201cHe\u2019s got you warming spindles now. " +
      "Just don\u2019t stand there watching it, it\u2019ll take twenty minutes either way.\u201d"), 2000); }
}
/* ── THE PUSHBACK, SAID IN NUMBERS ──────────────────────────────────────────
 * A refusal that says only "no" is a slot machine. This says WHAT wall, HOW
 * FAR past it, and WHAT the machine already managed — three facts, no rule.
 *
 * It deliberately does NOT compute the largest bite that would fit. Working
 * backwards from the wall to the answer is the inference the player is here to
 * make, and handing it over would replace the round's mechanic with arithmetic
 * the game did for them. It reports the load on the move that was ASKED for,
 * which is what a load meter does, and stops. */
function refusalText(bite, feed, env, why, did_um, extra_min = 0) {
  const blade = `bite <b>${bite.toFixed(2)} mm</b> at feed <b>${feed.toFixed(2)} mm/rev</b>`;
  let head;
  if (why === 'SPINDLE POWER LIMIT') head = '<b>Not enough spindle.</b>';
  else if (why === 'TORQUE LIMIT') head = '<b>Not enough torque.</b>';
  else if (why === 'CHATTER') head = '<b>It would sing.</b>';
  else if (why === 'SPINDLE SPEED LIMIT') head = '<b>Out of rpm.</b>';
  else if (why === 'NO STOCK') head = '<b>Nothing there to cut.</b>';
  else if (why === 'RUBBING') head = '<b>Rubbing, not cutting.</b>';
  else head = `<b>Refused: ${why}.</b>`;
  /* ── WHAT A REFUSAL IS ALLOWED TO SAY ─────────────────────────────────
     It says WHICH limit stopped it. It does NOT say how far past the limit
     the command was, because that number — "wants 159 % of spindle power" —
     is the exact free oracle this round removes: it told the player precisely
     where the wall was, for any hypothetical, at no cost, without ever making
     a cut. The wall is still findable; it is found by cutting, which is the
     mechanic. The reason it is refused is still named, because a machinist
     who trips an interlock can see which lamp lit. */
  const cost = extra_min > 0
    ? `<br><span style="color:#e05a4e">Asking again cost ${extra_min} min on the drive.</span>`
    : '<br><span style="color:#8b98a6">First time, so no time lost. Try a different setting.</span>';
  toast(`${head} ${blade} — ${why.toLowerCase()}.${cost}`, 7000);
  logLine(`Roughing refused: <b>${why}</b> on ${blade}.` +
    (extra_min > 0 ? ` <b>${extra_min} min</b> lost to the drive.` : ''));
}

/* ── THE LOAD METER, AND THE ONE ROUND 9 CHANGE TO WHAT IT WILL ANSWER ──────
 * WHY THIS EXISTS, GIVEN ROUND 1'S RULE ABOUT NOT SHOWING NUMBERS. The
 * difference is that this is not a measurement of the PART — it is a
 * measurement of the MACHINE, and a machinist without a load meter is not being
 * asked to infer anything, he is being asked to guess. Every machine in the
 * shop has one and the operator glances at it constantly. It also cannot leak
 * the round-1 secret: that one is a diameter, and nothing here is derived from
 * the true bore or from the surplus.
 *
 * ── WHAT CHANGED, AND WHY THE OLD GATE IS GONE ────────────────────────────
 * Round 8 measured an INFORMATIONAL EXPLOIT, and the design lead's ruling on
 * it is the reason this function is now shaped the way it is:
 *
 *   "Don't solve free refusal by attaching an arbitrary penalty just because
 *    spam is bad... if it is an interlock rejecting an impossible command
 *    before motion, then zero metal and perhaps essentially zero machine
 *    consequence may actually be correct. In that case the problem is not
 *    physics; it is that the player receives unlimited high-quality
 *    information for free. Solve THAT informational exploit."
 *
 * That is exactly what was happening. `envelope()` is a pure function of the
 * COMMANDED bite, so this meter answered any hypothetical for free, instantly,
 * and exactly — an unlimited oracle that told the player which side of the
 * wall a move was on without ever making it. The refusal itself was fine. The
 * oracle was not.
 *
 * A REAL INTERLOCK IS A HARDWARE LIMIT. An axis drive does not answer an
 * interrogative; it feeds back and it faults. So:
 *
 *   • With no cut on record for a setting, the meter shows the CERTIFIED
 *     RANGE of the setting itself — the bite and feed the shop says the
 *     machine will take — and NOTHING about what that move would draw. That
 *     is a specification plate, which every machine really has, and it is the
 *     genuinely free information. It cannot be interrogated for an answer to
 *     "will THIS move be refused", because it does not know what this move is.
 *   • UNTIL THE PLAYER HAS COMMITTED, the bars for an untried setting show
 *     the move that was ACTUALLY MADE most recently at that setting, or read
 *     `—` if there is none. The meter reports; it does not predict.
 *   • Attempting a refused move is FREE the first time, because a machinist
 *     who trips an interlock once has learned something real and should not be
 *     charged for it. Doing it AGAIN costs a minute on the drive, each time —
 *     which is a real cost to a clock the courier is watching, and it is
 *     charged in TIME, not in invented machine damage. Nothing here claims a
 *     servo was harmed. See `refusalMinutes()` in people.mjs.
 *
 * THE NET EFFECT: the wall can still be found, and it is still found by
 * cutting — which is the mechanic this game is named for. What is gone is the
 * free, exact, unlimited answer to a question the player was never willing to
 * act on.
 */
function loadMeterHTML() {
  if (!GAME || !GAME.tool) return '';
  const key = `${roughBite_mm.toFixed(2)}/${roughFeed_mm_rev.toFixed(2)}`;
  const tried = DRIVE_TRIED[key];
  /* NOT YET TRIED — or asked for and REFUSED, which is the same thing to this
     meter. `tried.last` is null whenever the drive has answered a setting only
     with a refusal (see `noteDriveAttempt`: a refused move records trouble, and
     deliberately no load). Guarding on `tried` alone therefore crashed the page
     the moment a player tried an impossible setting and then stepped back onto
     it: `tried` was truthy, `last` was null, and reading `power_frac` off null
     took the whole frame loop down. A refused setting must fall through to the
     plate exactly as an untried one does — that is not a nicety, it is the
     whole point of not inventing a reading. */
  if (!tried || !tried.last) {
    /* The specification PLATE. These are ratings off the machine's own data,
       not a computation about the move you are asking for, so showing them
       leaks nothing the operator could not read off the door. */
    const m = GAME.mach;
    const plate = m
      ? `Machine rated ${m.power_max_kW.toFixed(1)} kW / ${m.rated_torque_Nm.toFixed(0)} N·m ` +
        `to ${m.n_max} rpm — no cut recorded at this setting.`
      : 'No cut recorded at this setting.';
    const bar = (label) => `<div class="lm"><i>${label}</i>` +
      `<span class="lmt"><b style="width:0%"></b></span><em>—</em></div>`;
    return bar('power') + bar('torque') + bar('rpm') + bar('chatter') +
      `<div class="lmsub">bite ${roughBite_mm.toFixed(2)} feed ${roughFeed_mm_rev.toFixed(2)}<br>${plate}</div>`;
  }
  /* TRIED: the meter reports the last REAL cut at this setting. */
  const bar = (label, frac) => {
    const p = Math.max(0, Math.min(1, frac)) * 100;
    const over = frac > 1;
    return `<div class="lm"><i>${label}</i>` +
      `<span class="lmt"><b style="width:${p.toFixed(0)}%;background:${over ? '#c8452f' : frac > 0.85 ? '#c8962f' : '#69a84f'}"></b></span>` +
      `<em${over ? ' class="over"' : ''}>${(frac * 100).toFixed(0)}%</em></div>`;
  };
  const t = tried.last;
  return bar('power', t.power_frac) + bar('torque', t.torque_frac) +
    bar('rpm', t.rpm_frac) + bar('chatter', t.chatter_frac) +
    `<div class="lmsub">${t.F_mean_N.toFixed(0)} N · sag ${t.sag_um.toFixed(1)} µm · ` +
    `${t.cut_min.toFixed(2)} min/pass<br>` +
    `<span style="opacity:.7">bite ${roughBite_mm.toFixed(2)} feed ${roughFeed_mm_rev.toFixed(2)} — ` +
    `${tried.n} attempt${tried.n === 1 ? '' : 's'}${tried.refused && tried.refused_n ? `, ${tried.refused_n} refused` : ''}</span></div>`;
}

/* WHAT THE DRIVE HAS ACTUALLY BEEN ASKED. Keyed by setting, because that is
   the only way "has this move been tried" is a question with one answer. A
   REFUSED attempt records the drive's trouble, never a load — there was no
   cut, so there is no reading, and inventing one here is exactly the
   manufactured mechanic the design lead rejected. */
const DRIVE_TRIED = {};
function noteDriveAttempt(bite, feed, env, refused) {
  const key = `${bite.toFixed(2)}/${feed.toFixed(2)}`;
  const e = DRIVE_TRIED[key] || (DRIVE_TRIED[key] = { n: 0, refused_n: 0, refused: false, last: null });
  e.n += 1;
  if (refused) { e.refused = true; e.refused_n += 1; }
  /* A READING IS ONLY EVER A CUT THAT HAPPENED.
     `env.ok` is NOT the test, and believing it was is what leaked a full load
     reading — `power 159% torque 119% 4757 N` — for a 4 mm bite at 0.5 mm/rev
     that the machine had just REFUSED. `envelope()` returns `ok:true` for every
     well-formed question it can compute an answer to, including impossible
     ones, because `ok` there means "I understood the question", not "the
     machine will do it". The field that means the latter is `would_cut`, and it
     is set from the same `assessBoring` call that the refusal itself comes
     from, so the two cannot disagree.

     This is the difference between a load meter and an oracle. A meter reads a
     cut; an oracle answers hypotheticals. Handing the player `power_frac` and
     `F_mean_N` for a move they have not made is the whole informational exploit
     the design lead ruled against — you would never need to risk a cut again,
     you would just dial until the preview said 99 %. */
  if (env && env.would_cut && !refused) e.last = env;
  return e;
}
function refreshLoadMeter() {
  const el = document.querySelector('[data-lmhost]');
  if (el) el.innerHTML = loadMeterHTML();
}

/* ── ROUGHING CONTROLS ──────────────────────────────────────────────────────
 * Keys, not a mouse: the machine is already keyboard-driven and a panel that
 * needed a cursor would break the one-handed work rhythm the other verbs are
 * built around. `[`/`]` step the bite, `-`/`=` step the feed. Both write a
 * recorder action, because a player who learns the wall by being refused at one
 * feed and accepted at another has produced this round's most valuable
 * evidence, and it has to survive into the session file. */
function stepRoughBite(dir) {
  const i = ROUGH_BITES_MM.indexOf(roughBite_mm);
  const n = Math.max(0, Math.min(ROUGH_BITES_MM.length - 1, (i < 0 ? 2 : i) + dir));
  roughBite_mm = ROUGH_BITES_MM[n];
  if (REC) REC.action('set_rough', { bite_mm: roughBite_mm, feed_mm_rev: roughFeed_mm_rev,
    clock_min: GAME ? GAME.clock_min : null });
  toast(`Roughing bite <b>${roughBite_mm.toFixed(2)} mm</b>` +
    (roughBite_mm >= 2 ? ' — that is a serious cut.' : '.'), 1800);
  refreshLoadMeter();
}
function stepRoughFeed(dir) {
  const i = ROUGH_FEEDS_MM_REV.indexOf(roughFeed_mm_rev);
  const n = Math.max(0, Math.min(ROUGH_FEEDS_MM_REV.length - 1, (i < 0 ? 1 : i) + dir));
  roughFeed_mm_rev = ROUGH_FEEDS_MM_REV[n];
  if (REC) REC.action('set_rough', { bite_mm: roughBite_mm, feed_mm_rev: roughFeed_mm_rev,
    clock_min: GAME ? GAME.clock_min : null });
  toast(`Roughing feed <b>${roughFeed_mm_rev.toFixed(2)} mm/rev</b>`, 1800);
  refreshLoadMeter();
}

function doRough() {
  const g = GAME;
  if (!g.tool) { if (REC) REC.refusal('rough', 'NO_TOOL', { clock_min: g.clock_min }); return say('You', 'Load a bar first — they\u2019re on the board.'); }
  g.machine.spindle_on = true;
  if (g.machine.edgeR_cold_mm === null) doTouchOff();
  /* ── LEAVE A REAL ALLOWANCE. "REAL" IS THE WHOLE WORD. ────────────────────
     This used to be `band_high_mm - 0.008`, which LOOKS like an allowance and
     is not one. The realised bite runs hot by the surplus — that is the
     mechanic — so a 0.25 mm roughing pass removes measurably more than it
     commands, and the run sailed 3.4 µm PAST its own target and straight into
     the band. The measured consequence: roughing finished the part, the
     finish pass was skipped, and J1 was ACCEPTED without the player ever
     making the one decision the round measures. A roughing routine that
     silently completes the job is the same class of lie as a ship that does
     not unmount the part.
     So the allowance is now derived from what the job actually needs: enough
     that the finish pass has something to do, expressed in the units of the
     band the part must land in. `FINISH_ALLOWANCE_UM` is a radius figure, the
     same convention the dial uses, and it is deliberately larger than the
     thermal growth plus the surplus a typical finish pass carries — the part
     is left ROUGHED, which is what roughing is for. */
  const diaBefore = g.part.holeDia_cold_mm;
  /* ── ROUND 2: ROUGHING IS NO LONGER A FIXED MOVE ─────────────────────────
   * On J1 this was hard-wired to 0.3 mm at 0.12 mm/rev and it was the right
   * call: 24 repeats that drew 3 % of the spindle and could never be refused.
   * On a part with real stock in it that same fixed move is a wasted machine —
   * and, worse, the move a player would naturally reach for is NOT this one.
   * So the bite and the feed are now the player's, they are refused when they
   * ask for more than the machine has, and the refusal names which wall it hit.
   * The DEFAULT is unchanged, because a default is not a lesson. */
  const feed = roughFeed_mm_rev;
  const bite = roughBite_mm;
  /* Preview first, so a refusal can be answered with the number that caused it
     rather than a bare "no". `envelope` uses assessBoring — the same function
     the cut refuses on — so the preview and the refusal cannot disagree. */
  const env = G.envelope(g, { bite_mm: bite, feed_mm_rev: feed, vc: g.machine.vc_m_min });
  const roughTarget = g.job.band_high_mm - 2 * (FINISH_ALLOWANCE_UM / 1000);
  const r = kernelJob(G.roughTo, { target_dia_mm: roughTarget,
    bite_mm: bite, feed_mm_rev: feed, vc: g.machine.vc_m_min });
  if (!r || !r.ok || !r.passes.length) {
    /* THE PUSHBACK. A refused roughing pass now says which limit stopped it and
       how far past it the command was, because "the machine said no" teaches
       nothing and "that wants 159 % of spindle power, the wall is 100 %" is a
       number the player can act on. Nothing here states the rule; it reports a
       load meter reading on the move just requested. */
    const why = r && r.why ? r.why : 'NOTHING_TO_ROUGH';
    if (REC) REC.refusal('rough', why,
      { clock_min: g.clock_min, bite_um: bite * 1000, feed_mm_rev: feed,
        detail: r && r.detail ? r.detail : 'roughTo returned no passes',
        pass_index: g.history.length });
    const did = r && r.last ? r.last.bite_realised_um : 0;
    /* ── THE PRICE OF ASKING TWICE ────────────────────────────────────────
       The FIRST trip of an interlock is free, and that is deliberate: it is
       real information, honestly obtained, and charging for it would punish
       a player for exploring. Every REPEAT of the same refused move costs the
       drive a minute, because there is nothing left to learn from it — a
       machinist who asks a machine the same question five times is not
       learning, he is looking for a different answer, and the clock is the
       thing that makes that a decision rather than a free re-roll.
       NOTHING HERE DAMAGES A MACHINE. See `refusalMinutes` in people.mjs and
       the design-lead ruling quoted above the load meter. */
    const drv = noteDriveAttempt(bite, feed, env, true);
    const extra = P.refusalMinutes(drv.refused_n - 1);
    if (extra > 0) {
      g.clock_min += extra;
      g.state_clock_floor = g.clock_min;
      opMin += extra;
      clockFloorMin = Math.max(clockFloorMin, g.clock_min);
      g.drive.refusals += 1; g.drive.trouble_min += extra;
      if (!SEEN.explained) {
        SEEN.explained = true;
        logLine(`<b>The drive is not an oracle.</b> ${P.REFUSAL_WHY}`);
      }
      logLine(`Same move asked again — <b>${extra} min</b> on the drive. ` +
        `The machine still says no, and now it has cost you ` +
        `${g.drive.trouble_min} min of a clock the van is watching.`);
    }
    refusalText(bite, feed, env, why, did, extra);
    /* A refusal is a real thing that happened to this setting, so the meter has
       to be redrawn — but it will redraw to the PLATE, not to a load, because
       `noteDriveAttempt` records no reading for a move that never cut. That is
       the informational exploit being closed and not a display bug. */
    refreshLoadMeter();
    return;
  }
  if (r.truncated) {
    /* Roughing that stops for want of passes must SAY so. A run that quietly
       quits early and reports success is the failure mode this project is
       named after. */
    toast(`Roughing hit the pass limit at Ø${g.part.holeDia_cold_mm.toFixed(3)} — ` +
      `not at the target. Take the rest off.`, 5200);
  }
  if (REC) {
    /* The recorded target is the target the run ACTUALLY used. It used to be a
       re-derived `band_high - 0.008` that no longer matched what `roughTo` was
       asked for — a session file that misreports the player's own command is
       worse than no session file, because it is believed. */
    REC.action('rough', { clock_min: g.clock_min, passes: r.passes.length,
      minutes: r.minutes, target_dia_mm: roughTarget,
      coldDia_before_mm: diaBefore, coldDia_after_mm: g.part.holeDia_cold_mm });
    /* Roughing is REPEATS, so each pass gets its own `cut` row: the surplus
       relationship is only discoverable if every pass is on the record. */
    let dB = diaBefore, prevClock = g.clock_min;
    for (const p of r.passes) {
      REC.cut({ rec: p, coldDia_before_mm: dB, coldDia_after_mm: dB + p.bite_realised_um / 500,
                clock_min: g.clock_min, pass_index: p.n });
      dB += p.bite_realised_um / 500;   // realised is a RADIUS; diameter moves 2x
      prevClock = g.clock_min;
    }
    void prevClock;
    REC.action('rough_done', { clock_min: g.clock_min, dialR_um: r.passes[r.passes.length - 1].edge_coldR_mm * 1000 });
  }
  noteDriveAttempt(bite, feed, env, false);
  /* The cut just happened, so the meter's reading for this setting has just
     changed from "no cut recorded" to a real one. Without this line the plate
     stayed on screen until the player happened to nudge the bite or the feed,
     which made the meter look like it never learned anything — the exact
     opposite of the point. */
  refreshLoadMeter();
  const last = r.passes[r.passes.length - 1];
  chipsFromPass(last, g.mat);
  if (audioReady) { AUD.cutEnter('mine', { tooth_Hz: 60, gain: 0.3 }); AUD.chipFall(1); }
  /* What the DIAL holds — not what the part is. After roughing, the dial offset
     and the true radius have diverged by the accumulated surplus, and that gap
     IS the lesson. Printing the true radius here would destroy it. */
  const dialR_um = last.edge_coldR_mm * 1000;
  const nomR_um = (g.job.nominal_mm / 2) * 1000;
  logLine(`Roughed <b>${r.passes.length} passes</b> in ${r.minutes.toFixed(1)} min. ` +
    `Dial now reads <b>${dialR_um.toFixed(0)} µm</b> radius. ` +
    `Last pass: dial ${last.bite_cmd_um.toFixed(0)} µm, removed ${last.bite_realised_um.toFixed(1)} µm.`);
  toast(`Roughing done. The dial says ${dialR_um.toFixed(0)} µm — <b>that is not the size.</b> ` +
    `It has added the surplus on every pass. Measure, then sneak up on ${nomR_um.toFixed(0)}.`, 5600);
}
function doCut() {
  const g = GAME;
  if (!g.tool) { if (REC) REC.refusal('cut', 'NO_TOOL', { clock_min: g.clock_min, dial_um: biteCmd_um }); say('You', 'The spindle\u2019s empty. Bars are on the board behind you.'); return; }
  if (biteCmd_um <= 0) { if (REC) REC.refusal('cut', 'DIAL_AT_ZERO', { clock_min: g.clock_min, dial_um: biteCmd_um }); toast('Dial is at zero. Pick a cut on 1\u20136.', 2000); return; }
  /* THE PREDICTION GATE. Refused, not defaulted — see the PREDICTION block above. */
  if (predicted_um === null) {
    if (REC) REC.refusal('cut', 'NO_PREDICTION', { clock_min: g.clock_min, dial_um: biteCmd_um });
    toast('<b>How much will it take off?</b> Say what you expect first — ' +
      'the pendant\u2019s <b>PRED \u2212 / PRED +</b> keys — then cut.', 5200);
    return;
  }
  if (g.machine.edgeR_cold_mm === null) doTouchOff();
  const diaBefore = g.part.holeDia_cold_mm;
  const res = kernelJob(G.cutOnce, { bite_mm: biteCmd_um / 1000, feed_mm_rev: 0.12, vc: GAME.machine.vc_m_min, label: 'bored' });
  if (!res.ok) {
    if (REC) REC.cutRefused(res.why, { dial_um: biteCmd_um, clock_min: g.clock_min,
      detail: res.detail || null });
    if (res.why === 'RUBBING') {
      toast('<b>RUBBING.</b> The edge is not engaging — it is dragging on the wall.', 4200);
      say('Earl', "\u201cHear that? That's not cutting. Back it off and take a real bite.\u201d");
      if (audioReady) AUD.setMachine('mine',
        W.cutAcoustics({}, { rubbing: true }), { distance_m: 3, gain: 1 });
    } else if (res.why === 'RUBBING_DANGER' || res.why === 'CHATTER_DANGER') {
      toast(`<b>${res.why.replace('_', ' ')}.</b> Regenerate the job — the insert is done.`, 6000);
    } else toast(`No cut: ${res.why}`, 2600);
    return;
  }
  const rec = res.rec;
  /* The prediction is consumed by the cut that answers it. Recorded before the
     comparison so a crash between the two cannot lose the player's model. */
  const predicted = predicted_um;
  if (REC) REC.action('prediction_result', { predicted_um: predicted, dial_um: rec.bite_cmd_um,
    realised_um: rec.bite_realised_um, pass_index: rec.n, clock_min: g.clock_min });
  predicted_um = null;
  if (REC) REC.cut({ rec, coldDia_before_mm: diaBefore, coldDia_after_mm: g.part.holeDia_cold_mm,
                     clock_min: g.clock_min, pass_index: rec.n });
  const info = chipsFromPass(rec, g.mat);
  g.machine.spindle_on = true;
  if (audioReady) { AUD.cutEnter('mine', { tooth_Hz: 60, gain: 0.3 }); AUD.clack({ gain: 0.4, pitch: 1200 }); }
  const surplus = rec.bite_realised_um - rec.bite_cmd_um;
  logLine(`Pass ${rec.n}: dial <b>${rec.bite_cmd_um.toFixed(0)} µm</b> → removed ` +
    `<b>${rec.bite_realised_um.toFixed(1)} µm</b> (${surplus >= 0 ? '+' : ''}${surplus.toFixed(1)}). ` +
    `Dial is now at ${(rec.edge_coldR_mm * 1000).toFixed(0)} µm radius. ` +
    `Measure it if you want to know where it actually is.`);
  /* THE CHIP'S THICKNESS AND THE DIAL ARE DIFFERENT DIMENSIONS, and this line
     used to invite the reader to compare them: it read "126 µm thick — the dial
     said 1000", which is a comparison between the feed per revolution and the
     radial depth of cut. It was accidentally readable before the chip's
     thickness was corrected (when the "thickness" WAS the bite); now that it is
     the real number the line would teach a false comparison. The surplus lives
     on the WIDTH, so that is what is set against the dial. */
  if (rec.n === 1) toast(`<b>${info.colour_name} chip.</b> ${info.t2_um.toFixed(0)} µm thick. ` +
    `The dial said ${rec.bite_cmd_um.toFixed(0)} µm and it came off ` +
    `<b>${info.width_um.toFixed(0)} µm wide</b>.`, 5200);
  /* ── YOUR PREDICTION AGAINST THE MACHINE ──────────────────────────────────
   * The design lead's exact form: "You expected 20.0 µm. Machine removed
   * 19.2 µm. Difference: −0.8 µm." then STOP. The difference is shown and the
   * game says nothing about it — discovering that the difference is a constant
   * is the player's inference to make, and it is the one the round measures. */
  const diff = rec.bite_realised_um - predicted;
  logLine(`You expected <b>${predicted.toFixed(1)} µm</b>. Machine removed ` +
    `<b>${rec.bite_realised_um.toFixed(1)} µm</b>. Difference: ` +
    `<b>${diff >= 0 ? '+' : ''}${diff.toFixed(1)} µm</b>.`);
  if (Math.abs(diff) >= 1) toast(`Expected <b>${predicted.toFixed(1)} µm</b> · removed ` +
    `<b>${rec.bite_realised_um.toFixed(1)} µm</b> · difference <b>${diff >= 0 ? '+' : ''}${diff.toFixed(1)} µm</b>`, 4200);
  if (phase === 'ARRIVE' || phase === 'MEASURE') phase = 'CUTTING';
}
function doInspect() {
  /* ROUND 9. Inspection is no longer a settlement — it is the moment the part
     LEAVES THE MACHINE and lands somewhere. Money still moves here (the
     invoice is raised the moment the inspector signs), but what the round is
     about is that `unmount()` has run: the part is now an object on a shelf or
     in a bin, and the machine is empty.
     A part can only be inspected ONCE, because there is only one part on the
     table and afterwards there is none. The failure this replaces was
     measured: three identical ACCEPTED charges, £1850 -> £3700 -> £5550, all
     at clock 484.6328, because nothing physical had changed between them. */
  if (!GAME.part.mounted) {
    say('You', 'There is nothing in the machine. The parallels are bare.');
    if (REC) REC.refusal('inspect', 'NO_PART_ON_THE_TABLE', { clock_min: GAME.clock_min });
    return;
  }
  const v = G.inspect(GAME);
  const r = kernelJob(G.ship);
  if (r && r.ok === false) {
    say('You', r.why === 'NO_PART_ON_THE_TABLE' ? 'Nothing on the table to inspect.'
      : `The machine would not do it: ${r.why}`);
    if (REC) REC.refusal('inspect', r.why, { clock_min: GAME.clock_min });
    return;
  }
  /* NOW the truth may be shown — the part has left your hands. */
  revealed = {
    true_mm: r.dia,
    err_um: (r.dia - GAME.job.nominal_mm) * 1000,
    read_mm: lastRead ? lastRead.mm : r.dia,
    gauge_err_um: lastRead ? (lastRead.mm - lastRead.coldDia_at_measure) * 1000 : 0,
  };
  if (audioReady) AUD.clack({ gain: 0.6, pitch: 700, kind: 'steel' });
  if (REC) {
    REC.shipEvent({ verdict: v.verdict, true_cold_mm: r.dia,
      last_reading_mm: lastRead ? lastRead.mm : null, job: GAME.job,
      net: r.net, late: r.late, passes: r.passes, shots: r.shots,
      clock_min: GAME.clock_min });
    firstEndAt = firstEndAt === null ? REC.wallMs() : firstEndAt;
    endedOnce = true;
    /* Start the five-seconds-after-ship window. The manual is unambiguous that
       this is the strongest signal in the round, so it is opened HERE, at the
       ship event itself, rather than waiting for the observer to notice. */
    openShipWindow();
  }
  syncFloor();
  if (r.outcome === 'ACCEPTED') {
    say('Earl', "\u201cThat's in. Get it on the rack by the door — the van's the van, " +
      "it doesn't come to you.\u201d");
    toast(`<b>ACCEPTED.</b> ${money(r.net)}` +
      (r.late ? ' — the window has closed' : '') + `<br>` + revealLine(), 10000);
    logLine(`<b>ACCEPTED</b> at ${G.hhmm(GAME.clock_min)}. ${r.note} ` +
      `Part <b>${r.part_id}</b> is on the rack, slot ${G.rackParts(GAME).length} of ${GAME.rack_slots}.`);
    phase = 'RACKED';
  } else if (r.outcome === 'SCRAP') {
    say('Earl', "\u201cIt's over. There's no putting metal back in a hole.\u201d");
    toast(`<b>${v.verdict}</b> — band ${GAME.job.band_low_mm.toFixed(3)}–${GAME.job.band_high_mm.toFixed(3)}.` +
      `<br>` + revealLine(), 10000);
    logLine(`<b>${v.verdict}</b> — ${r.note} ` +
      `Part <b>${r.part_id}</b> is in the scrap bin and ${GAME.stock_on_hand} castings are left in the crate.`);
    phase = 'SCRAPPED';
    /* HE WALKS OVER. Twenty minutes after the part was scrapped, Mr. Achebe
       has tried to fit a bearing into it and failed, and the man from the
       assembly bay is standing at your machine. The page only SCHEDULES this;
       the clock decides when it lands, so it lands in real time whether you
       are at the machine or across the shop. */
    scheduleAchebe();
  } else {
    say('Earl', "\u201cIt's under. Get it on the rack — they can take the rest out at their end.\u201d");
    toast(`<b>${v.verdict}</b> — band ${GAME.job.band_low_mm.toFixed(3)}–${GAME.job.band_high_mm.toFixed(3)}.` +
      `<br>` + revealLine(), 10000);
    logLine(`<b>${v.verdict}</b> — ${r.note} Part <b>${r.part_id}</b> is on the rack, ` +
      `flagged to the customer for rework.`);
    phase = 'RACKED';
  }
  SEEN.corrected = true;
  /* ══ THE SHOP GETS TOLD, AND THE LOOP CLOSES ═════════════════════════════
     Everything above this line is the part leaving the machine. This is the
     part leaving the SHOP — which is a different event, on a different clock,
     and it is the one that changes what work is on the wall tomorrow.

     THE TWO NUMBERS FINALLY GO ON THE SAME LINE. `lastRead.mm` is what you told
     the customer the bore was. `r.dia` is what their gauge found. `recordDelivery`
     is handed both, and the difference between them is worth standing as well as
     the delivery itself — a shop whose word is good gets trusted with tighter
     work. That is the whole thesis of this build, priced.

     A delivery with NO reading is not an error and is not free: it is a penalty,
     because "I didn't measure it" is the one thing a customer cannot forgive
     and the one thing the game can name. */
  if (SHOP && GAME.job.client_id) {
    const entry = recordDelivery(SHOP, {
      client: GAME.job.client_id,
      job_id: GAME.job.id,
      nominal_mm: GAME.job.nominal_mm,
      band_um: (GAME.job.band_high_mm - GAME.job.band_low_mm) * 1000,
      outcome: r.outcome,
      late: !!r.late,
      claimed_mm: lastRead ? lastRead.mm : null,
      true_mm: r.dia,
      net: r.net,
    });
    SHOP.cash += r.net;
    const c = SHOP.book[GAME.job.client_id];
    const d = entry.delivery_delta + entry.claim_delta;
    logLine(`<b>${GAME.job.client}</b> — standing ${entry.standing_before} → ` +
      `<b>${entry.standing_after}</b> (${d >= 0 ? '+' : ''}${d}). ${entry.report}`);
    if (REC) REC.hint({ kind: 'shop', who: GAME.job.client, is_question: false,
      text: `${entry.kind} ${d >= 0 ? '+' : ''}${d} -> ${entry.standing_after}. ${entry.report}` });
    /* Earl has an opinion only when it was expensive. A line for every delivery
       would be noise, and the build's own rule is that he reacts to objects and
       to consequences rather than to a score. */
    if (entry.kind === 'scrapped') {
      setTimeout(() => say('Earl', "\u201cThat's Halvorsen's line down. They'll remember " +
        "it longer than you will.\u201d"), 3200);
    } else if (entry.kind === 'undersize') {
      setTimeout(() => say('Earl', "\u201cThey'll finish it themselves and they'll " +
        "charge us for it. Second time and they stop calling.\u201d"), 3200);
    } else if (entry.claim_delta >= 8) {
      setTimeout(() => say('Earl', "\u201cTold them a number and the number was right. " +
        "That's the whole job, that is.\u201d"), 3200);
    }
  }

  /* ── THE WAY TO THE NEXT JOB ─────────────────────────────────────────────
     The board is by the roll-up door and a player who has just shipped has no
     reason to know that. One line, once, in the panel they are already reading
     when a part settles — not an arrow, not a marker, no quest log. §48 asks
     for the world to tell them; this is the world's own noticeboard being
     mentioned by the only voice that is not a menu. */
  if (!earlSaid.toldAboutBoard) {
    earlSaid.toldAboutBoard = true;
    logLine(`<b>Job board</b> by the roll-up door — <b>${G.JOBS.length}</b> on the books. ` +
      `Take the next one when you are clear of this.`);
  }
  /* The way out. On the public build the session lives in this browser and
     nowhere else, so the player is the only one who can hand it over. Offered
     as a TOAST and not a dialogue on purpose: the field manual makes the five
     seconds after shipping the strongest signal in the round, and a modal
     asking for a file would kill it. This sits in the corner and waits. */
  if (REC) offerSessionDownload();
  /* Was the part OFF THE MACHINE alive — undersize, recoverable? Then it is
     still live work and a fresh casting can be cut — but that is a DIFFERENT
     casting, so it must not be recorded as the same part twice. (Round 10A:
     RECOVERABLE is now the UNDERSIZE case. An OVERSIZE part is SCRAP and the
     casting is gone, so there is nothing to keep alive.) */
  if (REC) partStillLive = (r.outcome === 'RECOVERABLE');
}
/* ── THE SECOND PART — the one question the whole round exists to answer ──── */
let endedOnce = false, firstEndAt = null, partStillLive = false, secondPartSeen = false;

/* ══════════════════════════════════════════════════════════════════════════
   ROUND 9 — FETCHING ANOTHER CASTING, AND THE FLOOR FOLLOWING ALONG
   ══════════════════════════════════════════════════════════════════════════ */

/** Put the next casting in the machine. This is a WALK and a WAIT, and the
 *  clock is charged for both — a recovery that cost nothing would be free
 *  recovery, and this round is about consequences that land. */
function doFetchBlank() {
  if (GAME.part.mounted) {
    say('You', 'There is already a casting in the machine.');
    return;
  }
  if (GAME.stock_on_hand < 1) {
    say('Earl', "\u201cCrate's empty. Nothing left to put in it.\u201d");
    logLine('No castings left in the crate. There is no recovery from this one.');
    if (REC) REC.refusal('fetch_blank', 'NO_STOCK_IN_STORES', { clock_min: GAME.clock_min });
    return;
  }
  /* WHAT THE RECOVERY COSTS DEPENDS ON WHAT WENT WRONG, and `mountBlank`
     decides that from the register rather than from the page. A scrap part is
     an OVERSIZE part — caught with the bar still in the cut — so its
     replacement goes back on the SAME setup: cheap. The expensive one is the
     UNDERSIZE part: it came off the jaws with metal still to remove and left
     the setup behind it, so going again costs a re-clamp and a re-datum. See
     `chargeRecovery()` in game.mjs — that asymmetry is the reason this game
     would rather you stopped short than cut past the band: the recoverable
     mistake is being UNDER, because there is metal left to remove, and the
     expensive recovery belongs to the recoverable one. */
  /* Read the REGISTER, not the summary object. The register is where a part's
     disposition actually lives (it is what `rackParts()` and the rack mesh are
     derived from), and `finished` is a settlement record that carries money and
     timing but not the disposition. Asking the wrong one silently downgraded
     every rework recovery to the cheap scrap path — a bug that made the
     expensive recovery cost the cheaper one's price. */
  const req = GAME.part_register.filter((p) => p.disposition === 'REWORK');
  const reason = req.length ? 'REWORK' : 'SCRAP';
  const r = G.mountBlank(GAME, { reason });
  if (!r.ok) { say('Earl', `\u201c${r.detail}\u201d`); return; }
  /* Adopt the game layer's clock cost. Without this the frame loop would hand
     the minutes straight back on the very next tick. */
  if (GAME.state_clock_floor > clocks.job_min + opMin) opMin = GAME.state_clock_floor - clocks.job_min;
  GAME.clock_min = clocks.job_min + opMin;
  clockFloorMin = Math.max(clockFloorMin, GAME.state_clock_floor);

  /* `depth_mm` does not exist on a job spec — the field is `bore_depth_mm`.
     Reading the wrong one passed `undefined` into the extruded geometry, and
     the Traveler and the crate both told the player the bore was "undefined"
     deep. Nothing threw: the per-frame sync further down reads the CORRECT
     field, which is the only reason the part still rendered. */
  buildPartMesh(GAME.job.start_hole_dia_mm, GAME.job.bore_depth_mm);
  lastRead = null; predicted_um = null; biteCmd_um = 0; revealed = null;
  if (audioReady) AUD.clack({ gain: 0.45, pitch: 1100 });
  syncFloor();
  toast(`<b>${r.part.id}</b> in the machine. ${GAME.job.start_hole_dia_mm} mm as-cast, and the ` +
    `machine is not cold any more.<br>Cost ${r.cost.minutes.toFixed(1)} min` +
    (r.cost.cost ? ` and ${money(r.cost.cost)}` : '') + ` · ${GAME.stock_on_hand} castings left.`, 6500);
  logLine(`Clamped <b>${r.part.id}</b> on the parallels. ` +
    (r.cost.scrap ? 'Same setup, insert untouched.'
                  : '<b>New setup</b> — parallels, clamps and a fresh touch-off.') +
    ` Touch off before you cut: the datum from the last part died with it.`);
  if (!earlSaid.second_blank) {
    earlSaid.second_blank = true;
    setTimeout(() => say('Earl', P.EARL_LINES.second_blank[0] + ' ' + P.EARL_LINES.second_blank[1]), 1600);
  }
  phase = 'MEASURE';
}

/** Mr. Achebe's bench decides when he comes over — the clock, not the page. */
let achebeDue = null;
function scheduleAchebe() { if (achebeDue === null) achebeDue = GAME.proof.at_min; }

/** Called every frame. Lands the assembly proof when its minute arrives. */
function achebeBeat() {
  if (achebeDue === null || GAME.clock_min < achebeDue) return;
  achebeDue = null;
  say('Mr. Achebe', P.OTHERS.achebe.lines_after[0] + '<br>' + P.OTHERS.achebe.lines_after[1]);
  logLine(`<b>Mr. Achebe, assembly bench 3:</b> the Ø${W.AXIS_DIA_MM} axis stopped ` +
    `halfway into ${GAME.finished ? GAME.finished.part_id : 'your last part'}. ` +
    `He walked it over to show you.`);
  toast(`The verdict is not a number any more — <b>it is the part in his hand</b>.<br>` +
    `A Ø${W.AXIS_DIA_MM} bearing that will not go in.`, 9000);
  if (REC) REC.action('achebe_proof', { at_min: GAME.clock_min,
    part_id: GAME.finished ? GAME.finished.part_id : null });
}

/* ══════════════════════════════════════════════════════════════════════════
   THE 10:30 COURIER — the sentence the brief has carried all along
   ══════════════════════════════════════════════════════════════════════════
   J1's brief has said "before the courier leaves at 10:30" since it was
   written, and until now that courier was fiction: `deadline_min` was money
   arithmetic and nothing physical happened at 10:30. It happens now.

   THREE BEATS, each a real event in the world rather than a message:
     arrival  the van backs onto the apron and is visible out the door
     loading  the driver is at the rack. What is on it is what he takes
     gone     he pulls out. If the rack was empty, Halvorsen has no housing
              and their pump line stays down — a fact about THEIR factory
   The DECISION is `G.courierDepart(GAME)`, in the game layer, where it can be
   unit-tested. This function only animates it and says it out loud.
   ──────────────────────────────────────────────────────────────────────── */
let courierPhase = 'PARKED';    // PARKED -> WAITING -> LOADING -> GONE

function courierBeat(now_min, dt_real_s) {
  const arrive = G.arrivalMin(GAME.job), leave = G.departsMin(GAME.job);
  /* ── the van arrives ─────────────────────────────────────────────────── */
  if (courierPhase === 'PARKED' && now_min >= arrive - 2) {
    courierPhase = 'WAITING';
    VAN.visible = true;
    GAME.courier.arrived = true;
    logLine(`<b>${W.hhmm(arrive)}</b> — a diesel on the apron. Hallam's van is backing up ` +
      `to the roll-up door.`);
    toast(`<b>${W.hhmm(arrive)}</b> — the van is here. He books until ` +
      `${W.hhmm(leave)} and then he goes, loaded or not.`, 7000);
    logLine(`Booked window ${W.hhmm(arrive)}–${W.hhmm(leave)}. ` +
      `Anything not on the rack by ${W.hhmm(leave)} is not on the van.`);
  }
  /* ── the van creeps onto the bay, then the driver walks in ───────────── */
  if (courierPhase === 'WAITING') {
    VAN.position.z += (20.4 - VAN.position.z) * Math.min(1, dt_real_s * 0.9);
    if (now_min >= leave - 6) {
      courierPhase = 'LOADING';
      logLine('The driver is at the rack with a clipboard, counting slots.');
      say('Hallam driver', G.collectableParts(GAME).length
        ? P.OTHERS.hallam.lines[0] : P.OTHERS.hallam.lines[1]);
    }
  }
  /* ── he goes. This is the moment the round turns on ──────────────────── */
  if (courierPhase === 'LOADING' && now_min >= leave) {
    courierPhase = 'GONE';
    const d = G.courierDepart(GAME);
    if (d.ok) {
      GONE_SENT = !!d.loaded;
      syncFloor();
      if (d.loaded) {
        /* ── TWO KINDS OF "IT WENT OUT", AND THEY ARE NOT THE SAME NEWS ─────
           Added in Round 10A. `d.loaded` used to be an in-spec part every
           time, because `SEND` was the only disposition the courier could
           see. Now a `REWORK` part — undersize, customer finishes the bore —
           is collectable too, and telling the player "Halvorsen has their
           housing" over a part Halvorsen still has to cut would be the game
           claiming something the evidence does not support.
           THE DEPENDENCY IS NOT SATISFIED FOR BOTH. "The van took it" and
           "Halvorsen can build" are different questions. Their pump line is
           down until a housing THAT FITS goes out of the door, and a rework
           part is undersize by construction — so the van leaving with it
           leaves the line down. Earl is told off for a failed delivery, not
           congratulated. */
        /* `collected_disposition`, NOT `d.loaded.disposition`. `courierDepart`
           relabels the part `SHIPPED` before it returns, and `d.loaded` is
           that same relabelled object — so the obvious `d.loaded.disposition
           === 'REWORK'` is ALWAYS FALSE and the rework narration below would
           be dead code. That is the defect class this round exists to delete,
           so this branch reads the pre-collection fact the driver saw. */
        const rework = d.collected_disposition === 'REWORK';
        if (rework) {
          /* THE HOUSING WENT, THE LINE DID NOT COME BACK. Earl is not
             congratulating anybody: the van took the part, and Halvorsen still
             has to put a boring bar through it. `courier_missed` is not reused
             here because its second line says "there's nothing on that rack",
             which would be false — something WAS on the rack and it DID go. */
          say('Earl', "\u201cThey've taken it. They're not building anything with it " +
            "until they've finished it themselves, mind.\u201d");
          logLine(`<b>${W.hhmm(d.at)}</b> — van gone with <b>${d.loaded.id}</b> on it. ` +
            `Off the bottom of the band — Halvorsen finishes the bore themselves. ` +
            `<b>Their pump line is still down.</b>`);
          toast(`<b>Collected ${d.loaded.id}.</b> Halvorsen has the housing, ` +
            `and a note saying why they have to finish it.<br>` +
            `They still can't build — it doesn't fit yet.`, 9000);
        } else {
          say('Earl', P.EARL_LINES.courier_satisfied[0] + ' ' + P.EARL_LINES.courier_satisfied[1]);
          logLine(`<b>${W.hhmm(d.at)}</b> — van gone with <b>${d.loaded.id}</b> on it. ` +
            `Halvorsen's pump line can be built.`);
          toast(`<b>Collected ${d.loaded.id}.</b> Halvorsen has their housing.<br>` +
            `One drop, one part, off your floor.`, 9000);
        }
      } else {
        say('Earl', P.EARL_LINES.courier_missed[0] + ' ' + P.EARL_LINES.courier_missed[1]);
        logLine(`<b>${W.hhmm(d.at)}</b> — van gone with <b>nothing</b>. ` +
          `Halvorsen Pumps gets no housing and their pump line stays down.`);
        toast(`<b>The van left with nothing.</b><br>` +
          `Nobody is coming back for it today. There are ` +
          `${GAME.stock_on_hand} castings in the crate and the deadline has passed.`, 11000);
      }
      if (REC) REC.action('courier_depart', { at_min: d.at,
        loaded: d.loaded ? d.loaded.id : null, dependency: d.dependency });
    }
  }
  /* ── it pulls away ───────────────────────────────────────────────────── */
  if (courierPhase === 'GONE' && VAN.visible) {
    VAN.position.z -= dt_real_s * 5.5;
    if (VAN.position.z < -32) VAN.visible = false;
  }
}

/** The physical floor, brought into line with the register.
 *  THIS IS THE ONLY FUNCTION THAT MOVES PARTS BETWEEN MESHES, and it derives
 *  from the register every time rather than tracking state of its own — so a
 *  part cannot be rendered in two places, and a part that is nowhere renders
 *  nowhere. */
function syncFloor() {
  if (!GAME) return { on_table: null, rack: 0, bin: 0 };
  const on = !!GAME.part.mounted;
  const p = on ? G.currentPart(GAME) : null;
  /* (1) the fixture: parallels and clamps appear only when a casting is clamped */
  fixtureParallels.visible = on;
  clampL.visible = clampR.visible = on;
  /* (2) the crate: count only, never size */
  const { shown } = crateMeta();
  crateParts.forEach((o, i) => { o.visible = i < shown; });
  /* (3) the rack: presence only, slot by slot */
  const rack = G.rackParts(GAME);
  rackObjects.forEach((o, i) => {
    const r = rack[i];
    o.visible = !!r;
    /* A REWORK part is NOT dead — it is a good housing with a bore the
       customer finishes. Only a real SCRAP part goes dark on the rack. After
       Round 10A the two racked dispositions are SEND and REWORK, so keying the
       material off `=== 'SEND'` would paint every recoverable part as scrap. */
    if (r) o.children[0].material = r.disposition === 'SCRAP' ? M_PART_DEAD : M_PART_GOOD;
  });
  /* (4) the bin */
  const bin = G.binParts(GAME);
  scrapObjects.forEach((o, i) => { o.visible = i < bin.length; });
  return { on_table: p ? p.id : null, rack: rack.length, bin: bin.length };
}

/* ── THE POST-SHIP WINDOW (field manual §6) ──────────────────────────────────
 * The manual: "After they ship, say nothing for five seconds... Do they look
 * around? Touch something? Re-check the machine?... If they naturally attempt
 * to continue, record MORE." The observer cannot log five seconds of silence
 * accurately, so the recorder holds the physics of it. This window is the
 * strongest single signal in the round; it must survive even if nobody writes
 * anything on the paper sheet. */
const SHIP_WINDOW_MS = 8000;
let shipWindow = null;
function openShipWindow() {
  if (!REC) return;
  shipWindow = { t0: REC.wallMs(), events: [], looked_around: false, moved: false, interacted: false, started_second: false, closed: false };
  setTimeout(() => closeShipWindow('timer'), SHIP_WINDOW_MS);
}
function tapShipWindow(kind, detail) {
  if (!shipWindow || shipWindow.closed) return;
  const t = Math.round((REC.wallMs() - shipWindow.t0) / 100) / 10;
  shipWindow.events.push(t + 's ' + kind + (detail ? ' ' + detail : ''));
  if (kind === 'look') shipWindow.looked_around = true;
  if (kind === 'move') shipWindow.moved = true;
  if (kind === 'interact') shipWindow.interacted = true;
  if (kind === 'second_part') shipWindow.started_second = true;
}
function closeShipWindow(reason) {
  if (!shipWindow || shipWindow.closed) return;
  shipWindow.closed = true;
  /* A window with no events at all is the single most informative outcome
     ("they shipped it and stopped dead"), so it is recorded, not dropped. */
  const last = shipWindow.events.length
    ? shipWindow.events[shipWindow.events.length - 1].split(' ')[1]
    : 'idle';
  REC.postShip({
    seconds_since_ship: Math.round((REC.wallMs() - shipWindow.t0) / 100) / 10,
    last_kind: last,
    events: shipWindow.events,
    looked_around: shipWindow.looked_around,
    moved: shipWindow.moved,
    interacted: shipWindow.interacted,
    started_second: shipWindow.started_second,
    /* Filled afterwards by the observer if the player said anything aloud in
       the window. Read by the analysis tool as spontaneous speech — optional,
       never required, and its absence changes no verdict. */
    verbatim: (window.__SHIP_VERBATIM || {})[String(shipWindow.t0)] || null,
  });
  shipWindow = null;
}
function noteSecondPart(verbatim) {
  if (!REC || !endedOnce || secondPartSeen || partStillLive) return;
  secondPartSeen = true;
  tapShipWindow('second_part', 'another bar/job');
  REC.secondPart({ started: true,
    seconds_since_first_end: firstEndAt === null ? null
      : Math.round((REC.wallMs() - firstEndAt) / 1000),
    verbatim: verbatim ?? null });
}

/* ── THE LOOK-AT PROMPT ─────────────────────────────────────────────────── */
let lookingAt = null, lookUV = null, pendHover = null;
function doLook() {
  /* Starting a SECOND bar after the first one is done and gone is the single
     fact Round 1 turns on: "Give me another part" without being asked. */
  if (lookingAt && /boring bar/i.test(lookingAt.name)) noteSecondPart('loaded another bar');
  if (lookingAt && lookingAt.act) lookingAt.act();
}
function updateLook() {
  raycaster.setFromCamera({ x: 0, y: 0 }, camera);
  const cands = LOOK.filter((L) => !L.when || L.when());
  const hits = raycaster.intersectObjects(cands.map((c) => c.obj), true);
  let hit = null;
  if (hits.length) {
    let o = hits[0].object;
    while (o && !cands.some((c) => c.obj === o)) o = o.parent;
    hit = cands.find((c) => c.obj === o) || null;
  }
  lookingAt = hit;
  /* The pad needs to know WHICH key the crosshair is on, and the ray hit is
     the only thing that knows. Kept on the module rather than threaded through
     `act()`, which every other verb in the shop is called without arguments. */
  lookUV = (hits.length && hits[0].uv) ? hits[0].uv : null;
  if (hit && hit.obj === pendPad && lookUV) {
    const k = keyAtUV(lookUV.x, lookUV.y);
    pendHover = k;
    if (k) {
      const i = KEYPAD.keys.indexOf(k);
      const r = keyRectUV(i);
      pendCursor.visible = true;
      pendCursor.scale.set(r.w * PEND_W * 1.02, r.h * PEND_H * 1.02, 1);
      pendCursor.position.set((r.u0 + r.w / 2 - 0.5) * PEND_W,
                              -0.22 + (r.v0 + r.h / 2 - 0.5) * PEND_H, 0.090);
    } else { pendCursor.visible = false; }
  } else { pendHover = null; pendCursor.visible = false; }
  $('look').style.opacity = hit ? '1' : '0';
  if (hit) {
    /* A LOOK entry may name itself from live state. The pad's name is the key
       under the crosshair, which is the only way the player learns what a key
       does without a legend. */
    $('lkName').textContent = (hit.obj === pendPad && pendHover) ? pendHover.label : hit.name;
    /* §53: what you can even SEE depends on what you have done */
    const p = W.perceptionOf({ crude: '', material: '', process: '', engineer: '' }, SEEN);
    $('lkAct').innerHTML = `<span class="verb">E</span> ${hit.verb}` +
      (p.layer >= 2 ? ' · <span style="opacity:.6">you know more about this than you did at 5:55</span>' : '');
  }
}

/* ── §104: THE FIRST HOUR, staged on the clock ──────────────────────────── */
/* The opening screen is diegetic — it is the yard outside the door, not a
   menu. It is filled BEFORE the player clicks, because a player who clicks an
   unreadable screen has been told nothing. */
function paintGate() {
  /* The advisory notice, read off the kernel's own flags. See the note in the
     markup: this is a disclosure the README promised and the page did not make. */
  {
    const adv = $('gAdv');
    if (adv) {
      adv.innerHTML = `Advisory only — <b>not for machine execution</b>` +
        (K.MACHINE_EXECUTION === false ? '' : ` <b style="color:#e05a4e">(MACHINE_EXECUTION=${K.MACHINE_EXECUTION})</b>`) +
        `, not a production authorisation. Kernel ${K.KERNEL_VERSION}.`;
    }
  }
  $('gBig').innerHTML = 'Half past five in the morning.<br>The lights are already on.';
  $('gSub').innerHTML = 'You are outside the roll-up door of Halvorsen Pumps\u2019 machine shop. ' +
    'Through it: three spindles already running, a compressor, and somebody\u2019s radio.<br><br>' +
    'Your shift starts at six. Nobody has come out to meet you.';
  $('gGo').textContent = 'Click to walk in.';
}
paintGate();
