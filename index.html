<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="A playable digital twin of industrial civilization. You are a new hire at Halvorsen Pumps. Bore a bearing housing to H6 and hope it is right.">
<title>INDUSTRIA — your first shift at Halvorsen Pumps</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%2314181d'/><circle cx='16' cy='16' r='9' fill='none' stroke='%237d8b98' stroke-width='5'/></svg>">
<style>
  :root{ --ink:#e8edf2; --dim:#8b98a6; --warn:#e8a33d; --bad:#e05a4e; --ok:#5fbf7a; --panel:rgba(10,14,18,.82); }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#0a0d11;color:var(--ink);
    font:14px/1.45 ui-monospace,"SF Mono",Menlo,Consolas,monospace}
  canvas{display:block}
  #vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 45%,rgba(0,0,0,.55) 100%)}

  /* ── diegetic HUD: no quest arrows, no floating clutter (§48) ───────────── */
  .hud{position:fixed;pointer-events:none;text-shadow:0 1px 3px #000}
  #tl{top:14px;left:16px}
  #tl .job{font-size:15px;letter-spacing:.02em}
  #tl .cli{color:var(--dim);font-size:12px}
  #tl .clock{font-size:26px;letter-spacing:.04em;margin-top:6px}
  #tl .deadline{color:var(--dim);font-size:12px}
  #tl .deadline.late{color:var(--bad)}

  #tr{top:14px;right:16px;text-align:right;font-size:12px;color:var(--dim)}
  #tr b{color:var(--ink);font-weight:500}
  #tr .band{color:var(--ink)}

  /* the hover label — the only thing that tells you a thing is a thing */
  #look{left:50%;top:calc(50% + 26px);transform:translateX(-50%);text-align:center;font-size:13px}
  #look .nm{background:var(--panel);border:1px solid #2a333d;padding:3px 9px;border-radius:2px}
  #look .act{color:var(--dim);font-size:11px;margin-top:3px}
  #look .verb{color:var(--warn)}

  /* machine panel: appears only when you are at the machine */
  #panel{right:16px;bottom:16px;width:266px;background:var(--panel);
    border:1px solid #2a333d;border-radius:3px;padding:11px 12px;pointer-events:none;display:none}
  #panel.on{display:block}
  #panel h4{margin:0 0 8px;font-size:11px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;font-weight:500}
  #panel .row{display:flex;justify-content:space-between;font-size:12px;padding:1px 0}
  #panel .row i{color:var(--dim);font-style:normal}
  #panel .cut{margin-top:8px;padding-top:8px;border-top:1px solid #2a333d}
  #panel kbd{background:#1b2229;border:1px solid #333d47;border-radius:2px;padding:0 4px;font-size:11px;color:var(--ink)}

  /* toasts — used ONLY for speech and events, never for instructions */
  #talk{left:50%;bottom:74px;transform:translateX(-50%);max-width:min(620px,86vw);text-align:center}
  #talk .who{color:var(--warn);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
  #talk .say{font-size:16px;margin-top:5px}
  #talk .opt{pointer-events:auto;cursor:pointer;display:inline-block;margin:9px 4px 0;padding:4px 10px;
    background:var(--panel);border:1px solid #333d47;border-radius:2px;font-size:13px}
  #talk .opt:hover{border-color:var(--warn);color:var(--warn)}

  #ev{left:50%;top:76px;transform:translateX(-50%);text-align:center;font-size:13px;color:var(--warn)}
  #ev div{margin:3px 0}

  #log{left:16px;bottom:16px;width:min(430px,40vw);max-height:30vh;overflow:hidden;
    display:flex;flex-direction:column-reverse;gap:2px;font-size:12px}
  #log div{color:var(--dim)}
  #log div b{color:var(--ink);font-weight:500}
  #log .new{color:var(--ink)}

  /* entrance: the only screen that is not the world */
  #gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:#070a0d;z-index:9;cursor:pointer}
  #gate .in{max-width:640px;padding:0 26px}
  #gate h1{font-size:13px;letter-spacing:.42em;color:var(--dim);margin:0 0 22px;font-weight:400}
  #gate .big{font-size:23px;line-height:1.5}
  #gate .sub{color:var(--dim);margin-top:18px;font-size:13px;line-height:1.7}
  #gate .go{margin-top:30px;color:var(--warn);font-size:13px}
  #gate .fine{color:#5c6774;font-size:11px;margin-top:22px;line-height:1.6}
  #hint{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);color:#5c6774;font-size:11px}
</style>
</head>
<body>
<div id="vig"></div>

<div class="hud" id="tl">
  <div class="job" id="hJob">—</div>
  <div class="cli" id="hCli"></div>
  <div class="clock" id="hClock">--:--</div>
  <div class="deadline" id="hDue"></div>
</div>

<div class="hud" id="tr">
  <div>GAUGE <b id="hGauge">—</b></div>
  <div>BAND <b class="band" id="hBand">—</b></div>
  <div style="margin-top:5px" id="hMoney">—</div>
</div>

<div class="hud" id="look"><span class="nm" id="lkName"></span><div class="act" id="lkAct"></div></div>
<div class="hud" id="ev"></div>
<div class="hud" id="talk"></div>
<div class="hud" id="log"></div>

<div class="hud" id="panel">
  <h4 id="pnTitle">Machine</h4>
  <div id="pnRows"></div>
  <div class="cut" id="pnCut"></div>
</div>

<div id="hint">WASD move · mouse look · <b>E</b> use · <b>shift</b> run</div>

<div id="gate"><div class="in">
  <h1>INDUSTRIA</h1>
  <div class="big" id="gBig">Loading.</div>
  <div class="sub" id="gSub"></div>
  <div class="go" id="gGo"></div>
  <div class="fine" id="gFine">Click to enter · Esc releases the mouse.</div>
</div></div>

<script type="module">
import * as THREE from './vendor/three/three.module.min.js';
import * as G from './game.mjs';
import * as W from './world.mjs';
import * as P from './people.mjs';
import { createAudio } from './audio.mjs';

/* ══════════════════════════════════════════════════════════════════════════
   INDUSTRIA — the floor.
   The numbers are the kernel's. This file decides where to put them and what
   they look like, and it is not allowed to invent any of them (§R4).
   ══════════════════════════════════════════════════════════════════════════ */

const $ = (id) => document.getElementById(id);
const cl = (v, a, b) => Math.min(b, Math.max(a, v));

/* ── STATE ──────────────────────────────────────────────────────────────── */
let GAME = null;                       // the kernel's game state
const clocks = { world_min: 0, job_min: 0, job_taken: false };
let START_SHIFT_MIN = 355;             // 05:55
const SEEN = { any: false, measured: false, corrected: false };  // §53 layers
const CARRIED = { calipers: false, parallels: false, traveler: false };
/* The ONLY diameter the player is ever allowed to see. Gauge resolution is
   finite and the reading goes stale the moment you cut — both by design. */
let lastRead = null;                 // { mm, sigma_um, partC, at_min }
let revealed = null;                 // truth, and only ever AFTER the part ships
/** Post-mortem only: the customer measures it properly, and then you are told.
 *  This is the one moment the truth is allowed on screen (R1). */
function revealLine() {
  if (!revealed) return '';
  return `<span style="color:#8b98a6">Customer CMM: true bore ` +
    `<b style="color:#e8edf2">Ø${revealed.true_mm.toFixed(4)}</b> mm at 20 °C, ` +
    `${revealed.err_um >= 0 ? '+' : ''}${revealed.err_um.toFixed(1)} µm vs nominal. ` +
    `Your last gauge reading was Ø${revealed.read_mm.toFixed(4)} — ` +
    `the gauge was out by ${revealed.gauge_err_um.toFixed(1)} µm.</span>`;
}
let phase = 'ARRIVE';
let earlIdleSince = 0, earlSaid = {}, lastEarlAt = -99;

/* ── THREE ──────────────────────────────────────────────────────────────── */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.02;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(72, innerWidth / innerHeight, 0.04, 220);
const eye = new THREE.Vector3(-7.5, 1.68, 8.4);
let yaw = -0.30, pitch = -0.06;

/* ── MATERIALS — §49 wants a shop that has been used, not a showroom ────── */
const M = {
  floor: new THREE.MeshStandardMaterial({ color: 0x5b6066, roughness: 0.92, metalness: 0.06 }),
  aisle: new THREE.MeshStandardMaterial({ color: 0x9a8b3f, roughness: 0.95, metalness: 0.03 }),
  wall:  new THREE.MeshStandardMaterial({ color: 0xb3b6b1, roughness: 0.95, metalness: 0.02 }),
  steel: new THREE.MeshStandardMaterial({ color: 0x929aa2, roughness: 0.48, metalness: 0.7 }),
  dark:  new THREE.MeshStandardMaterial({ color: 0x3a4046, roughness: 0.72, metalness: 0.3 }),
  paint: new THREE.MeshStandardMaterial({ color: 0xb9c2ca, roughness: 0.74, metalness: 0.18 }),
  warn:  new THREE.MeshStandardMaterial({ color: 0xc9a227, roughness: 0.8, metalness: 0.1 }),
  wood:  new THREE.MeshStandardMaterial({ color: 0x9a7549, roughness: 0.95, metalness: 0 }),
  vise:  new THREE.MeshStandardMaterial({ color: 0x6b7f8a, roughness: 0.6, metalness: 0.58 }),
  rust:  new THREE.MeshStandardMaterial({ color: 0x8a6244, roughness: 0.95, metalness: 0.2 }),
  brass: new THREE.MeshStandardMaterial({ color: 0xa88a4a, roughness: 0.45, metalness: 0.85 }),
  coolant: new THREE.MeshPhysicalMaterial({ color: 0xa8c4a0, roughness: 0.22, metalness: 0.1,
             transparent: true, opacity: 0.55, transmission: 0.3, thickness: 0.4 }),
  chip:  new THREE.MeshStandardMaterial({ color: 0x8e9aa4, roughness: 0.4, metalness: 0.85 }),
  glass: new THREE.MeshPhysicalMaterial({ color: 0xd8e6ef, roughness: 0.04, metalness: 0,
             transparent: true, opacity: 0.13, side: THREE.DoubleSide }),
};

const box = (w, h, d, mat, x = 0, y = 0, z = 0, parent = scene) => {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true; parent.add(m); return m;
};
const cyl = (rt, rb, h, mat, seg = 24) => new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat);

/* ── THE BUILDING ───────────────────────────────────────────────────────── */
const ROOM = { w: 42, d: 34, h: 6.2 };
const floorMesh = new THREE.Mesh(new THREE.PlaneGeometry(ROOM.w, ROOM.d), M.floor);
floorMesh.rotation.x = -Math.PI / 2; floorMesh.receiveShadow = true; scene.add(floorMesh);

const roof = new THREE.Mesh(new THREE.PlaneGeometry(ROOM.w, ROOM.d),
  new THREE.MeshStandardMaterial({ color: 0x4b5158, roughness: 0.95, side: THREE.DoubleSide }));
roof.rotation.x = Math.PI / 2; roof.position.y = ROOM.h; scene.add(roof);

/* walls, with a roll-up door on the -Z end (you came in through it) */
box(ROOM.w, ROOM.h, 0.3, M.wall, 0, ROOM.h / 2, -ROOM.d / 2);
box(0.3, ROOM.h, ROOM.d, M.wall, -ROOM.w / 2, ROOM.h / 2, 0);
box(0.3, ROOM.h, ROOM.d, M.wall, ROOM.w / 2, ROOM.h / 2, 0);
box(ROOM.w, ROOM.h, 0.3, M.wall, 0, ROOM.h / 2, ROOM.d / 2);
const door = box(5.4, 4.4, 0.22, M.dark, 0, 2.2, -ROOM.d / 2 + 0.28);
for (let i = 0; i < 6; i++) box(5.4, 0.06, 0.26, M.steel, 0, 0.5 + i * 0.72, -ROOM.d / 2 + 0.3);

/* a painted aisle down the middle, worn in the traffic lanes */
const aisle = new THREE.Mesh(new THREE.PlaneGeometry(3.2, ROOM.d - 4), M.aisle);
aisle.rotation.x = -Math.PI / 2; aisle.position.set(-2.2, 0.008, 1); aisle.receiveShadow = true; scene.add(aisle);

/* ── LIGHTING — driven by world.daylight(); shop fluorescents always on ─── */
const hemi = new THREE.HemisphereLight(0xcfdce8, 0x494f55, 1.30); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffe9c8, 0.55);
sun.position.set(-14, 12, -8); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); sun.shadow.camera.far = 48;
sun.shadow.camera.left = -22; sun.shadow.camera.right = 22;
sun.shadow.camera.top = 22; sun.shadow.camera.bottom = -22; scene.add(sun);

const LAMPS = [];
for (let ix = -1; ix <= 1; ix++) for (let iz = -1; iz <= 1; iz++) {
  const x = ix * 12, z = iz * 9.5;
  const g = new THREE.Group(); g.position.set(x, ROOM.h - 0.5, z); scene.add(g);
  box(2.4, 0.16, 0.5, M.dark, 0, 0, 0, g);
  const tube = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.06, 0.42),
    new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xeef4ff, emissiveIntensity: 2.4 }));
  tube.position.y = -0.11; g.add(tube); LAMPS.push(tube);
  const pl = new THREE.PointLight(0xf2f6ff, 2.1, 20, 2); pl.position.set(x, ROOM.h - 1.2, z); scene.add(pl);
}

/* ── THE MACHINE — vmc_40taper_7k5 ─────────────────────────────────────────
   Built as a CASTING, not a crate: column at the back, a real open cavity in
   front of it, tool hanging into that cavity, and the door glass looking in.
   The first attempt made the column a solid box filling the whole enclosure,
   so the window looked into a brick. Measured, not assumed. */
const cell = new THREE.Group(); cell.position.set(0, 0, -7); scene.add(cell);
/* plinth and column — the mass lives at the REAR */
box(3.2, 0.44, 2.6, M.dark, 0, 0.22, 0, cell);
box(3.2, 3.2, 0.95, M.paint, 0, 2.2, -0.82, cell);          // column casting
box(3.2, 0.30, 2.6, M.paint, 0, 3.85, 0, cell);             // top cap
/* the enclosure: floor, roof, two side walls — leaving a C-shaped cavity */
box(3.2, 0.10, 2.6, new THREE.MeshStandardMaterial({ color: 0x8e8578, roughness: 0.93 }), 0, 1.02, 0, cell);
box(3.2, 0.10, 2.6, M.dark, 0, 3.70, 0, cell);
box(0.10, 2.7, 2.6, M.paint, -1.55, 2.36, 0, cell);
box(0.10, 2.7, 2.6, M.paint,  1.55, 2.36, 0, cell);
/* interior back wall of the cavity (in front of the column casting) */
box(3.0, 2.6, 0.06, new THREE.MeshStandardMaterial({ color: 0x9a9184, roughness: 0.9 }), 0, 2.36, -0.32, cell);
/* THE WORKLIGHT — the single reason the interior reads as a machine at all */
const workLight = new THREE.PointLight(0xfff3e0, 2.6, 5.2, 1.6);
workLight.position.set(0.9, 3.5, 0.7); cell.add(workLight);
const workLamp = new THREE.Mesh(new THREE.SphereGeometry(0.06, 10, 8),
  new THREE.MeshStandardMaterial({ color: 0xfff6e2, emissive: 0xfff2d8, emissiveIntensity: 3.0 }));
workLamp.position.copy(workLight.position); cell.add(workLamp);
/* spindle head, hung from the top of the cavity, nose pointing down */
const headBlock = box(0.66, 0.52, 0.66, M.paint, 0, 3.28, 0.25, cell);
const spindle = cyl(0.15, 0.20, 0.52, M.steel); spindle.position.set(0, 2.78, 0.25); cell.add(spindle);
const spindleGroup = new THREE.Group(); spindleGroup.position.set(0, 2.52, 0.25); cell.add(spindleGroup);
const taper = new THREE.Mesh(new THREE.ConeGeometry(0.115, 0.30, 20), M.steel);
taper.position.y = -0.16; taper.rotation.x = Math.PI; spindleGroup.add(taper);
const holder = cyl(0.055, 0.075, 0.22, M.steel); holder.position.y = -0.40; spindleGroup.add(holder);
const barMesh = cyl(0.011, 0.011, 0.16, M.steel); barMesh.position.y = -0.55; spindleGroup.add(barMesh);
/* table, and the vise standing on parallels */
const table = box(1.25, 0.14, 0.95, M.steel, 0, 1.14, 0.25, cell);
for (let i = 0; i < 4; i++) {
  const slot = box(1.25, 0.02, 0.05, M.dark, 0, 1.215, -0.05 + i * 0.17, cell);
}
box(0.60, 0.05, 0.36, M.steel, -0.05, 1.235, 0.25, cell);   // parallel
const viseBase = box(0.70, 0.26, 0.46, M.vise, 0, 1.39, 0.25, cell);
box(0.19, 0.30, 0.46, M.vise, 0.28, 1.52, 0.25, cell);      // moving jaw
box(0.14, 0.30, 0.46, M.vise, -0.28, 1.52, 0.25, cell);     // fixed jaw
const screw = cyl(0.032, 0.032, 0.62, M.brass); screw.rotation.z = Math.PI / 2;
screw.position.set(-0.05, 1.39, 0.25); cell.add(screw);
/* coolant: nozzle aimed at the cut, line down the wall, tray, and the pump */
const nozzleP = new THREE.Group(); nozzleP.position.set(-0.42, 2.05, 0.52); cell.add(nozzleP);
const nozzleR = cyl(0.013, 0.013, 0.40, M.brass); nozzleR.rotation.z = 0.75; nozzleP.add(nozzleR);
box(0.05, 0.05, 1.4, M.steel, 1.48, 2.95, -0.1, cell);      // pipe run down the wall
box(1.6, 0.20, 1.15, M.dark, 0, 0.58, 0.25, cell);          // chip tray
box(0.34, 0.26, 0.34, M.dark, -1.15, 0.60, 0.95, cell);     // coolant pump
/* the door: a real frame, clear glass, a handle you would grab */
box(3.1, 0.09, 0.09, M.dark, 0, 3.60, 1.30, cell);
box(3.1, 0.09, 0.09, M.dark, 0, 1.08, 1.30, cell);
box(0.09, 2.6, 0.09, M.dark, -1.50, 2.34, 1.30, cell);
box(0.09, 2.6, 0.09, M.dark,  1.50, 2.34, 1.30, cell);
const win = new THREE.Mesh(new THREE.PlaneGeometry(2.88, 2.44), M.glass);
win.position.set(0, 2.34, 1.30); cell.add(win);
box(0.62, 0.05, 0.05, M.steel, 1.12, 1.34, 1.36, cell);     // door handle
box(0.16, 0.06, 0.10, M.brass, 0.55, 1.60, 1.36, cell);     // latch
const pend = new THREE.Group(); pend.position.set(1.78, 1.62, 0.9); cell.add(pend);
box(0.66, 0.92, 0.14, M.dark, 0, 0, 0, pend);
box(0.50, 0.42, 0.03, new THREE.MeshStandardMaterial({ color: 0x1b3a2a, emissive: 0x2f7a4a, emissiveIntensity: 0.7 }), 0, 0.18, 0.09, pend);
box(0.44, 0.06, 0.02, M.warn, 0, -0.22, 0.09, pend);

/* ── THE 3D PART — geometry driven by the kernel's bore diameter ────────── */
const PART = { mesh: null, mat: new THREE.MeshStandardMaterial({ color: 0x707880, roughness: 0.5, metalness: 0.78 }) };
function buildPartMesh(dia_mm, depth_mm) {
  if (PART.mesh) { cell.remove(PART.mesh); PART.mesh.geometry.dispose(); }
  const rO = 0.062, rI = (dia_mm / 1000) / 2, dep = depth_mm / 1000;
  /* block → bored hole, as a lathe of segments so the hole has real physical size */
  const shape = new THREE.Shape();
  shape.absarc(0, 0, rO, 0, Math.PI * 2, false);
  const hole = new THREE.Path(); hole.absarc(0, 0, rI, 0, Math.PI * 2, true); shape.holes.push(hole);
  const geo = new THREE.ExtrudeGeometry(shape, { depth: dep, bevelEnabled: false, curveSegments: 48 });
  geo.rotateX(-Math.PI / 2); geo.translate(0, dep, 0);
  PART.mesh = new THREE.Mesh(geo, PART.mat);
  PART.mesh.castShadow = PART.mesh.receiveShadow = true;
  PART.mesh.position.set(-0.1, 1.30, 0.35);
  cell.add(PART.mesh);
  return PART.mesh;
}
buildPartMesh(36, 30);

/* ── THE REST OF THE SHOP — inhabited (§49), and not all of it about you ── */
/* a second machine running someone else's job, cooling tower, blower */
function otherMachine(x, z, ry, colorHex, noise) {
  const g = new THREE.Group(); g.position.set(x, 0, z); g.rotation.y = ry; scene.add(g);
  box(2.4, 0.5, 2.0, M.dark, 0, 0.25, 0, g);
  box(2.4, 2.8, 2.0, new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.8, metalness: 0.2 }), 0, 1.8, 0, g);
  const w2 = new THREE.Mesh(new THREE.PlaneGeometry(1.5, 1.0), M.glass); w2.position.set(0, 1.7, 1.04); g.add(w2);
  const chipPile = new THREE.Mesh(new THREE.ConeGeometry(0.45, 0.22, 14), M.chip); chipPile.position.set(0, 0.62, 0.8); g.add(chipPile);
  return { g, noise };
}
const OTHER1 = otherMachine(-11, -4, 0.5, 0x7d8890, 0.62);
const OTHER2 = otherMachine(9.5, 2, -0.7, 0x6f7a72, 0.44);

/* chip conveyor + bins + pallets */
const bin = (x, z, mat) => { const g = new THREE.Group(); g.position.set(x, 0, z); scene.add(g);
  box(0.8, 0.62, 0.62, mat, 0, 0.5, 0, g); box(0.86, 0.06, 0.68, M.dark, 0, 0.83, 0, g); return g; };
bin(-4.6, -6.4, M.rust); bin(-5.6, -6.4, M.rust); bin(4.4, -8.6, new THREE.MeshStandardMaterial({ color: 0x3f5a46, roughness: 0.9 }));
const pallet = (x, z, ry, stack) => { const g = new THREE.Group(); g.position.set(x, 0, z); g.rotation.y = ry; scene.add(g);
  for (let i = 0; i < stack; i++) box(1.2, 0.14, 1.0, M.wood, 0, 0.08 + i * 0.15, 0, g); return g; };
pallet(-8.2, 6.5, 0.4, 4); pallet(6.8, 7.4, -0.2, 3); pallet(12.2, -5.0, 1.1, 5);

/* workbench with the vise you are going to be told to clean */
const benchtop = new THREE.Group(); benchtop.position.set(-8.6, 0, 1.2); scene.add(benchtop);
box(2.6, 0.08, 0.8, M.steel, 0, 0.92, 0, benchtop);
for (const sx of [-1.15, 1.15]) for (const sz of [-0.3, 0.3]) {
  const leg = box(0.07, 0.9, 0.07, M.dark, sx, 0.45, sz, benchtop);
}

}
function stepChips(dt) {
  for (let i = NEW_CHIPS.length - 1; i >= 0; i--) {
    const c = NEW_CHIPS[i]; c.userData.v.y -= 9.8 * dt;
    c.position.addScaledVector(c.userData.v, dt);
    c.rotation.x += dt * 6; c.rotation.z += dt * 5;
    if (c.position.y < 0.03) { c.userData.v.set(0, 0, 0); c.position.y = 0.03; }
  }
  if (NEW_CHIPS.length > 260) { const c = NEW_CHIPS.shift(); scene.remove(c); c.geometry.dispose(); c.material.dispose(); }
}

/* ── AUDIO — §13 as a gameplay system, fed by world.cutAcoustics ──────────
   Nothing here decides what anything sounds like. `world.cutAcoustics` derives
   the audible state from the kernel's own power_frac / F_peak_N, and audio.mjs
   turns that into gain. The page only says WHERE it is. */
let AUD = null;
try { AUD = createAudio({ busy: true }); } catch (e) { console.warn('audio unavailable', e); }
const AUD_MACHINES = { mine: 'vmc1', OTHER1: 'vmc2', OTHER2: 'vmc3' };

function audioGo() {
  if (!AUD || audioReady) return;

}
/* ── THE BRIDGE FROM KERNEL RECORD → ACOUSTICS ────────────────────────────
   These are DIFFERENT VOCABULARIES and joining them is exactly where a page
   can lie about the physics. world.cutAcoustics reads `step.n` (CONSTANT
   rpm), `step.power_frac` (0..1 of rated) and `step.b_radial_mm`; the kernel
   history record carries `n_rpm`, `power_kW` and `bite_effective_um`. Passing
   the raw record is silent (n is the PASS NUMBER) — measured, not guessed.
   One adapter, one place, and it reads only real record fields. */
function acousticsFrom(rec, g, { rubbing = false, verdict } = {}) {
  if (!rec) return W.idleAcoustics(g.mach, { rpmFrac: 0, spindle_on: g.machine.spindle_on });
  return W.cutAcoustics({
    n: rec.n_rpm,
    power_frac: rec.power_kW / g.mach.power_max_kW,
    b_radial_mm: (rec.bite_effective_um ?? rec.bite_realised_um ?? 0) / 1000,
    F_peak_N: rec.force_N,
  }, { z: g.tool?.z ?? 1, rubbing, verdict: verdict ?? rec.verdict });
}

const DIALS = [10, 20, 50, 100, 200, 400];
let biteCmd_um = 0, stickout = 45;

function handleMachineKeys(e) {
  const atMachine = eye.distanceTo(MACHINE_NEAR) < 4.2;

}

/* ── THE VERBS — every number from the kernel, none from here ───────────── */
/* OPERATION TIME. The kernel self-reports the clock cost of what you do —
   a measurement costs half a minute, a 20-minute spindle run costs 20. Under
   the two-clock design that cost is REAL, so it is accumulated here and the
   kernel's own wall-clock advance is discarded (else it is counted twice).
   NOTE: GAME is the STATE object; the functions live on the module G. */
let opMin = 0;
function kernelJob(fn, ...args) {
  const before = GAME.clock_min;
  const out = fn(GAME, ...args);
  const consumed = GAME.clock_min - before;
  GAME.clock_min = before;
  if (consumed > 0) { opMin += consumed; GAME.clock_min = clocks.job_min + opMin; }
  return out;
}
function needCalipers() {
  if (CARRIED.calipers) return true;
  say('You', 'Nothing to measure with. The calipers are on the bench by the machine.');
  return false;
}
function doMeasure() {
  if (!needCalipers()) return;
  SEEN.measured = true;
  if (phase === 'ARRIVE') phase = 'MEASURE';
  const r = kernelJob(G.measure, { samples: 3, seed: 7 });
  lastRead = { mm: r.reading_mm, sigma_um: r.sigma_um, partC: r.partC,
               at_min: GAME.clock_min, coldDia_at_measure: r.coldDia_mm };
  const bore = W.boreGeometry(GAME, G.partGrowth_um);
  const off = r.reading_mm - GAME.job.nominal_mm;
  logLine(`Gauge says <b>Ø${r.reading_mm.toFixed(4)}</b> mm at ${r.partC.toFixed(1)} °C ` +
    `(±${r.sigma_um.toFixed(2)} µm) — ${(off * 1000).toFixed(0)} µm from nominal. ` +
    `<b>${bore.stock_to_band_um.toFixed(0)} µm</b> of radius left under the top of the band.`);
  if (!earlSaid.corrected && Math.abs(off) > 2) {
    earlSaid.corrected = true; SEEN.corrected = true;
    setTimeout(() => say('Earl', "\u201cYou're measuring the bell-mouth. Back the thumbwheel " +
      "off, feel it touch, then read it. Don't squeeze the jaws.\u201d"), 2400);
  }
}
function doTouchOff() {
  const g = GAME;
  if (!g.tool) return say('You', 'No bar in the spindle.');
  /* the datum is set ONCE, in the cold frame, and never re-referenced */
  if (g.machine.edgeR_cold_mm === null) {
    g.machine.edgeR_cold_mm = g.part.holeDia_cold_mm / 2;
    GAME.machine.refSpindleC = g.machine.spindleC;
    GAME.machine.refScrewC = g.machine.screwC;
    logLine('<b>Touch-off.</b> Dial zeroed on the wall as it stands. Every number from ' +
      'here is relative to this datum.');
    say('You', 'The bar just kissed the wall. Dial is zero here.');
  } else toast('Already touched off.', 1600);
}
function doWarmUp() {
  const g = GAME;
  if (g.machine.spindle_on) return toast('Already running.', 1600);
  const b4 = { s: g.machine.spindleC, r: g.machine.screwC, p: g.part.partC };
  kernelJob(G.warmUp, 20);
  g.machine.spindle_on = true;
  logLine(`Spindle run <b>20 min</b>. Spindle ${b4.s.toFixed(1)} → ${g.machine.spindleC.toFixed(1)} °C, ` +
    `part ${b4.p.toFixed(1)} → ${g.part.partC.toFixed(1)} °C. ` +
    `Thermal edge offset now <b>${G.edgeOffset_um(g).toFixed(1)} µm</b>.`);
  if (!earlSaid.warm) { earlSaid.warm = true;
    setTimeout(() => say('Earl', "\u201cHe\u2019s got you warming spindles now. " +
      "Just don\u2019t stand there watching it, it\u2019ll take twenty minutes either way.\u201d"), 2000); }
}
function doRough() {
  const g = GAME;
  if (!g.tool) return say('You', 'Load a bar first — they\u2019re on the board.');
  g.machine.spindle_on = true;
  if (g.machine.edgeR_cold_mm === null) doTouchOff();
  /* leave a real allowance: roughing is repeats, not decisions (§77) */
  const r = kernelJob(G.roughTo, { target_dia_mm: g.job.band_high_mm - 0.008,
    bite_mm: 0.3, feed_mm_rev: 0.12, vc: 120 });
  if (!r || !r.ok || !r.passes.length) return toast('Nothing left to rough.', 1800);
  const last = r.passes[r.passes.length - 1];
  chipsFromPass(last, g.mat);
  if (audioReady) { AUD.cutEnter('mine', { tooth_Hz: 60, gain: 0.3 }); AUD.chipFall(1); }
  /* What the DIAL holds — not what the part is. After roughing, the dial offset
     and the true radius have diverged by the accumulated surplus, and that gap
     IS the lesson. Printing the true radius here would destroy it. */
  const dialR_um = last.edge_coldR_mm * 1000;
  const nomR_um = (g.job.nominal_mm / 2) * 1000;
  logLine(`Roughed <b>${r.passes.length} passes</b> in ${r.minutes.toFixed(1)} min. ` +
    `Dial now reads <b>${dialR_um.toFixed(0)} µm</b> radius. ` +
    `Last pass: dial ${last.bite_cmd_um.toFixed(0)} µm, removed ${last.bite_realised_um.toFixed(1)} µm.`);
  toast(`Roughing done. The dial says ${dialR_um.toFixed(0)} µm — <b>that is not the size.</b> ` +
    `It has added the surplus on every pass. Measure, then sneak up on ${nomR_um.toFixed(0)}.`, 5600);
}
function doCut() {
  const g = GAME;
  if (!g.tool) { say('You', 'The spindle\u2019s empty. Bars are on the board behind you.'); return; }
  if (biteCmd_um <= 0) { toast('Dial is at zero. Pick a cut on 1\u20136.', 2000); return; }
  if (g.machine.edgeR_cold_mm === null) doTouchOff();
  const res = kernelJob(G.cutOnce, { bite_mm: biteCmd_um / 1000, feed_mm_rev: 0.12, vc: 120, label: 'bored' });
  if (!res.ok) {
    if (res.why === 'RUBBING') {
      toast('<b>RUBBING.</b> The edge is not engaging — it is dragging on the wall.', 4200);
      say('Earl', "\u201cHear that? That's not cutting. Back it off and take a real bite.\u201d");
      if (audioReady) AUD.setMachine('mine',
        W.cutAcoustics({}, { rubbing: true }), { distance_m: 3, gain: 1 });
    } else if (res.why === 'RUBBING_DANGER' || res.why === 'CHATTER_DANGER') {
      toast(`<b>${res.why.replace('_', ' ')}.</b> Regenerate the job — the insert is done.`, 6000);
    } else toast(`No cut: ${res.why}`, 2600);
    return;
  }
  const rec = res.rec;
  const info = chipsFromPass(rec, g.mat);
  g.machine.spindle_on = true;
  if (audioReady) { AUD.cutEnter('mine', { tooth_Hz: 60, gain: 0.3 }); AUD.clack({ gain: 0.4, pitch: 1200 }); }
  const surplus = rec.bite_realised_um - rec.bite_cmd_um;
  logLine(`Pass ${rec.n}: dial <b>${rec.bite_cmd_um.toFixed(0)} µm</b> → removed ` +
    `<b>${rec.bite_realised_um.toFixed(1)} µm</b> (${surplus >= 0 ? '+' : ''}${surplus.toFixed(1)}). ` +
    `Dial is now at ${(rec.edge_coldR_mm * 1000).toFixed(0)} µm radius. ` +
    `Measure it if you want to know where it actually is.`);
  if (rec.n === 1) toast(`<b>${info.colour_name} chip.</b> ${(info.t2_mm * 1000).toFixed(0)} µm thick ` +
    `— the dial said ${rec.bite_cmd_um.toFixed(0)}.`, 4600);
  if (rec.n === 4) toast(`Every pass has cost you <b>${surplus.toFixed(1)} µm</b> more wall than the dial promised. ` +
    `The surplus is a constant, not a percentage.`, 5200);
  if (phase === 'ARRIVE' || phase === 'MEASURE') phase = 'CUTTING';
}
function doInspect() {
  const v = G.inspect(GAME);
  const r = kernelJob(G.ship);
  /* NOW the truth may be shown — the part has left your hands. */
  revealed = {
    true_mm: GAME.part.holeDia_cold_mm,
    err_um: (GAME.part.holeDia_cold_mm - GAME.job.nominal_mm) * 1000,
    read_mm: lastRead ? lastRead.mm : GAME.part.holeDia_cold_mm,
    gauge_err_um: lastRead ? (lastRead.mm - lastRead.coldDia_at_measure) * 1000 : 0,
  };
  if (audioReady) AUD.clack({ gain: 0.6, pitch: 700, kind: 'steel' });
  if (v.verdict === 'ACCEPTED') {
    say('Earl', "\u201cThat's in. Put it on the bench, I'll get it on the van.\u201d");
    toast(`<b>ACCEPTED.</b> ${r.net >= 0 ? '+' : ''}£${r.net}` +
      (r.late ? ' — past the courier' : '') + `<br>` + revealLine(), 10000);
    logLine(`<b>ACCEPTED</b> at ${G.hhmm(GAME.clock_min)}. ${r.note}`);
    phase = 'DONE';
  } else {
    say('Earl', v.verdict === 'UNDERSIZE — SCRAP'
      ? "\u201cIt's under. There's no putting metal back in a hole.\u201d"
      : "\u201cIt's over. You can still take more out — it's not scrap yet.\u201d");
    toast(`<b>${v.verdict}</b> — band ${GAME.job.band_low_mm.toFixed(3)}–${GAME.job.band_high_mm.toFixed(3)}.` +
      `<br>` + revealLine(), 10000);
    logLine(`<b>${v.verdict}</b> — ${r.note}`);
  }
  SEEN.corrected = true;
}

/* ── THE LOOK-AT PROMPT ─────────────────────────────────────────────────── */
let lookingAt = null;
function doLook() {
  if (lookingAt && lookingAt.act) lookingAt.act();
}
function updateLook() {
  raycaster.setFromCamera({ x: 0, y: 0 }, camera);
  const cands = LOOK.filter((L) => !L.when || L.when());
  const hits = raycaster.intersectObjects(cands.map((c) => c.obj), true);
  let hit = null;
  if (hits.length) {
    let o = hits[0].object;
    while (o && !cands.some((c) => c.obj === o)) o = o.parent;
    hit = cands.find((c) => c.obj === o) || null;
  }
  lookingAt = hit;
  $('look').style.opacity = hit ? '1' : '0';
  if (hit) {
    $('lkName').textContent = hit.name;
    /* §53: what you can even SEE depends on what you have done */
    const p = W.perceptionOf({ crude: '', material: '', process: '', engineer: '' }, SEEN);
    $('lkAct').innerHTML = `<span class="verb">E</span> ${hit.verb}` +
      (p.layer >= 2 ? ' · <span style="opacity:.6">you know more about this than you did at 5:55</span>' : '');
  }
}

/* ── §104: THE FIRST HOUR, staged on the clock ──────────────────────────── */
/* The opening screen is diegetic — it is the yard outside the door, not a
   menu. It is filled BEFORE the player clicks, because a player who clicks an
   unreadable screen has been told nothing. */
function paintGate() {
  $('gBig').innerHTML = 'Half past five in the morning.<br>The lights are already on.';
  $('gSub').innerHTML = 'You are outside the roll-up door of Halvorsen Pumps\u2019 machine shop. ' +
    'Through it: three spindles already running, a compressor, and somebody\u2019s radio.<br><br>' +
    'Your shift starts at six. Nobody has come out to meet you.';
  $('gGo').textContent = 'Click to walk in.';
}
paintGate();

const BEATS = [
  { at: 355.4, done: false, run() {
      logLine('<b>05:55.</b> On the floor. Spindles already turning \u2014 those are not your machines.');
      toast('Second shift is still finishing. Yours starts at six.', 5200);
  } },
  { at: 356.5, done: false, run() {
      say('Earl', "\u201cYou the new one? Earl. I run this cell.\u201d Then, without waiting: " +
        "\u201c<b>Clean that vise and bring me the parallels.</b>\u201d");
      logLine('Earl. Cell lead. He did not shake hands and he has already gone back to his work.');
  } },
  { at: 359, done: false, run() {
      if (CARRIED.parallels) return;
      say('Earl', "\u201cParallels. Long bench, far end, by the cold saw.\u201d", [
        ['What are parallels?', () => {
            earlSaid.parallels = 1;
            say('Earl', "\u201cFlat bars, both exactly the same height. You stand the part on " +
              "them so the bar can break through and not hit the table. They're on the long " +
              "bench with the rest of the bars. Look for the ones that aren't round.\u201d");
            logLine('<b>You had to ask what parallels are.</b> Nobody wrote it down anywhere.');
        }],
      ]);
  } },
  { at: 363, done: false, run() {
      if (SEEN.measured) return;
      say('Earl', "\u201cRight. <b>Measure that bore and tell me what it is.</b>\u201d", [
        ['Measure it', () => doMeasure()],
        ['Say the traveler already gave the size', () => {
            say('Earl', "\u201cThe traveler tells you what it SHOULD be. I'm asking what it IS. " +
              "Those are different numbers and one of them is a fact.\u201d");
        }],
      ]);
  } },
  { at: 369, done: false, run() {
      if (GAME.tool) return;
      say('Earl', "\u201cBar's on the board. Take the \u00d820 and keep it short \u2014 long bars " +
        "sing. Dial it and sneak up on it. Job's due half ten.\u201d");
      logLine('Job: <b>\u00d840 H6, 30 deep</b> \u2014 band is 16 \u00b5m wide. Due 10:30. Rate \u00a31,850.');
  } },
  { at: 373, done: false, run() {
      if (GAME.history.length) return;
      say('Earl', "\u201cYou know where the calipers are. Measure after every pass \u2014 " +
        "I don't care if you're sure.\u201d");
      logLine('<b>The tool board is behind you.</b> Load a bar, touch off, then dial and cut.');
  } },
];

/* ── ENTRANCE ───────────────────────────────────────────────────────────── */
let entered = false;
function enter() {
  if (entered) return; entered = true;
  $('gate').style.display = 'none';
  renderer.domElement.requestPointerLock?.();
  audioGo();                       // browsers only allow audio from a gesture
  GEAR();
}
function GEAR() {
  GAME = G.newGame();
  clocks.world_min = START_SHIFT_MIN;
  clocks.job_min = START_SHIFT_MIN;   // your clock starts at 05:55 too
  clocks.job_taken = true;            // the shift is yours; the deadline is what can hurt you
  opMin = 0;
  GAME.clock_min = clocks.job_min;
  earlIdleSince = START_SHIFT_MIN;
  logLine('<b>05:55.</b> Clocked on. Shift starts at 06:00.');
}
$('gate').onclick = enter;
/* clicking back into the canvas re-captures the mouse without restarting */
renderer.domElement.addEventListener('click', () => {
  if (entered) { renderer.domElement.requestPointerLock?.(); audioGo(); }
});

/* ── MAIN LOOP ──────────────────────────────────────────────────────────── */
const SPD_WALK = 2.5, SPD_RUN = 5.0;
let prev = performance.now(), fpsN = 0, fpsT = prev, FPS = 0;

function frame(now) {
  requestAnimationFrame(frame);
  const dtReal = Math.min((now - prev) / 1000, 0.25); prev = now;
  fpsN++; if (now - fpsT > 500) { FPS = fpsN / ((now - fpsT) / 1000); fpsN = 0; fpsT = now; }

  if (entered && GAME) {
    /* ── THE TWO CLOCKS, and why there are two ─────────────────────────────
       `world_min` is the WORLD's pace and is purely for life: light, machines
       cycling, the shift moving. `job_min` is YOUR clock and it is the one the
       deadline is measured in — it only starts once the work is yours, and it
       runs at half the ambient rate so that 8 h of shift is ~80 real minutes.

       The invariant, from world.mjs and kept here: you can lose this job for a
       DECISION, never for taking a long time to UNDERSTAND something. Nothing
       below may punish the player for being new. */
    W.advanceClocks(clocks, dtReal);
    GAME.clock_min = clocks.job_min + opMin;
    if (clocks.world_min < GAME.clock_min) clocks.world_min = GAME.clock_min;

    /* §104 beats — keyed to YOUR clock, not the world's */
    for (const b of BEATS) if (!b.done && GAME.clock_min >= b.at) { b.done = true; b.run(); }

    /* he stops looking up — keyed to lateness, not to a nag timer */
    if (GAME.clock_min - lastEarlAt > 3 && GAME.clock_min - earlIdleSince > 7) {
      const late = GAME.clock_min > GAME.job.deadline_min - 20;
      say('Earl', P.EARL_LINES[late ? 'impatient_3' : 'impatient_2'][0]);
      earlIdleSince = GAME.clock_min; lastEarlAt = GAME.clock_min;
    }

    /* movement */
    const fwd = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
    const rgt = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
    const mv = new THREE.Vector3();
    if (keys.KeyW) mv.add(fwd); if (keys.KeyS) mv.sub(fwd);
    if (keys.KeyD) mv.add(rgt); if (keys.KeyA) mv.sub(rgt);
    if (mv.lengthSq()) {
      mv.normalize().multiplyScalar((keys.ShiftLeft || keys.ShiftRight ? SPD_RUN : SPD_WALK) * dtReal);
      eye.add(mv);
      eye.x = cl(eye.x, -ROOM.w / 2 + 1, ROOM.w / 2 - 1);
      eye.z = cl(eye.z, -ROOM.d / 2 + 1, ROOM.d / 2 - 1);
      earlIdleSince = clocks.world_min;   // walking around is not idling
    }
    /* head bob — small, and it stops when you stop */
    const bob = mv.lengthSq() ? Math.sin(now / 145) * 0.012 : 0;
    if (shake > 0) shake = Math.max(0, shake - dtReal * 0.09);
    const sh = shake * (Math.random() - 0.5) * 2;

    camera.position.set(eye.x + sh, eye.y + bob + sh * 0.6, eye.z);
    camera.rotation.set(pitch, yaw, 0, 'YXZ');

    /* machine motion, from the kernel's own commanded rpm */
    const mo = W.machineMotion(GAME);
    spindleGroup.rotation.y = mo.spindleRev * Math.PI * 2;
    screw.rotation.x = mo.feed_mm_min * 0.02 * (now / 1000);
    const cutting = !!(GAME.part.cutting || GAME.history.slice(-1)[0]?.cut_min);
    coolantJet.visible = GAME.machine.spindle_on;
    puddle.visible = GAME.history.length > 2;
    /* light follows the clock — §49, and it is the clock you can SEE */
    const dl = W.daylight(clocks.world_min);
    sun.intensity = 0.25 + 0.55 * (1 - dl.dawn) * (1 - dl.dusk);
    for (const l of LAMPS) l.material.emissiveIntensity = dl.shop_lights ? 2.4 : 0.06;
    for (const pl of scene.children.filter((c) => c.isPointLight)) pl.intensity = dl.shop_lights ? 2.1 : 0.10;

    /* bore geometry re-derived every frame, so the mesh cannot drift off the number */
    if (PART.mesh) {
      const d = GAME.part.holeDia_cold_mm;
      if (Math.abs((PART.mesh.userData.d ?? 0) - d) > 1e-5) {
        PART.mesh.userData.d = d; buildPartMesh(d, GAME.job.bore_depth_mm);
      }
    }
    stepChips(dtReal);
    updateLook();
    machinePanel();

    /* AUDIO — the machine's sound is its state, not a loop (§13) */
    if (audioReady) {
      const last = GAME.history[GAME.history.length - 1];
      const a = GAME.machine.spindle_on
        ? acousticsFrom(last, GAME)
        : W.idleAcoustics(GAME.mach, { rpmFrac: 0, spindle_on: false });
      driveMachineVoice('mine', new THREE.Vector3(0, 1.6, -7), a,
        { chatter_Hz: GAME.mach.fn_Hz, coolant: GAME.machine.spindle_on });
      /* the two machines that are not yours, on their own jobs, always running */
      driveMachineVoice('vmc2', OTHER1.g.position,
        acousticsFrom({ n_rpm: GAME.mach.n_max * 0.55, power_kW: 5.2, bite_effective_um: 1200,
          force_N: 320, verdict: 'CUTS CLEAN' }, GAME),
        { chatter_Hz: 1180 });
      const other3Chatter = Math.sin(now / 2600) > 0.2;
      driveMachineVoice('vmc3', OTHER2.g.position,
        acousticsFrom({ n_rpm: GAME.mach.n_max * 0.31, power_kW: 3.1,
          bite_effective_um: other3Chatter ? 180 : 1900,
          force_N: other3Chatter ? 120 : 260,
          verdict: other3Chatter ? 'CHATTER' : 'CUTS CLEAN' }, GAME),
        { chatter_Hz: 760 });
    }
    /* footsteps — you are a body, and a body makes noise (§50, §51) */
    if (mv.lengthSq()) {
      stepAccum += dtReal * (keys.ShiftLeft || keys.ShiftRight ? 3.1 : 1.9);
      if (stepAccum >= 1) { stepAccum = 0; if (audioReady) AUD.footstep({ gain: 0.5 }); }
    }

    /* HUD */
    $('hJob').textContent = GAME.job.title;
    $('hCli').textContent = `${GAME.job.client} · ${GAME.mat.label}`;
    $('hClock').textContent = G.hhmm(clocks.world_min);
    const late = clocks.world_min > GAME.job.deadline_min;
    $('hDue').textContent = `due ${G.hhmm(GAME.job.deadline_min)}` + (late ? ' — LATE' : '');
    $('hDue').className = 'deadline' + (late ? ' late' : '');
    /* ── R1: TRUTH IS NOT OBSERVATION ──────────────────────────────────────
       `part.holeDia_cold_mm` is the truth. It is NEVER rendered. The only
       diameter the player may see is the last GAUGE reading, with its own
       resolution — so the HUD can be wrong about the part, exactly as a real
       one is. Until you measure, it says so. */
    $('hGauge').textContent = lastRead
      ? `Ø${lastRead.mm.toFixed(4)} ±${lastRead.sigma_um.toFixed(2)} µm`
      : 'not measured';
    $('hBand').textContent = `${GAME.job.band_low_mm.toFixed(3)}–${GAME.job.band_high_mm.toFixed(3)}`;
    $('hMoney').innerHTML = `ON THE DAY <b>£${GAME.money}</b>` + (FPS ? ` <span style="opacity:.45">${FPS.toFixed(0)}fps</span>` : '');
  }
  renderer.render(scene, camera);
}
requestAnimationFrame(frame);

/* ── debug handle (not part of play) ────────────────────────────────────── */
window.INDUSTRIA = {
  scene, camera, renderer, THREE, cell, eye,
  get game() { return GAME; }, clocks, W, G, P,
  get fps() { return FPS; },
  camp: () => ({ eye, yaw, pitch, fps: FPS }),
  /* Press the real buttons without walking. Used by the build gate so the
     acceptance test exercises the same code the player does, not a copy. */
  act: (name) => { const L = LOOK.find((e) => e.name.toLowerCase().includes(name.toLowerCase()));
    if (!L) return { ok: false, why: 'no such thing', have: LOOK.map((e) => e.name) };
    L.act(); return { ok: true, did: L.name }; },
  items: () => LOOK.map((e) => e.name),
  carry: CARRIED, seen: SEEN,
  setBite: (um) => { biteCmd_um = um; },
  cut: doCut, measure: doMeasure, inspect: doInspect, rough: doRough,
  warm: doWarmUp, touch: doTouchOff, vibe: (n) => vibrate(n),
};
</script>
</body>
</html>
